<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Wickwing</title>
<style>
  :root {
    --ink: #0b0712;
    --plum: #1a0d22;
    --ember: #ffd36b;
    --moth: #f6eefc;
    --rose: #e06ea4;
    --glass: rgba(26, 13, 34, 0.42);
    --glass-edge: rgba(255, 226, 170, 0.28);
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html { box-sizing: border-box; height: 100%; background: var(--ink); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--moth);
    font: 14px/1.4 ui-rounded, "Segoe UI", system-ui, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; cursor: crosshair; }
  #game:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ember); letter-spacing: 0.2em; font-size: 12px; text-transform: uppercase; }
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #tpad, #touch button {
    pointer-events: auto; position: absolute; border-radius: 50%;
    background: var(--glass); border: 2px solid var(--glass-edge); color: var(--moth);
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #tpad { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 132px; height: 132px; }
  #tknob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 211, 107, 0.35); border: 2px solid rgba(255, 226, 170, 0.5); }
  #touch button {
    width: 76px; height: 76px; font: 700 11px/1 ui-rounded, "Segoe UI", system-ui, sans-serif; letter-spacing: 0.12em;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  #tjump { right: max(16px, env(safe-area-inset-right, 0px)); }
  #tlant { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 88px); bottom: calc(env(safe-area-inset-bottom, 0px) + 58px) !important; }
  #tcall { width: 52px !important; height: 52px !important; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 176px); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px) !important; }
  #ttalk { width: 60px !important; height: 60px !important; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 8px); bottom: calc(env(safe-area-inset-bottom, 0px) + 104px) !important; }
  #tpause { width: 44px !important; height: 44px !important; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); bottom: auto !important; }
  #touch button.on { background: rgba(255, 211, 107, 0.4); }
  noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { #tknob { transition: none; } }
</style>
<div id="stage">
  <canvas id="game" tabindex="0" aria-label="Wickwing game. A and D move, W or Space jumps and glides. Aim with the mouse and click to throw the lantern, click again to blink to it, and right-click to call it back."></canvas>
  <div id="loading">Kindling the lantern…</div>
  <noscript>Wickwing needs JavaScript to run.</noscript>
</div>
<div id="touch" hidden>
  <div id="tpad" aria-label="Move and aim"><div id="tknob"></div></div>
  <button id="tlant" data-act="lant" aria-label="Throw lantern or blink">LAMP</button>
  <button id="tcall" data-act="recall" aria-label="Call the lantern back">CALL</button>
  <button id="tjump" data-act="jump" aria-label="Jump, hold to glide">JUMP</button>
  <button id="ttalk" data-act="down" aria-label="Talk or read" hidden>TALK</button>
  <button id="tpause" data-act="pause" aria-label="Pause">II</button>
</div>
<script>
/* ---- src/core.js ---- */
/* WICKWING — deterministic simulation core (no DOM). Runs in the browser and in Node. */
(function (root) {
  'use strict';

  const T = 8;            // tile size in px
  const DT = 1 / 60;      // fixed timestep

  const P = {
    W: 6, H: 9,
    GRAV: 900, GRAV_HOLD: 520, MAX_FALL: 170, FALL_BRAKE: 600,
    GLIDE_FALL: 48, GLIDE_BRAKE: 700, GLIDE_RUN: 66,
    RUN: 80, RUN_ACC: 1000, RUN_DEC: 1300, AIR_ACC: 700, AIR_DEC: 420,
    OVER_DEC_AIR: 240, OVER_DEC_GROUND: 800,
    JUMP_V: 175, COYOTE: 0.1, BUFFER: 0.12,
    PERCH_TIME: 0.9, PERCH_PUSH: 0, HANG_TIME: 1.5,
    BOUNCE_V: 290,
    // the lantern never comes back on its own: it flies until it sticks, or stops once it has fallen
    // L_VOID px out of the room, and returns only when called
    L_GRAV: 560, L_MAXFALL: 260, L_VOID: 32,
    L_RETURN: 420, L_MIN_BLINK: 0.05, L_BOUNCE: 360,
    INHERIT: 0.8, INHERIT_MAX_X: 200, INHERIT_MAX_UP: 240,
    VENT_RISE: 95, VENT_ACC: 1100, VENT_PUSH: 480, L_VENT_ACC: 900, L_VENT_MAX: 150, L_VENT_DRAG: 1400,
    BRAZIER_CD: 2.4, CRUMBLE_DELAY: 0.4, CRUMBLE_RESPAWN: 2.4, DEATH_TIME: 0.8,
    WIND_GROUND: 0.35, WIND_GLIDE: 1.3, WIND_VENT: 0.5, WIND_LANTERN: 0.8,
    ASSIST_DEG: 10,        // target assist bends a throw by up to this much to hit a brazier, bloom or wick
    BLOOM_TILT: 30,        // a tilted bloom flings what bounces off it this many degrees off straight up
    BEAM_V: 270,           // azure and rose lanterns fly straight at this speed
    ROSE_HOPS: 3,          // a rose lantern ricochets this many times, then sticks
    // ---- the lab's mechanics
    EMBER_BACK: 2.5,       // an ember that relit something re-forms after this long
    LIGHT_R: 26,           // a flame holds lightstone, parts nightbriar and melts wax this far (px) from its heart
    HOOK_R: 64,            // ...and a lantern hung on a lamp hook, like a street lamp, this far
    AFTERGLOW: 0.45,       // lightstone stays and briar stays parted this long after the light has gone
    WAX_MELT: 0.5, WAX_SET: 1.4,   // wax melts after this long in the light, and sets again after this long dark
    FLING_DEC: 120,        // how slowly the speed of a swing's fling bleeds away in the air (vs OVER_DEC_AIR)
    GATE_CLOSE: 0.9,       // a gate whose keys are gone falls shut over this long
    DRIP_G: 700, DRIP_MAX: 300,
    DRY: 0.6,              // a wick put out by water won't take the moth's own spark until it's been dry this long
    RAIN_VY: 300,          // rain falls this fast from the room's top: a shower starts and stops at depth y that much later
    WATER_VY: 220,         // water from a pipe falls this fast: opening, its front comes down the column; shutting, its tail
    CATCH_DELAY: 0.8,      // a candle lit with Taper's gold passes it to the candles near it this long after it caught
    CANDLE_DRY: 0.25,      // a candle put out by water won't take a flame again till it's been dry this long
    CATCH_R: 44,           // ...those this near (px, heart to heart) with nothing solid between
    STREET_R: 44,          // a street lamp (a hooded candle on a bracket) lights this far
    FIRE_SPREAD: 0.09, BRIAR_BURN: 0.45, WOOD_BURN: 0.8, BRIAR_REGROW: 5,
    PALE_SPEED: 0.62, PALE_GRAV: 150, PALE_MAXFALL: 40, PALE_DRAG: 90, PALE_WIND: 1.0, PALE_VENT: 1.6,
    SNUFF_SENSE: 64, SNUFF_V: 72, SNUFF_ACC: 420, SNUFF_FEED: 1.2,
    TIDE_BELOW: 9,         // after a death the tide starts this many tiles under where the moth comes back
  };

  // tile codes
  const EMPTY = 0, SOLID = 1, GRATE = 2, ONEWAY = 3, THORN = 4, CRUMBLE = 5, GATE = 6, VENT = 7, EXIT = 8;
  // a fake wall looks like stone and stops the lantern, but the moth walks through it; a secret exit leads into
  // the room's hidden side room
  const FAKE = 9, SECRET = 10;
  // a back door leads to the previous room of the journey, as its exit led here
  const BACK = 11;
  // the lab's tiles, which answer to light and fire: lightstone is solid only where a flame shines on it; nightbriar
  // kills but for where a flame parts it; wax melts in the light and sets again in the dark; boards burn away
  const GLASS = 12, BRIAR = 13, WAX = 14, WOOD = 15;
  const isDoor = c => c === EXIT || c === SECRET || c === BACK;
  // lantern states
  // AWAY: out through a doorway, flying on (or lying) in the room next door
  const HELD = 0, FLY = 1, STUCK = 2, RET = 3, AWAY = 4;
  // flight results
  const FLYING = 0, HIT_WALL = 1, HIT_BRAZIER = 2, LOST = 3, LEFT = 4, HIT_HOOK = 5, HOVER = 6, TURNED = 7;
  // flames: amber is the moth's own; the others are taken from coloured braziers. Verdant burns twice,
  // azure flies dead straight, rose flies straight and ricochets; gold stops where its arc tops out and hangs there,
  // crimson sets briar and boards alight, pale floats and rides the air.
  const AMBER = 0, VERDANT = 1, AZURE = 2, ROSE = 3, GOLD = 4, CRIMSON = 5, PALE = 6;
  const isBeam = f => f === AZURE || f === ROSE;
  const TILT_S = Math.sin(P.BLOOM_TILT * Math.PI / 180), TILT_C = Math.cos(P.BLOOM_TILT * Math.PI / 180);

  function approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  // throw velocity for an aim: dir = ±1 (side), elev = degrees above horizontal (-90 down .. 90 up).
  // The eight classic directions keep their tuned speeds; angles between them blend smoothly.
  const THROW_ARC = [[-90, 0, 260], [-45, 175, 175], [0, 230, -80], [45, 175, -205], [90, 0, -260]];
  function throwVel(dir, elev) {
    const e = clamp(elev, -90, 90);
    const i = Math.min(3, Math.floor((e + 90) / 45));
    const a = THROW_ARC[i], b = THROW_ARC[i + 1], k = (e - a[0]) / 45;
    return [(a[1] + (b[1] - a[1]) * k) * dir, a[2] + (b[2] - a[2]) * k];
  }
  // an aim as one absolute angle (0 = right, 90 = up) and back
  function toAngle(dir, elev) { return dir > 0 ? elev : 180 - elev; }
  function fromAngle(a) {
    a = ((a % 360) + 540) % 360 - 180;
    return a > 90 ? [-1, 180 - a] : a < -90 ? [-1, -180 - a] : [1, a];
  }
  // launch velocity for a flame: beams go exactly where they are aimed, the others arc (pale lightly, drifting)
  function launchVel(flame, dir, elev) {
    if (flame === PALE) { const v = throwVel(dir, elev); return [v[0] * P.PALE_SPEED, v[1] * P.PALE_SPEED]; }
    if (!isBeam(flame)) return throwVel(dir, elev);
    const a = toAngle(dir, clamp(elev, -90, 90)) * Math.PI / 180;
    return [Math.cos(a) * P.BEAM_V, -Math.sin(a) * P.BEAM_V];
  }

  // search offsets for placing the moth after a blink
  const OFFS = [];
  for (let dy = -6; dy <= 6; dy++) for (let dx = -5; dx <= 5; dx++) OFFS.push([dx, dy]);
  OFFS.sort((a, b) => (a[0] * a[0] + a[1] * a[1]) - (b[0] * b[0] + b[1] * b[1]) || a[1] - b[1]);
  const OFFS_V = [[0, 0]];
  for (let d = 1; d <= 8; d++) { OFFS_V.push([0, -d]); OFFS_V.push([0, d]); }
  for (const o of OFFS) if (o[0] !== 0) OFFS_V.push(o);

  // where a moving brazier is at time t (seconds on its room's clock), and how fast it's going: into out (x, y, vx,
  // vy). A swing is a pendulum hanging len px from its pivot; a rail runs from (x0, y0) to (x1, y1) and back each
  // period, easing at the ends (or at an even pace, lin). ph: how far through its period it starts
  function movingAt(b, t, out) {
    const m = b.mv;
    if (m.k === 0) {
      const w = 2 * Math.PI / m.per, ph = w * t + m.ph * 2 * Math.PI, a = m.amp * Math.sin(ph), da = m.amp * w * Math.cos(ph);
      out.x = m.px + Math.sin(a) * m.len; out.y = m.py + Math.cos(a) * m.len;
      out.vx = Math.cos(a) * m.len * da; out.vy = -Math.sin(a) * m.len * da;
    } else {
      const u = (t / m.per + m.ph) % 1;
      let s, ds;
      if (m.lin) { s = u < 0.5 ? u * 2 : 2 - u * 2; ds = (u < 0.5 ? 2 : -2) / m.per; }
      else { s = 0.5 - 0.5 * Math.cos(u * 2 * Math.PI); ds = Math.PI * Math.sin(u * 2 * Math.PI) / m.per; }
      out.x = m.x0 + (m.x1 - m.x0) * s; out.y = m.y0 + (m.y1 - m.y0) * s;
      out.vx = (m.x1 - m.x0) * ds; out.vy = (m.y1 - m.y0) * ds;
    }
    if (out === b) { b.tx = Math.floor(b.x / T); b.ty = Math.floor(b.y / T); }
    return out;
  }

  function parseRoom(def, index) {
    const rows = def.map;
    const h = rows.length;
    let w = 0;
    for (const r of rows) w = Math.max(w, r.length);
    const n = w * h;
    const room = {
      index, def, name: def.name, biome: def.biome, w, h, pw: w * T, ph: h * T,
      tiles: new Uint8Array(n), thornDir: new Int8Array(n), crumbleIdx: new Int16Array(n).fill(-1),
      raw: rows.map(r => r.padEnd(w, ' ')),
      spawn: { x: 0, y: 0 }, exits: [], secrets: [], fakes: [], braziers: [], bells: [], vents: [], petals: [], lamps: [],
      gateTiles: [], crumbles: [], great: null,
      wind: def.wind || null, dark: def.dark || 0, hints: def.hints || [], look: def.look || '',
      // the lab's things: embers, lamp hooks, the tiles that answer to light and fire (react, and each tile's index
      // into it), the dark things that eat light (roosts), gates each opened by their own keys, falling water
      embers: [], hooks: [], react: [], reactIdx: new Int16Array(n).fill(-1), snuffers: [], gates: [], gateOf: new Int8Array(n).fill(-1),
      falls: [], drips: [], tide: null, rain: def.rain || null,
      // how long a candle burning Taper's gold takes to pass it on (the room's own pace, else the usual)
      catchDelay: def.catch || P.CATCH_DELAY,
      // a room whose throws land on nothing the target assist knows (glass ledges): it bends none of them
      noAssist: def.noassist ? 1 : 0,
    };
    const burns = new Map((def.burns || []).map(b => [b[0] + ',' + b[1], b[2]]));
    // street lamps: candles in a hooded lamp on a bracket, which the rain can't reach
    const hooded = new Set((def.hooded || []).map(b => b[0] + ',' + b[1]));
    // gold embers: bare sparks in the chain of Taper's gold (burning, they relight a lantern the rain has just put out)
    const goldEmbers = new Set((def.goldembers || []).map(b => b[0] + ',' + b[1]));
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < w; x++) {
        const ch = row[x] || ' ';
        const i = y * w + x;
        let code = EMPTY;
        switch (ch) {
          case '#': code = SOLID; break;
          case 'H': code = GRATE; break;
          case '=': code = ONEWAY; break;
          case 'x': code = THORN; break;
          case '%': code = CRUMBLE; room.crumbleIdx[i] = room.crumbles.length; room.crumbles.push({ tx: x, ty: y }); break;
          case 'G': code = GATE; room.gateTiles.push({ tx: x, ty: y }); break;
          case 'V': code = VENT; break;
          case 'E': code = EXIT; room.exits.push({ tx: x, ty: y }); break;
          case 'D': code = FAKE; room.fakes.push({ tx: x, ty: y }); break;
          case 'Q': code = SECRET; room.secrets.push({ tx: x, ty: y }); break;
          case 'P': code = BACK; break;
          case 'S': room.spawn = { x: x * T + 1, y: (y + 1) * T - P.H }; break;
          // B burns amber; 1 2 3 burn verdant, azure and rose; 4 5 6 gold, crimson and pale
          case 'B': case '1': case '2': case '3': case '4': case '5': case '6':
            room.braziers.push({ x: x * T + 4, y: y * T + 4, tx: x, ty: y, flame: ch === 'B' ? AMBER : +ch }); break;
          // a bellbloom: upright (F), or tilted to fling up and to the left (<) or right (>)
          case 'F': case '<': case '>': room.bells.push({ tx: x, ty: y, x: x * T + 4, y: y * T + 4, tilt: ch === '<' ? -1 : ch === '>' ? 1 : 0 }); break;
          case 'o': room.petals.push({ x: x * T + 4, y: y * T + 4, id: index + ':' + room.petals.length }); break;
          // a wick: gold (c) takes any flame; a coloured one only its own: amber (k), verdant (v), azure (z), rose (r),
          // gold (y), crimson (q), pale (u). A candle (i) takes any flame, and burns down again (burn: its seconds)
          case 'c': case 'k': case 'v': case 'z': case 'r': case 'y': case 'q': case 'u':
            room.lamps.push({ x: x * T + 4, y: y * T + 4, tx: x, ty: y, flame: ch === 'c' ? -1 : 'kvzryqu'.indexOf(ch) }); break;
          case 'i': room.lamps.push({ x: x * T + 4, y: y * T + 4, tx: x, ty: y, flame: -1, burn: burns.get(x + ',' + y) || def.candle || 6, hood: hooded.has(x + ',' + y) ? 1 : 0, ember: goldEmbers.has(x + ',' + y) ? 1 : 0 }); break;
          case 'L': room.great = { x: x * T + 4, y: y * T + 4, tx: x, ty: y }; break;
          // an ember: a spark hanging in the air that relights a spent lantern, or charges a thrown one
          case '*': room.embers.push({ x: x * T + 4, y: y * T + 4, tx: x, ty: y, flame: AMBER }); break;
          // a lamp hook: the lantern hangs on it, and while it does, the hook's gate stays open
          case 'j': room.hooks.push({ x: x * T + 4, y: y * T + 3, tx: x, ty: y }); break;
          // a roost of the things that eat light
          case 'n': room.snuffers.push({ x: x * T + 4, y: y * T + 4, tx: x, ty: y }); break;
          case '~': code = GLASS; break;
          case '&': code = BRIAR; break;
          case 'w': code = WAX; break;
          case '+': code = WOOD; break;
        }
        if (code >= GLASS) { room.reactIdx[i] = room.react.length; room.react.push({ tx: x, ty: y, kind: code }); }
        room.tiles[i] = code;
      }
    }
    // braziers that move: swinging on a chain from a pivot, or running to and fro along a rail. Their place at any
    // moment comes from the room's clock (movingAt), so they swing on while the moth dies and comes back
    const FLAME_OF = { amber: AMBER, verdant: VERDANT, azure: AZURE, rose: ROSE, gold: GOLD, crimson: CRIMSON, pale: PALE };
    for (const s of def.swings || []) {
      const b = { x: 0, y: 0, tx: 0, ty: 0, vx: 0, vy: 0, flame: FLAME_OF[s.flame || 'amber'], grip: s.grip, cold: s.cold ? 1 : 0,
        mv: { k: 0, px: s.x * T + 4, py: s.y * T + 4, len: s.len * T, amp: (s.amp || 40) * Math.PI / 180, per: s.period || 2 * Math.PI * Math.sqrt(s.len * T / P.GRAV), ph: s.phase || 0 } };
      movingAt(b, 0, b); room.braziers.push(b);
    }
    for (const s of def.rails || []) {
      const b = { x: 0, y: 0, tx: 0, ty: 0, vx: 0, vy: 0, flame: FLAME_OF[s.flame || 'amber'], grip: s.grip, cold: s.cold ? 1 : 0,
        mv: { k: 1, x0: s.x0 * T + 4, y0: s.y0 * T + 4, x1: s.x1 * T + 4, y1: s.y1 * T + 4, per: s.period || 4, ph: s.phase || 0, lin: s.ease === 'linear' } };
      movingAt(b, 0, b); room.braziers.push(b);
    }
    // falling water: a fall pours from its tile down to the first stone under it; a drip lets a drop go every
    // period. Pulsing falls (period, on) run for the first `on` of each period
    const wet = (x, y) => x >= 0 && x < w && y >= 0 && y < h && [SOLID, ONEWAY, CRUMBLE, VENT, GATE, FAKE].includes(room.tiles[y * w + x]);
    for (const f of def.falls || []) {
      let y1 = f.y + 1;
      while (y1 < h && !wet(f.x, y1)) y1++;
      room.falls.push({ x0: f.x * T, x1: (f.x + (f.w || 1)) * T, y0: f.y * T, y1: y1 * T, per: f.period || 0, on: f.on || 1, off: f.offset || 0 });
    }
    for (const d of def.drips || []) room.drips.push({ x: d.x * T + 4, y: d.y * T + T, per: d.period || 1.5, off: d.offset || 0 });
    // Taper's gold catches from candle to candle: each candle's links are the candles near enough to it, with no
    // stone between their flames
    const stoneAt = (x, y) => { const c = room.tiles[y * w + x]; return c === SOLID || c === GATE || c === VENT || c === CRUMBLE; };
    room.lamps.forEach(a => {
      a.links = [];
      if (!a.burn) return;
      room.lamps.forEach((b, j) => {
        if (b === a || !b.burn || Math.hypot(b.x - a.x, b.y - a.y) > P.CATCH_R) return;
        const n = Math.ceil(Math.hypot(b.tx - a.tx, b.ty - a.ty) * 2);
        for (let k = 1; k < n; k++) {
          const tx = Math.floor((a.x + (b.x - a.x) * k / n) / T), ty = Math.floor((a.y - 3 + (b.y - a.y) * k / n) / T);
          if (stoneAt(tx, ty)) return;
        }
        a.links.push(j);
      });
    });
    if (def.tide) room.tide = { y: def.tide.y * T, v: (def.tide.speed || 2) * T, wait: def.tide.delay || 0, top: (def.tide.top || 0) * T, below: def.tide.reset || P.TIDE_BELOW, from: def.tide.from || 0 };
    // gates: each opens while its keys are held (wicks and candles lit, a hook with the lantern on it). A room's
    // gates in `gates` ([x0, y0, x1, y1] and the tiles of their keys) close again when a key is lost, unless
    // latched; without that, all its gate tiles are one gate that every lamp in the room opens, for good
    const gdefs = def.gates || [{ x0: 0, y0: 0, x1: w - 1, y1: h - 1, keys: room.lamps.map(l => [l.tx, l.ty]), latch: 1 }];
    for (const g of gdefs) {
      const keys = [];
      for (const [kx, ky] of g.keys || []) {

      this.t = 0;
      for (const b of r.braziers) if (b.mv) movingAt(b, 0, b);
      if (cp && cp[3]) this.arrive(cp);
      if (!first) this.emit('respawn', p.x, p.y);
    }

    // ---------- collision helpers ----------
    solidTile(tx, ty) {
      const r = this.room;
      if (ty >= r.h) return false;
      if (ty < 0) {
        const cx = tx < 0 ? 0 : tx >= r.w ? r.w - 1 : tx;
        return !isDoor(r.tiles[cx]);
      }
      if (tx < 0 || tx >= r.w) {
        const cx = tx < 0 ? 0 : r.w - 1;
        return !isDoor(r.tiles[ty * r.w + cx]);
      }
      const i = ty * r.w + tx;
      const c = r.tiles[i];
      if (c === SOLID || c === GRATE || c === VENT) return true;
      if (c === CRUMBLE) return this.cs[r.crumbleIdx[i]] < 2;
      if (c === GATE) return !this.gOpen[r.gateOf[i]];
      if (c >= GLASS) {
        const s = this.rs[r.reactIdx[i]];
        return c === GLASS ? s === 1 : c === WAX ? s === 0 : c === WOOD ? s !== 2 : false;
      }
      return false;
    }

    solidRect(x, y, w, h) {
      const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 1) / T);
      const y0 = Math.floor(y / T), y1 = Math.floor((y + h - 1) / T);
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.solidTile(tx, ty)) return true;
      return false;
    }

    oneWayBelow(x, yb, w) {
      // yb = pixel row directly under the feet
      if (yb % T !== 0) return false;
      const r = this.room, ty = yb / T;
      if (ty < 0 || ty >= r.h) return false;
      const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 1) / T);
      for (let tx = x0; tx <= x1; tx++) {
        if (tx >= 0 && tx < r.w && r.tiles[ty * r.w + tx] === ONEWAY) return true;
      }
      return false;
    }

    onGround() {
      const p = this.p;
      return this.solidRect(p.x, p.y + 1, P.W, P.H) || this.oneWayBelow(p.x, p.y + P.H, P.W);
    }

    touchThorn(x, y, w, h) {
      const r = this.room;
      const x0 = Math.max(0, Math.floor(x / T)), x1 = Math.min(r.w - 1, Math.floor((x + w - 1) / T));
      const y0 = Math.max(0, Math.floor(y / T)), y1 = Math.min(r.h - 1, Math.floor((y + h - 1) / T));
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
        const i = ty * r.w + tx;
        if (r.tiles[i] !== THORN) continue;
        const d = r.thornDir[i], bx = tx * T, by = ty * T;
        let hx, hy, hw, hh;
        if (d === 0) { hx = bx + 1; hy = by + 3; hw = 6; hh = 5; }
        else if (d === 1) { hx = bx + 1; hy = by; hw = 6; hh = 5; }
        else if (d === 2) { hx = bx; hy = by + 1; hw = 5; hh = 6; }
        else { hx = bx + 3; hy = by + 1; hw = 5; hh = 6; }
        if (overlap(x, y, w, h, hx, hy, hw, hh)) return true;
      }
      return false;
    }

    overlapCode(x, y, w, h, code) {
      const r = this.room;
      const x0 = Math.max(0, Math.floor(x / T)), x1 = Math.min(r.w - 1, Math.floor((x + w - 1) / T));
      const y0 = Math.max(0, Math.floor(y / T)), y1 = Math.min(r.h - 1, Math.floor((y + h - 1) / T));
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (r.tiles[ty * r.w + tx] === code) return true;
      return false;
    }

    ventStrength(x, y, w, h) {
      const vs = this.room.vents;
      const cx = x + w / 2;
      let best = 0;
      for (let i = 0; i < vs.length; i++) {
        const v = vs[i];
        if (cx < v.x0 - 1 || cx > v.x1 + 1) continue;
        if (y + h <= v.yTop || y >= v.yBot) continue;
        const s = clamp((y + h / 2 - v.yTop) / 24, 0.2, 1);
        if (s > best) best = s;
      }
      return best;
    }

    windAt(t) {
      const w = this.room.wind;
      if (!w) return 0;
      if (w.type === 'gust') {
        const ph = ((t + (w.offset || 0)) % w.period) / w.period;
        let s = 0;
        if (ph < w.on) s = Math.min(1, ph / 0.1, (w.on - ph) / 0.1);
        return (w.base || 0) + w.v * s;
      }
      return w.v;
    }

    // ---------- main step ----------
    step(inp) {
      const p = this.p, L = this.L;
      const dt = this.dt;
      this.t += dt;
      this.updateObjects();
      if (this.finale) { this.holdLantern(); return; }
      if (p.dead) {
        p.deadT -= dt;
        if (p.deadT <= 0) this.respawn(false);
        return;
      }
      const wind = this.windAt(this.t);
      this.wind = wind;

      if (inp.jumpP) p.buf = P.BUFFER; else if (p.buf > 0) p.buf -= dt;
      if (p.grounded) p.coyote = P.COYOTE; else if (p.coyote > 0) p.coyote -= dt;
      if (!inp.jump) p.varJump = false;

      // lantern buttons: one throws toward the aim, or blinks to the lantern once it is out; the other calls it back
      if (inp.recallP) this.recall();
      if (inp.lantP) this.lanternPress(inp);
      else if (this.lbuf > 0) {
        // a press made while the lantern was flying home takes effect as soon as it is caught, and one made while it
        // was spent as soon as it's relit (an ember, a brazier, the ground); if nothing relights it, it fizzles
        this.lbuf -= dt;
        if (L.state === HELD && p.spark) { this.lbuf = 0; this.lbufFizz = 0; this.lanternPress(inp); }
        else if (this.lbuf <= 0 && this.lbufFizz) { this.lbufFizz = 0; this.emit('fizzle', p.x, p.y); }
      }

      if (p.perch > 0) {
        p.perch -= dt; p.vx = 0; p.vy = 0; p.gliding = false;
        if (p.hang && inp.x !== 0) p.facing = inp.x;
        // hanging from a brazier that moves, the moth rides with it (and lets go rather than be carried into stone)
        const mb = p.hangB >= 0 ? this.room.braziers[p.hangB] : null, rides = !!(mb && mb.mv);
        if (rides) {
          const nx = Math.round(mb.x - 3), ny = Math.round(mb.y - 6);
          if (this.solidRect(nx, ny, P.W, P.H)) p.perch = 0; else { p.x = nx; p.y = ny; p.rx = 0; p.ry = 0; }
        }
        if (p.buf > 0) {
          this.doJump();
          p.vx = p.perchN * P.PERCH_PUSH;
          // jumping off a moving brazier carries its speed: a swing well let go of flings the moth
          if (rides) this.fling(mb.vx, mb.vy - P.JUMP_V);
          p.perch = 0; p.hang = 0; p.hangB = -1;
        } else if (inp.y > 0 || p.perch <= 0) {
          if (rides) this.fling(mb.vx, mb.vy);
          p.perch = 0; p.hang = 0; p.hangB = -1;
        }
      }
      if (this.room.tide) this.updateTide();
      if (this.sn.length) this.updateSnuffers();

      if (p.perch <= 0) {
        const ix = inp.x, g0 = p.grounded;
        const maxv = (!g0 && inp.jump && p.vy >= 0) ? P.GLIDE_RUN : P.RUN;
        // a fling's speed bleeds away slowly, until the moth lands or slows to a run (or steers against it)
        if (p.fling && (g0 || Math.abs(p.vx) <= maxv)) p.fling = 0;
        const over = p.fling ? P.FLING_DEC : P.OVER_DEC_AIR;
        let acc;
        if (ix !== 0 && Math.abs(p.vx) > maxv && Math.sign(p.vx) === ix) acc = g0 ? P.OVER_DEC_GROUND : over;
        else if (ix !== 0) acc = g0 ? P.RUN_ACC : P.AIR_ACC;
        else acc = g0 ? P.RUN_DEC : (Math.abs(p.vx) > maxv ? over : P.AIR_DEC);
        p.vx = approach(p.vx, ix * maxv, acc * dt);
        if (ix !== 0) p.facing = ix;

        if (p.buf > 0 && p.coyote > 0) this.doJump();

        const hold = inp.jump;
        const vs = this.ventStrength(p.x, p.y, P.W, P.H);
        const g = (p.vy < 0 && hold && p.varJump) ? P.GRAV_HOLD : P.GRAV;
        p.gliding = false;
        if (!p.grounded && vs > 0 && hold) {
          p.gliding = true;
          const tgt = -P.VENT_RISE * vs;
          if (p.vy > tgt) p.vy = Math.max(tgt, p.vy - P.VENT_ACC * dt);
          else p.vy = Math.min(tgt, p.vy + g * dt);
        } else if (!p.grounded && hold && p.vy >= 0) {
          p.gliding = true;
          if (p.vy > P.GLIDE_FALL) p.vy = Math.max(P.GLIDE_FALL, p.vy - P.GLIDE_BRAKE * dt);
          else p.vy = Math.min(P.GLIDE_FALL, p.vy + g * dt);
        } else {
          if (p.vy >= P.MAX_FALL) p.vy = Math.max(P.MAX_FALL, p.vy - P.FALL_BRAKE * dt);
          else p.vy = Math.min(P.MAX_FALL, p.vy + g * dt);
          if (vs > 0 && !p.grounded) p.vy -= P.VENT_PUSH * vs * dt;
        }

        // the wind catches the moth everywhere out in the open, though an updraft's column of air holds it half out of
        // the gale
        if (p.liftVx) {
          if (p.y + P.H <= p.liftY) { if (Math.sign(p.vx) !== Math.sign(p.liftVx) || Math.abs(p.vx) < Math.abs(p.liftVx)) p.vx = p.liftVx; p.liftVx = 0; }
          else if (p.vy > 0 || p.grounded) p.liftVx = 0;
        }
        const snug = this.room.fakes.length && this.overlapCode(p.x, p.y, P.W, P.H, FAKE);   // in a passage, out of the wind
        const wdx = snug ? 0 : wind * dt * (p.grounded ? P.WIND_GROUND : vs > 0 ? P.WIND_VENT : p.gliding ? P.WIND_GLIDE : 1);
        this.moveX(p.vx * dt + wdx);
        this.moveY(p.vy * dt);
      }

      const wasG = p.grounded;
      p.grounded = p.perch <= 0 && p.vy >= 0 && this.onGround();
      if (p.grounded) {
        if (!wasG) this.emit('land', p.x, p.y, p.landV);
        // landing relights a spent lantern with the moth's own amber (not standing in water, and not with the
        // lantern away: there's nothing in its hand to light); an unspent colour is carried on
        if (!p.spark && !p.wet && this.L.state === HELD && this.L.wetT <= 0 && !(this.room.react.length && this.inBriar())) { this.relight(AMBER); this.emit('rekindle', p.x, p.y); }
        this.triggerCrumbles();
      }
      this.interact();
      this.updateLantern(wind);
    }

    doJump() {
      const p = this.p;
      p.vy = -P.JUMP_V; p.buf = 0; p.coyote = 0; p.grounded = false; p.varJump = true;
      this.emit('jump', p.x, p.y);
    }
    // thrown off something moving at (vx, vy): past a run, the speed lasts (see FLING_DEC)
    fling(vx, vy) {
      const p = this.p;
      p.vx = Math.max(-P.INHERIT_MAX_X * 1.5, Math.min(P.INHERIT_MAX_X * 1.5, vx)); p.vy = Math.max(-P.INHERIT_MAX_UP * 1.3, vy);
      p.fling = Math.abs(p.vx) > P.RUN ? 1 : 0;
      if (p.vx) p.facing = Math.sign(p.vx);
      this.emit('fling', p.x, p.y, p.vx, p.vy);
    }

    moveX(a) {
      const p = this.p;
      p.rx += a;
      let m = Math.round(p.rx);
      if (m === 0) return;
      p.rx -= m;
      const s = m > 0 ? 1 : -1;
      while (m !== 0) {
        if (!this.solidRect(p.x + s, p.y, P.W, P.H)) { p.x += s; m -= s; }
        else { if (Math.sign(p.vx) === s) p.vx = 0; p.rx = 0; break; }
      }
    }

    moveY(a) {
      const p = this.p;
      p.ry += a;
      let m = Math.round(p.ry);
      if (m === 0) return;
      p.ry -= m;
      const s = m > 0 ? 1 : -1;
      while (m !== 0) {
        let blocked;
        if (s > 0) blocked = this.solidRect(p.x, p.y + 1, P.W, P.H) || this.oneWayBelow(p.x, p.y + P.H, P.W);
        else blocked = this.solidRect(p.x, p.y - 1, P.W, P.H);
        if (!blocked) { p.y += s; m -= s; continue; }
        if (s < 0) {
          // corner correction: slide around a ceiling corner by up to 2px
          const pref = p.vx >= 0 ? 1 : -1;
          let fixed = false;
          for (let d = 1; d <= 2 && !fixed; d++) {
            for (let k = 0; k < 2; k++) {
              const dir = k === 0 ? pref : -pref;
              if (!this.solidRect(p.x + dir * d, p.y - 1, P.W, P.H) && !this.solidRect(p.x + dir * d, p.y, P.W, P.H)) {
                p.x += dir * d; fixed = true; break;
              }
            }
          }
          if (fixed) continue;
        } else {
          p.landV = p.vy;
        }
        p.vy = 0; p.ry = 0;
        break;
      }
    }

    triggerCrumbles() {
      const p = this.p, r = this.room;
      const yb = p.y + P.H;
      if (yb % T !== 0) return;
      const ty = yb / T;
      if (ty < 0 || ty >= r.h) return;
      const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + P.W - 1) / T);
      for (let tx = x0; tx <= x1; tx++) {
        if (tx < 0 || tx >= r.w) continue;
        const k = r.crumbleIdx[ty * r.w + tx];
        if (k >= 0 && this.cs[k] === 0) { this.cs[k] = 1; this.ct[k] = P.CRUMBLE_DELAY; this.emit('shake', k); }
      }
    }

    updateObjects() {
      const r = this.room, p = this.p, dt = this.dt;
      for (const b of r.braziers) if (b.mv) movingAt(b, this.t, b);
      for (let i = 0; i < this.bcd.length; i++) if (this.bcd[i] > 0) {
        this.bcd[i] -= dt;
        if (this.bcd[i] <= 0) { this.bcd[i] = 0; this.emit('relight', i); }
      }
      for (let i = 0; i < this.bellT.length; i++) if (this.bellT[i] > 0) this.bellT[i] -= dt;
      for (let k = 0; k < this.cs.length; k++) {
        if (this.cs[k] === 0) continue;
        this.ct[k] -= dt;
        if (this.ct[k] > 0) continue;
        if (this.cs[k] === 1) { this.cs[k] = 2; this.ct[k] = P.CRUMBLE_RESPAWN; this.emit('crumble', k); }
        else {
          const c = r.crumbles[k];
          if (!p.dead && overlap(p.x, p.y, P.W, P.H, c.tx * T, c.ty * T, T, T)) { this.ct[k] = 0.1; continue; }
          this.cs[k] = 0; this.emit('reform', k);
        }
      }
      // candles burn down. Water puts one out (rain too, unless it's a hooded street lamp), and it won't take a
      // flame again till it's dry; one burning Taper's gold passes it to the candles near it a moment after it
      // caught. And embers that were used re-form
      for (let i = 0; i < r.lamps.length; i++) {
        const l = r.lamps[i];
        if (!l.burn) continue;
        if (this.candleWet(l)) {
          this.wetL[i] = P.CANDLE_DRY;
          if (this.lit[i] > 0) { this.lit[i] = 0; this.gold[i] = 0; this.catchT[i] = 0; this.wickTouch[i] = 0; this.emit('candledouse', i, l.x, l.y); }
          continue;
        }
        if (this.wetL[i] > 0) this.wetL[i] = Math.max(0, this.wetL[i] - dt);
        if (this.lit[i] <= 0) continue;
        if (this.catchT[i] > 0) { this.catchT[i] -= dt; if (this.catchT[i] <= 0) { this.catchT[i] = 0; this.passGold(i); } }
        this.lit[i] -= dt;
        if (this.lit[i] <= 0) { this.lit[i] = 0; this.gold[i] = 0; this.catchT[i] = 0; this.wickTouch[i] = 0; this.emit('candleout', i, l.x, l.y); }
      }
      for (let i = 0; i < this.emT.length; i++) if (this.emT[i] > 0) { this.emT[i] -= dt; if (this.emT[i] <= 0) { this.emT[i] = 0; this.emit('emberback', i); } }
      if (r.react.length) this.updateReact();
      this.updateGates();
      if (r.drips.length || this.drops.length) this.updateDrops();
    }

    // ---------- the lab's mechanics ----------
    // every gate opens while all its keys are held (its wicks and candles lit, its hook holding the lantern); one
    // that isn't latched falls shut again over GATE_CLOSE once a key is lost, but never onto the moth
    updateGates() {
      const r = this.room, L = this.L, dt = this.dt;
      for (let g = 0; g < r.gates.length; g++) {
        const gate = r.gates[g];
        let ok = true;
        for (const k of gate.keys) {
          if (k.lamp >= 0 ? !(this.lit[k.lamp] > 0) : !(L.state === STUCK && L.hook === k.hook)) { ok = false; break; }
        }
        if (ok) {
          if (!this.gOpen[g]) { this.gOpen[g] = 1; this.emit('gate', g); }
          if (this.gT[g] < 1) this.gT[g] = Math.min(1, this.gT[g] + dt * 1.6);
        } else if (this.gOpen[g] && !gate.latch) {
          if (this.gT[g] >= 1) this.emit('gateclose', g);
          this.gT[g] = Math.max(0, this.gT[g] - dt / P.GATE_CLOSE);
          if (this.gT[g] <= 0 && !this.overTiles(gate.tiles)) { this.gOpen[g] = 0; this.emit('gateshut', g); }
        }
      }
    }
    overTiles(tiles) {
      const p = this.p;
      if (p.dead) return false;
      for (const t of tiles) if (overlap(p.x, p.y, P.W, P.H, t.tx * T, t.ty * T, T, T)) return true;
      return false;
    }
    mothOn(tx, ty) { const p = this.p; return !p.dead && overlap(p.x, p.y, P.W, P.H, tx * T, ty * T, T, T); }
    lanternOn(tx, ty) { const L = this.L; return L.state !== HELD && L.state !== AWAY && overlap(L.x, L.y, 4, 4, tx * T, ty * T, T, T); }

    // the flames burning in the room, as [x, y, r²] triples: the lantern (in the moth's hand only while it burns;
    // out in the room unless it's been put out; hung on a hook, it lights farther), lit braziers, wicks and candles,
    // and briar or boards on fire
    lights() {
      const out = this.lightBuf, p = this.p, L = this.L, r = this.room, R2 = P.LIGHT_R * P.LIGHT_R;
      out.length = 0;
      if (!p.dead) {
        if (L.state === HELD) { if (p.spark) out.push(p.x + 3, p.y + 4, R2); }
        else if (L.state !== AWAY && !L.doused) out.push(L.x + 2, L.y + 2, L.state === STUCK && L.hook >= 0 ? P.HOOK_R * P.HOOK_R : R2);
      }
      for (let i = 0; i < r.braziers.length; i++) if (this.bcd[i] <= 0 && !r.braziers[i].cold) out.push(r.braziers[i].x, r.braziers[i].y - 3, R2);
      for (let i = 0; i < r.lamps.length; i++) if (this.lit[i] > 0) {
        const l = r.lamps[i];
        if (l.ember) continue;             // a gold ember is a spark, not a lamp: it holds no glass
        if (l.hood) out.push(l.x, l.y - 9, P.STREET_R * P.STREET_R); else out.push(l.x, l.y - 3, R2);
      }
      for (let k = 0; k < r.react.length; k++) {
        const q = r.react[k];
        if (this.rs[k] === 1 && (q.kind === BRIAR || q.kind === WOOD)) out.push(q.tx * T + 4, q.ty * T + 4, 18 * 18);
      }
      return out;
    }
    // is the point (x, y) lit, by any flame in the room?
    litAt(x, y) {
      const src = this.lights();
      for (let j = 0; j < src.length; j += 3) { const dx = x - src[j], dy = y - src[j + 1]; if (dx * dx + dy * dy <= src[j + 2]) return true; }
      return false;
    }
    // the tiles that answer to light and fire: lightstone solid while lit (and a moment after), but it won't close
    // on the moth; wax melting after WAX_MELT in the light and setting after WAX_SET dark; briar and boards burning,
    // catching their neighbours, then ash (briar grows back)
    updateReact() {
      const r = this.room, dt = this.dt, src = this.lights(), n = r.react.length;
      for (let k = 0; k < n; k++) {
        const q = r.react[k], cx = q.tx * T + 4, cy = q.ty * T + 4;
        let lit = false;
        for (let j = 0; j < src.length; j += 3) { const dx = cx - src[j], dy = cy - src[j + 1]; if (dx * dx + dy * dy <= src[j + 2]) { lit = true; break; } }
        if (lit) this.glow[k] = P.AFTERGLOW; else if (this.glow[k] > 0) this.glow[k] = Math.max(0, this.glow[k] - dt);
        const s = this.rs[k];
        if (q.kind === GLASS) {
          if (this.glow[k] > 0) { if (!s && !this.mothOn(q.tx, q.ty)) { this.rs[k] = 1; this.emit('glass', k, 1); } }
          else if (s) { this.rs[k] = 0; this.emit('glass', k, 0); }
        } else if (q.kind === WAX) {
          if (!s) {
            if (lit) { this.heat[k] += dt; if (this.heat[k] >= P.WAX_MELT) { this.rs[k] = 1; this.rt[k] = 0; this.emit('melt', k); } }
            else this.heat[k] = Math.max(0, this.heat[k] - dt);
          } else if (lit) this.rt[k] = 0;
          else {
            this.rt[k] += dt;
            if (this.rt[k] >= P.WAX_SET && !this.mothOn(q.tx, q.ty) && !this.lanternOn(q.tx, q.ty)) { this.rs[k] = 0; this.heat[k] = 0; this.emit('waxset', k); }
          }
        } else if (s === 1) {
          // burning: it catches its neighbours, then falls to ash (boards for good)
          this.rt[k] += dt;
          if (this.rt[k] >= P.FIRE_SPREAD && this.rt[k] - dt < P.FIRE_SPREAD) this.spreadFire(q.tx, q.ty);

      const hoods = flame === GOLD ? 0 : this.room.lamps.reduce((m, l, i) => l.hood ? m | (1 << i) : m, 0);
      const hits = (d, e) => { const r = this.predictFrom(x, y, d, e, out, flame); return r.end === HIT_BRAZIER || r.end === HIT_HOOK || r.bells !== 0 || (r.lamps & ~hoods) !== 0; };
      if (hits(dir, elev)) return [dir, elev];
      const a0 = toAngle(dir, elev);
      for (let k = 1; k <= P.ASSIST_DEG; k++) {
        for (const sgn of [1, -1]) { const a = fromAngle(a0 + sgn * k); if (hits(a[0], a[1])) return a; }
      }
      return [dir, elev];
    }

    recall() {
      const L = this.L;
      if (L.state === FLY || L.state === STUCK) { L.state = RET; this.emit('recall', L.x + 2, L.y + 2); }
      else if (L.state === AWAY) this.awayPress = 'recall';
    }

    brazierNear(x, y) {
      const bz = this.room.braziers;
      for (let i = 0; i < bz.length; i++) {
        if (Math.abs(x + 2 - bz[i].x) <= 8 && Math.abs(y + 2 - bz[i].y) <= 9) return i;
      }
      return -1;
    }

    throwLantern(dir, elev) {
      const p = this.p, L = this.L;
      const aim = this.assist && !this.room.noAssist ? this.assistAim(dir, elev) : [dir, elev];
      const v = launchVel(p.flame, aim[0], aim[1]);
      L.state = FLY; L.x = p.x + 1; L.y = p.y + 2; L.rx = 0; L.ry = 0;
      L.vx = v[0]; L.vy = v[1]; L.t = 0; L.nx = 0; L.ny = 0; L.anchor = -1; L.skip = this.brazierNear(L.x, L.y);
      L.flame = p.flame; L.fall = 0; L.hops = P.ROSE_HOPS; L.charge = 0; L.sput = 0;
      L.hook = -1; L.hover = 0; L.doused = 0; L.up = 0;
      // thrown from inside a fake wall's passage, it flies through fake walls: from in there they're air
      L.ghost = this.overlapCode(p.x, p.y, P.W, P.H, FAKE) ? 1 : 0;
      if (p.perch <= 0 || p.hang) p.facing = aim[0];
      this.emit('throw', L.x + 2, L.y + 2, v[0] / 230, v[1] / 260, L.flame);
    }

    findFree(x, y, vertFirst) {
      const list = vertFirst ? OFFS_V : OFFS;
      for (let i = 0; i < list.length; i++) {
        const nx = x + list[i][0], ny = y + list[i][1];
        if (!this.solidRect(nx, ny, P.W, P.H)) return [nx, ny];
      }
      return null;
    }

    blink() {
      const p = this.p, L = this.L;
      // a blink needs a spark; a lantern that's been put out can't be blinked to, though one a brazier has lit
      // again since can
      if (L.doused || (!p.spark && !(L.charge && L.state !== HELD))) { this.emit('fizzle', p.x, p.y); return; }
      const spent = L.flame, charged = L.charge;
      const lcx = L.x + 2, lcy = L.y + 2;
      // a lantern out past the room's edge (through a doorway, or lost in the void) can't be followed there,
      // only called back
      const rm = this.room;
      if (lcx < 0 || lcx >= rm.pw || lcy < 0 || lcy >= rm.ph) { L.state = RET; this.emit('blinkfail', lcx, lcy); return; }
      const hangAt = L.state === STUCK && L.anchor >= 0 ? L.anchor : -1;
      // a hook, or a gold lantern hanging in the air, holds the moth up too, but lights nothing
      const hooked = L.state === STUCK && L.hook >= 0 ? L.hook : -1, hover = L.state === STUCK && !!L.hover;
      let tx, ty, perchN = 0;
      // a brazier catches the moth in its bowl, at the height the lantern hung
      if (hangAt >= 0) { const b = this.room.braziers[hangAt]; tx = Math.round(b.x - 3); ty = Math.round(b.y - 6); }
      else if (hooked >= 0) { const h = this.room.hooks[hooked]; tx = h.x - 3; ty = h.y - 1; }
      else if (hover) { tx = Math.round(lcx - 3); ty = Math.round(lcy - 2); }
      else if (L.state === STUCK && L.nx !== 0) { tx = L.nx < 0 ? L.surf - P.W : L.surf; ty = Math.round(lcy - 4); perchN = L.nx; }
      else if (L.state === STUCK && L.ny < 0) { tx = Math.round(lcx - 3); ty = L.surf - P.H; }
      else if (L.state === STUCK && L.ny > 0) { tx = Math.round(lcx - 3); ty = L.surf; }
      else { tx = Math.round(lcx - 3); ty = Math.round(lcy - 4.5); }
      const spot = this.findFree(tx, ty, perchN !== 0);
      if (!spot) { L.state = RET; this.emit('blinkfail', lcx, lcy); return; }
      const ox = p.x, oy = p.y;
      p.x = spot[0]; p.y = spot[1]; p.rx = 0; p.ry = 0;
      // the light the dark things were diving at is gone in a blink: they balk, and hang where they are
      for (const s of this.sn) if (s.mode === 1) { s.vx = 0; s.vy = 0; }
      if (L.state === FLY) {
        p.vx = clamp(L.vx * P.INHERIT, -P.INHERIT_MAX_X, P.INHERIT_MAX_X);
        p.vy = Math.max(L.vy * P.INHERIT, -P.INHERIT_MAX_UP);
      } else { p.vx = 0; p.vy = 0; }
      p.perch = 0; p.hang = 0; p.hangB = -1; p.fling = 0;
      if (hangAt >= 0) {
        // blinking to a brazier leaves the moth hanging from it for a moment (riding it, if it moves)
        p.perch = this.room.braziers[hangAt].grip || P.HANG_TIME; p.perchN = 0; p.hang = 1; p.hangB = hangAt;
      } else if (hooked >= 0 || hover) {
        p.perch = P.HANG_TIME; p.perchN = 0; p.hang = 1;
      } else if (perchN !== 0 && this.solidRect(p.x - perchN, p.y, P.W, P.H)) {
        p.perch = P.PERCH_TIME; p.perchN = perchN; p.facing = -perchN;
      }
      // the blink spends the flame; a verdant one burns twice, leaving an amber spark behind, and a lantern
      // still holding a brazier's light (or an ember's) leaves that light burning
      if (charged) { p.spark = true; p.flame = spent; }
      else { p.spark = spent === VERDANT; p.flame = AMBER; }
      L.charge = 0; L.hook = -1; L.hover = 0;
      p.coyote = 0; p.grounded = false; p.buf = 0; p.varJump = true;
      L.state = HELD;
      this.holdLantern();
      this.emit('blink', ox, oy, p.x, p.y, spent);
      if (spent === VERDANT && !charged) this.emit('twin', p.x, p.y);
      if (hangAt >= 0) this.emit('hang', hangAt);
      else if (hooked >= 0 || hover) this.emit('hanghook', p.x + 3, p.y);
    }

    lSolid(x, y, down) {
      // lantern box 4x4 at (x,y). returns 1 if blocked (a fake wall doesn't block a lantern thrown from inside one:
      // this.ghost, set for the flight being stepped)
      const r = this.room;
      const x0 = Math.floor(x / T), x1 = Math.floor((x + 3) / T);
      const y0 = Math.floor(y / T), y1 = Math.floor((y + 3) / T);
      for (let ty = y0; ty <= y1; ty++) {
        if (ty < 0 || ty >= r.h) continue;
        for (let tx = x0; tx <= x1; tx++) {
          if (tx < 0 || tx >= r.w) continue;
          const i = ty * r.w + tx, c = r.tiles[i];
          if (c === SOLID || c === VENT || (c === FAKE && !this.ghost)) return 1;
          if (c === CRUMBLE && this.cs[r.crumbleIdx[i]] < 2) return 1;
          if (c === GATE && !this.gOpen[r.gateOf[i]]) return 1;
          if (c === ONEWAY && down && (y + 3) === ty * T) return 1;
          // lightstone stops a lantern wherever it's lit (a burning lantern lights what it flies at), wax until it
          // melts, boards until they've burnt
          if (c >= GLASS) {
            const k = r.reactIdx[i];
            if (c === GLASS ? this.glow[k] > 0 : c === WAX ? this.rs[k] === 0 : c === WOOD ? this.rs[k] !== 2 : false) return 1;
          }
        }
      }
      return 0;
    }

    // one step of lantern flight for `o` (the live lantern, or a probe when predicting a throw).
    // Only a live flight changes the world or emits events.
    flyStep(o, wind, dt, live) {
      const r = this.room;
      o.t += dt;
      this.ghost = !!o.ghost;
      // azure and rose fly dead straight, untouched by gravity, wind and updrafts; a lantern knocked loose
      // (o.fall) drops like an amber one whatever its colour
      const beam = isBeam(o.flame) && !o.fall;
      // pale floats: it sinks slowly, the air takes it (along with a wind, at the wind's own pace), and an updraft
      // throws it high
      const pale = o.flame === PALE && !o.fall;
      const vs = beam ? 0 : this.ventStrength(o.x, o.y, 4, 4);
      if (beam) { /* keeps its velocity */ }
      else if (vs > 0) {
        const k = pale ? P.PALE_VENT : 1;
        o.vy -= P.L_VENT_ACC * k * vs * dt; if (o.vy < -P.L_VENT_MAX * k) o.vy = -P.L_VENT_MAX * k;
        o.vx = approach(o.vx, 0, P.L_VENT_DRAG * dt);
      }
      else if (pale) { o.vy = Math.min(P.PALE_MAXFALL, o.vy + P.PALE_GRAV * dt); o.vx = approach(o.vx, wind * P.PALE_WIND, P.PALE_DRAG * dt); }
      else { o.vy += P.L_GRAV * dt; if (o.vy > P.L_MAXFALL) o.vy = P.L_MAXFALL; }
      // x move
      o.rx += o.vx * dt + (beam || vs > 0 || pale ? 0 : wind * dt * P.WIND_LANTERN);
      let m = Math.round(o.rx);
      if (m !== 0) {
        o.rx -= m;
        const s = m > 0 ? 1 : -1;
        while (m !== 0) {
          if (this.lSolid(o.x + s, o.y, false)) {
            if (this.ricochet(o, live, -s, 0)) { o.vx = -o.vx; o.rx = 0; break; }
            o.state = STUCK; o.nx = -s; o.ny = 0; o.surf = s > 0 ? o.x + 4 : o.x; o.t = 0; o.vx = 0; o.vy = 0;
            return HIT_WALL;
          }
          o.x += s; m -= s;
        }
      }
      o.ry += o.vy * dt;
      m = Math.round(o.ry);
      if (m !== 0) {
        o.ry -= m;
        const s = m > 0 ? 1 : -1;
        while (m !== 0) {
          if (this.lSolid(o.x, o.y + s, s > 0)) {
            if (this.ricochet(o, live, 0, -s)) { o.vy = -o.vy; o.ry = 0; break; }
            o.state = STUCK; o.nx = 0; o.ny = -s; o.surf = s > 0 ? o.y + 4 : o.y; o.t = 0; o.vx = 0; o.vy = 0;
            return HIT_WALL;
          }
          o.y += s; m -= s;
        }
      }
      const cx = o.x + 2, cy = o.y + 2;
      // crimson sets alight the briar and boards it touches
      if (live && o.flame === CRIMSON && !o.doused && r.react.length) this.igniteAround(o.x - 1, o.y - 1, 6, 6);
      for (let i = 0; i < r.braziers.length; i++) {
        const b = r.braziers[i];
        if (i !== o.skip && Math.abs(cx - b.x) <= 6 && Math.abs(cy - b.y) <= 7) {
          o.state = STUCK; o.anchor = i; o.nx = 0; o.ny = 0; o.x = b.x - 2; o.y = b.y - 4; o.rx = 0; o.ry = 0; o.t = 0;
          o.vx = 0; o.vy = 0;
          // a lit brazier gives the lantern its light the moment it lands: the lantern takes its colour and holds
          // its flame, and the brazier burns down to coals until it gathers itself again (it lights one that was
          // put out, too)
          if (this.bcd[i] <= 0 && !b.cold) {
            o.flame = b.flame; o.charge = 1; o.doused = 0;
            if (live) { this.bcd[i] = P.BRAZIER_CD; this.emit('kindle', i, b.x, b.y, b.flame); }
          }
          return HIT_BRAZIER;
        }
      }
      for (let i = 0; i < r.hooks.length; i++) {
        const h = r.hooks[i];
        if (Math.abs(cx - h.x) <= 5 && Math.abs(cy - h.y) <= 6) {
          o.state = STUCK; o.hook = i; o.anchor = -1; o.nx = 0; o.ny = 0; o.x = h.x - 2; o.y = h.y - 1; o.rx = 0; o.ry = 0; o.t = 0;
          o.vx = 0; o.vy = 0;
          return HIT_HOOK;
        }
      }
      // through an ember, a burning lantern takes its light: blinking to it will leave the moth lit (a probe notes
      // the embers it would pass, in o.embers)
      if (!o.doused && !o.charge) for (let i = 0; i < r.embers.length; i++) {
        const e = r.embers[i];
        if (this.emT[i] > 0 || !overlap(o.x, o.y, 4, 4, e.x - 4, e.y - 4, 8, 8)) continue;
        if (!live) { o.embers |= 1 << i; continue; }
        o.charge = 1; this.emT[i] = P.EMBER_BACK; this.emit('ember', i, e.x, e.y, 1); break;
      }
      for (let i = 0; i < r.bells.length; i++) {
        const b = r.bells[i];
        // the bloom's whole cup catches a falling lantern; a beam never falls, so it flies straight past
        if (!beam && o.vy >= 0 && overlap(o.x, o.y, 4, 4, b.tx * T - 2, b.ty * T - 4, 12, 9)) {
          // a bloom fires the lantern from the middle of its cup: straight up, or along its tilt from a fixed point,
          // so a chain of tilted blooms always flies the same way
          if (b.tilt) { o.vy = -P.L_BOUNCE * TILT_C; o.vx = b.tilt * P.L_BOUNCE * TILT_S; o.x = b.x - 2 + b.tilt * 3; o.y = b.ty * T - 2; o.ry = 0; }
          else { o.vy = -P.L_BOUNCE; o.vx = 0; o.x = b.x - 2; }
          o.rx = 0; o.t = 0;
          if (live) { this.bellT[i] = 0.35; this.emit('lbounce', i, b.x, b.y); } else o.bells |= 1 << i;
          break;
        }
      }
      if (!o.doused) this.lampsNear(o, live);
      // out through a doorway: it flies on in the room next door (the caller hands it over); a doorway into another
      // area turns it back, and it comes home as if called
      if (cx < 0 || cx >= r.pw || cy < 0 || cy >= r.ph) {
        const d = this.doorAt(cx, cy);
        if (d && d.link) {
          if (live && d.link.scene) return TURNED;
          if (live) { this.lanternDoor = d; return LEFT; }
          o.door = d; o.state = STUCK; o.vx = 0; o.vy = 0; return LOST;
        }
      }
      // flown out of the room: it stops in the void, where only a call brings it back
      if (o.y > r.ph + P.L_VOID || o.y < -P.L_VOID || o.x < -P.L_VOID || o.x > r.pw + P.L_VOID) {
        o.state = STUCK; o.nx = 0; o.ny = 0; o.vx = 0; o.vy = 0;
        return LOST;
      }
      return FLYING;
    }

    // the wicks and candles a lantern (o) is close enough to light: lit, if live; else noted in o.lamps (a probe).
    // A coloured wick takes only its own flame, and sputters at any other; a lit candle takes a flame again once
    // it's burnt down a little
    lampsNear(o, live) {
      const r = this.room, cx = o.x + 2, cy = o.y + 2;
      for (let i = 0; i < r.lamps.length; i++) {
        const l = r.lamps[i];
        if (this.lit[i] && !(l.burn && this.lit[i] < l.burn - 0.3)) continue;
        if (Math.abs(cx - l.x) > 8 || Math.abs(cy - l.y) > 8) continue;
        if (l.flame >= 0 && l.flame !== o.flame) {
          if (live && !(o.sput & (1 << i))) { o.sput |= 1 << i; this.emit('sputter', i, l.x, l.y); }
          continue;
        }
        // a wet candle won't take a flame, and one burning Taper's gold takes no other; a gold ember takes only gold
        if (l.burn && (this.wetL[i] > 0 || (this.gold[i] && o.flame !== GOLD))) continue;
        if (l.ember && o.flame !== GOLD) continue;
        if (!live) { o.lamps |= 1 << i; continue; }
        if (l.burn && o.flame === GOLD) { this.catchGold(i); continue; }
        const again = this.lit[i] > 0; this.lit[i] = l.burn || 1; this.emit(again ? 'relamp' : 'lamp', i, l.x, l.y);
      }
    }

    // a rose lantern glances off a surface (normal nx, ny) while it has ricochets left
    ricochet(o, live, nx, ny) {
      if (o.flame !== ROSE || o.fall || o.hops <= 0) return false;
      o.hops--;
      if (live) this.emit('ricochet', o.x + 2, o.y + 2, nx, ny, o.hops);
      return true;
    }

    updateLantern(wind) {
      const L = this.L, p = this.p, dt = this.dt;
      if (L.state === HELD) { this.holdLantern(); return; }
      if (L.state === AWAY) return;
      if (L.state === RET) {
        const hx = p.x + 1 + p.facing * 4, hy = p.y + 2;
        const dx = hx - L.x, dy = hy - L.y, d = Math.hypot(dx, dy);
        const st = P.L_RETURN * dt;
        if (d <= st + 2) { this.catchLantern(); this.emit('catch', p.x, p.y, p.flame); return; }
        L.x += dx / d * st; L.y += dy / d * st;
        // called home through falling water or rain, it goes out on the way like any other flying lantern
        this.soakLantern();
        return;
      }
      const r = this.room;
      if (L.state === STUCK) {
        L.t += dt;
        // in a brazier that moves, it goes where the brazier goes
        if (L.anchor >= 0 && r.braziers[L.anchor].mv) { const b = r.braziers[L.anchor]; L.x = b.x - 2; L.y = b.y - 4; }
        let lost = false;
        if (L.anchor < 0 && L.hook < 0 && !L.hover) {
          this.ghost = !!L.ghost;
          if (L.nx !== 0) lost = !this.lSolid(L.x - L.nx, L.y, false);
          else if (L.ny !== 0) lost = !this.lSolid(L.x, L.y - L.ny, L.ny < 0);
        }
        if (lost) { L.state = FLY; L.vx = 0; L.vy = 0; L.nx = 0; L.ny = 0; L.fall = 1; }
        if (L.flame === CRIMSON && !L.doused && r.react.length) this.igniteAround(L.x - 1, L.y - 1, 6, 6);
        this.soakLantern();
        if (this.sinkHome()) return;
        // resting beside a wick or a candle, it lights it (as it would flying past)
        if (!L.doused) this.lampsNear(L, true);
        return;
      }
      this.flightResult(this.flyStep(L, wind, dt, true));
      if (L.state === FLY || L.state === STUCK) { this.soakLantern(); this.sinkHome(); }
    }
    // under the tide or the flood, out and sinking, it's no use to anyone where it is: it comes home by itself, as
    // if called
    sinkHome() {
      const L = this.L;
      if (!this.room.tide || L.y + 2 <= this.tideY || (L.state !== FLY && L.state !== STUCK)) return false;
      L.state = RET; this.emit('recall', L.x + 2, L.y + 2);
      return true;
    }
    // the lantern out of the moth's hand in water goes out, and its wick is soaked; out of the water it dries
    soakLantern() {
      const L = this.L;
      if (this.lanternWet()) { if (!L.doused) this.douseLantern(); L.wetT = P.DRY; }
      else if (L.wetT > 0) L.wetT = Math.max(0, L.wetT - this.dt);
    }
    // the lantern out in water: a running fall, a drop, rain with nothing overhead (a lamp hook has a hood), or
    // under the tide
    lanternWet() {
      const r = this.room, L = this.L;
      if (r.tide && L.y + 2 > this.tideY) return true;
      return !!(r.falls.length || this.drops.length || r.rain) && this.wetBox(L.x, L.y, 4, 4, L.state === STUCK && L.hook >= 0);
    }

    flightResult(res) {
      const L = this.L;
      if (res === HIT_WALL) this.emit('stick', L.x + 2, L.y + 2, L.nx, L.ny);
      else if (res === HIT_BRAZIER) { const b = this.room.braziers[L.anchor]; this.emit('anchor', b.x, b.y, L.anchor); }
      else if (res === HIT_HOOK) { const h = this.room.hooks[L.hook]; this.emit('hookon', h.x, h.y, L.hook); }
      else if (res === HOVER) this.emit('hover', L.x + 2, L.y + 2);
      else if (res === LOST) this.emit('lost', L.x + 2, L.y + 2);
      else if (res === LEFT) L.state = AWAY;
      else if (res === TURNED) { L.state = RET; this.emit('recall', L.x + 2, L.y + 2); }
    }

    // where a throw made right now along (dir, elev) would fly: fills out.pts with centre points
    // [x0, y0, x1, y1, ...], out.end with how the flight ends (HIT_WALL, HIT_BRAZIER or LOST) and
    // out.lamps / out.bells with bitmasks of the wicks it would light and the blooms it would bounce off
    predict(dir, elev, out) { return this.predictFrom(this.p.x + 1, this.p.y + 2, dir, elev, out, this.p.flame); }
    predictFrom(x, y, dir, elev, out, flame) {
      const o = this.probe;
      flame = flame || AMBER;
      const v = launchVel(flame, dir, elev);
      o.state = FLY; o.x = x; o.y = y; o.rx = 0; o.ry = 0; o.vx = v[0]; o.vy = v[1]; o.t = 0;
      o.nx = 0; o.ny = 0; o.surf = 0; o.anchor = -1; o.skip = this.brazierNear(o.x, o.y); o.lamps = 0; o.bells = 0; o.embers = 0; o.door = null;
      o.ghost = this.overlapCode(x - 1, y - 2, P.W, P.H, FAKE) ? 1 : 0;
      o.flame = flame; o.fall = 0; o.hops = P.ROSE_HOPS; o.charge = 0; o.hook = -1; o.hover = 0; o.doused = 0; o.up = 0;
      const pts = out.pts;
      pts.length = 0;
      pts.push(o.x + 2, o.y + 2);
      // braziers that move are flown at where they'll be (as the live lantern's first step sees them where they are)
      const mov = this.room.braziers.filter(b => b.mv);
      let res = FLYING;
      for (let i = 1; i <= 180 && res === FLYING; i++) {
        for (const b of mov) movingAt(b, this.t + (i - 1) * DT, b);
        res = this.flyStep(o, this.windAt(this.t + i * DT), DT, false);
        pts.push(o.x + 2, o.y + 2);
      }
      for (const b of mov) movingAt(b, this.t, b);
      out.end = res;
      out.anchor = o.anchor; out.nx = o.nx; out.ny = o.ny; out.lamps = o.lamps; out.bells = o.bells; out.embers = o.embers;
      return out;
    }

    // ---------- snapshots (used by the level solver) ----------
    save(out) {

  function paintMoth(o) {
    // o: wing (deg, 0 = pointing back, 90 = straight up), far (far-wing angle), bob, lean, legs, ant, squash, air, perch, blink;
    // pal: colours (Wick's by default)
    const M = o.pal || MOTH;
    const W = 20, H = 20, b = new Pix(W, H);
    const sq = o.squash || 0;
    const brx = 3.7 + sq * 0.5, bry = 4.1 - sq * 0.6;
    const cx = 10 + (o.lean || 0), cy = 19 - 1.6 - bry + (o.bob || 0) - (o.air ? 1 : 0);
    const shx = cx - 3.0, shy = cy - 0.6;
    function wing(ang, len, wid, cols, band, ox, oy) {
      const a = ang * Math.PI / 180;
      const dx = -Math.cos(a), dy = -Math.sin(a), nx = -dy, ny = dx;
      const ccx = shx + ox + dx * len * 0.52, ccy = shy + oy + dy * len * 0.52;
      const A = len * 0.52, B = wid;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const px = x + 0.5 - ccx, py = y + 0.5 - ccy;
        const u = (px * dx + py * dy) / A, v = (px * nx + py * ny) / B;
        const r = u * u + v * v;
        if (r > 1) continue;
        const along = (u + 1) / 2;
        let col;
        if (r > 0.7) col = cols[3];
        else if (band && along > 0.36 && along < 0.62) col = along < 0.42 || v > 0.35 ? band[1] : band[0];
        else if (v < -0.2) col = cols[0];
        else if (along < 0.3) col = cols[2];
        else col = cols[1];
        b.set(x, y, c32(col));
      }
    }
    const wa = o.wing === undefined ? 64 : o.wing;
    const fa = o.far === undefined ? wa + 16 : o.far;
    wing(fa, 7.0, 2.8, M.wingFar, null, 0.9, -0.6);          // far forewing
    wing(wa - 38, 5.2, 2.3, M.wingFar, null, 0.4, 1.6);      // hindwing
    wing(wa, 7.6, 3.1, M.wing, M.band, 0, 0);             // near forewing
    // legs
    const lg = c32(M.leg);
    const st = o.legs || 0;
    const fy = 19;
    if (o.perch) {
      b.line(cx + 2, cy + 2, cx + 4, cy + 1, lg); b.line(cx + 2, cy + 3, cx + 4, cy + 4, lg);
    } else if (o.air) {
      b.line(cx - 1, cy + 3, cx - 1.5, cy + 5.5, lg); b.line(cx + 1, cy + 3, cx + 1.5, cy + 5.5, lg);
    } else {
      b.line(cx - 1 + st * 0.5, cy + 3, cx - 1 + st * 1.5, fy, lg);
      b.line(cx + 1.2 - st * 0.5, cy + 3, cx + 1.2 - st * 1.5, fy, lg);
    }
    // fuzzy tail
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const px = (x + 0.5 - (cx - 3.4)) / 2.3, py = (y + 0.5 - (cy + 2.2)) / 1.7;
      const r = px * px + py * py;
      if (r > 1) continue;
      b.set(x, y, c32(((x + y) & 1) ? M.body[3] : M.body[2]));
    }
    // round fluffy body
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const px = (x + 0.5 - cx) / brx, py = (y + 0.5 - cy) / bry;
      const r = px * px + py * py;
      const ang = Math.atan2(py, px);
      const fz = 1 + 0.1 * Math.sin(ang * 9 + 0.7) * (py > 0.2 ? 1.6 : 0.6);
      if (r > fz * fz) continue;
      const l = -0.5 * px - 0.85 * py + (1 - r) * 0.45;
      const col = l > 0.85 ? M.body[0] : l > 0.2 ? M.body[1] : l > -0.35 ? M.body[2] : l > -0.75 ? M.body[3] : M.body[4];
      b.set(x, y, c32(col));
    }
    // lamplighter's scarf
    const sy = Math.round(cy + 1.6);
    if (M.scarf) {
      for (let x = Math.round(cx - brx + 0.4); x <= Math.round(cx + brx - 0.6); x++) {
        if (!b.get(x, sy)) continue;
        b.set(x, sy, c32(M.scarf[1])); if (b.get(x, sy - 1)) b.set(x, sy - 1, c32(x < cx ? M.scarf[1] : M.scarf[0]));
      }
      const tl = o.scarf || 0;
      const kx = Math.round(cx - brx - 0.2);
      b.set(kx, sy, c32(M.scarf[2])); b.set(kx - 1, sy + 1 - tl, c32(M.scarf[1])); b.set(kx - 2, sy + 1, c32(M.scarf[2]));
    }
    // face
    const ex = Math.round(cx + 1.1), ey = Math.round(cy - 1.8);
    if (!o.perch) {
      if (o.blink) { b.set(ex, ey + 1, c32(M.eye)); b.set(ex + 1, ey + 1, c32(M.eye)); }
      else {
        b.rect(ex, ey, 2, 2, c32(M.eye));
        b.set(ex, ey - 1, c32(M.eye));
        b.set(ex + 1, ey, c32('#ffffff'));
      }
      b.set(ex + 1, ey + 2, c32(M.blush)); b.set(ex + 2, ey + 2, c32(M.blush));
    }
    // feathery antennae (hand-placed pixels; sway nudges the tips)
    const aw = Math.round(o.ant || 0);
    const top = Math.round(cy - bry + 0.4);
    const bx = Math.round(cx);
    const stalk = c32(M.ant[2]), fea = c32(M.ant[1]), tip = c32(M.ant[0]), farS = c32('#7a4c28'), farF = c32(M.ant[2]);
    // far antenna sweeps back
    [[-1, 0], [-1, -1], [-2, -2], [-3, -3 ], [-4 + aw, -4]].forEach(([x, y]) => b.set(bx + x, top + y, farS));
    [[-2, -1], [-3, -2], [-4, -3], [-5 + aw, -4]].forEach(([x, y]) => b.set(bx + x, top + y, farF));
    // near antenna arcs forward
    [[1, 0], [1, -1], [2, -2], [3, -3], [4 + aw, -4], [5 + aw, -4]].forEach(([x, y]) => b.set(bx + x, top + y, stalk));
    [[0, -2], [1, -3], [2, -4], [3 + aw, -5], [4 + aw, -5]].forEach(([x, y]) => b.set(bx + x, top + y, fea));
    b.set(bx + 6 + aw, top - 5, tip); b.set(bx + 5 + aw, top - 5, tip);
    b.outline(c32(M.out), false);
    return b.canvas();
  }

  function mothSheet(pal) {
    const f = {};
    const pm = o => paintMoth(pal ? Object.assign(o, { pal }) : o);
    f.idle = [0, 1, 2, 3].map(i => pm({ wing: 56 + [0, 3, 6, 3][i], bob: [0, 0, 0.6, 0.6][i], ant: [0, 0, 1, 0][i], scarf: i >> 1 }));
    f.blink = pm({ wing: 56, blink: true });
    f.run = [0, 1, 2, 3, 4, 5].map(i => pm({ wing: 44 + Math.sin(i / 6 * Math.PI * 2) * 14, bob: [0, -1, -1, 0, -1, -1][i], lean: 0.5, legs: [1, 0.3, -0.5, -1, -0.3, 0.5][i], ant: -(i % 2), scarf: i & 1 }));
    f.rise = [pm({ wing: 22, far: 34, air: true, squash: -0.6, ant: -1, scarf: 1 }), pm({ wing: 34, far: 46, air: true, squash: -0.4, ant: -1 })];
    f.fall = [pm({ wing: 100, far: 112, air: true, squash: 0.15, ant: 1, scarf: 1 }), pm({ wing: 92, far: 106, air: true, squash: 0.15, ant: 1 })];
    f.glide = [[118, 128], [88, 104], [36, 60], [70, 88]].map((a, i) => pm({ wing: a[0], far: a[1], air: true, lean: 0.3, ant: (i & 1), scarf: i & 1 }));
    f.perch = [pm({ wing: 84, perch: true, lean: 1, ant: -1 }), pm({ wing: 90, perch: true, lean: 1, ant: 0 })];
    f.land = pm({ wing: 54, squash: 0.9 });
    return f;
  }
