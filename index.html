  function play(name, a) {
    if (!ctx || !sfxOn || !sfx[name]) return;
    try { sfx[name](a); } catch (e) { /* ignore audio errors */ }
  }

  // ------------- continuous loops (glide flutter, wind, rain) -------------
  function loop(name, make) {
    if (loops[name]) return loops[name];
    const l = make();
    loops[name] = l;
    return l;
  }
  function noiseLoop(opt) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = opt.type; f.frequency.value = opt.f; f.Q.value = opt.q || 0.7;
    const g = ctx.createGain(); g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(sfxBus);
    s.start();
    return { g, f, s };
  }
  // opt.tc: how fast it follows (a shower that douses has to start and stop on the beat)
  function setLoop(name, level, opt) {
    if (!ctx) return;
    const l = loop(name, () => noiseLoop(opt));
    const v = sfxOn ? level : 0;
    l.g.gain.setTargetAtTime(v, ctx.currentTime, opt.tc || 0.08);
    if (opt.fmod !== undefined) l.f.frequency.setTargetAtTime(opt.fmod, ctx.currentTime, 0.1);
  }
  // every loop falls silent: they belong to a room, and a menu has none
  function hushLoops() {
    if (!ctx) return;
    for (const name in loops) loops[name].g.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
  }

  // ------------- music: a theme for each area, all threaded with the lamplighter's motif -------------
  // The motif is written in scale degrees of whatever mode a theme is in (1 = its tonic), with lengths in eighth
  // notes: a rising phrase that asks, and a falling one that answers. A theme plays it whole, one phrase of it, or
  // only its first three notes, in its own key and voice.
  const MOTIF = {
    1: [[1, 2], [3, 2], [5, 4], [4, 2], [3, 2], [2, 4]],
    2: [[5, 2], [6, 2], [5, 2], [3, 2], [2, 2], [1, 6]],
    frag: [[1, 3], [3, 3], [5, 10]],
  };
  const MODES = {
    ionian: [0, 2, 4, 5, 7, 9, 11], lydian: [0, 2, 4, 6, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10],
    aeolian: [0, 2, 3, 5, 7, 8, 10], phrygian: [0, 1, 3, 5, 7, 8, 10],
  };
  // a scale degree (1-based; it may run past 7 or below 1) as semitones above the root
  function deg(mode, d) { const n = mode.length, i = d - 1, o = Math.floor(i / n); return mode[((i % n) + n) % n] + 12 * o; }
  // prog: the chord built on each scale degree, `hold` bars apiece (a bar is 16 eighths). low: the bass octave.
  // motif.at: bars within each `cycle` where a phrase of the motif starts, and which phrase.
  const THEMES = {
    // the title: the whole motif on a music box over warm pads
    title: { root: 62, mode: 'ionian', bpm: 72, prog: [1, 6, 4, 5], hold: 2, low: -24,
      pad: { kind: 'triangle', cut: 1200, vol: 0.02 }, bass: 'long', arp: { voice: 'pluck', dens: 0.16 },
      motif: { voice: 'musicbox', oct: 12, vol: 0.05, cycle: 8, at: { 0: 1, 1: 2 } } },
    // 1 · first light on the moor: dusk pads, warm plucks, the motif's question on a soft flute
    ch1: { root: 62, mode: 'lydian', bpm: 76, prog: [1, 2, 6, 5], hold: 2, low: -24,
      pad: { kind: 'triangle', cut: 1100, vol: 0.022 }, bass: 'long', arp: { voice: 'pluck', dens: 0.34 },
      motif: { voice: 'flute', oct: 12, vol: 0.045, cycle: 16, at: { 0: 1 } } },
    // 2 · the ember road at nightfall: a slow footfall, a lonely music box, lamps flickering by
    ch2: { root: 59, mode: 'aeolian', bpm: 66, prog: [1, 6, 3, 7], hold: 2, low: -24,
      pad: { kind: 'sine', cut: 900, vol: 0.02 }, bass: 'walk', arp: { voice: 'musicbox', dens: 0.13, oct: 12 },
      motif: { voice: 'musicbox', oct: 12, vol: 0.04, cycle: 16, at: { 0: 1, 1: 2 } }, flicker: 0.3 },
    // 3 · lanternmere, the drowned harbour: a slow walk along the quays, glassy notes like the glass lanes, water
    // dripping off the eaves, a candle flickering in a window, and the motif on a lone fiddle somewhere across the water
    town: { root: 60, mode: 'dorian', bpm: 64, prog: [1, 4, 7, 4], hold: 2, low: -24,
      pad: { kind: 'triangle', cut: 1000, vol: 0.02 }, bass: 'walk', arp: { voice: 'marimba', dens: 0.2 },
      motif: { voice: 'strings', oct: 12, vol: 0.035, cycle: 16, at: { 0: 1, 1: 2, 8: 'frag' } }, drips: 0.35, flicker: 0.15 },
    // 4 · glowroot deep: a drone under the roots, dripping bells, a glassy marimba
    ch3: { root: 57, mode: 'phrygian', bpm: 58, prog: [1, 2, 1, 7], hold: 2, low: -24,
      pad: { kind: 'sine', cut: 1600, vol: 0.02, slow: true }, bass: 'drone', arp: { voice: 'marimba', dens: 0.26 },
      motif: { voice: 'bell', oct: 24, vol: 0.03, cycle: 8, at: { 6: 'frag' } }, drips: 0.5 },
    // 4 · the stormstair: a driving bass, wind swelling, taut strings, the motif hard on a lead
    ch4: { root: 52, mode: 'aeolian', bpm: 96, prog: [1, 6, 7, 1], hold: 1, low: -12,
      pad: { kind: 'sawtooth', cut: 700, vol: 0.02 }, bass: 'ostinato', arp: { voice: 'pluck', dens: 0.4, oct: 12 },
      motif: { voice: 'lead', oct: 12, vol: 0.035, cycle: 8, at: { 4: 1, 5: 2 } }, hats: true, toms: true, wind: 4 },
    // 5 · above the clouds: vast still air, a shimmering choir, slow bells, the whole motif returning
    ch5: { root: 65, mode: 'lydian', bpm: 60, prog: [1, 5, 2, 1], hold: 2, low: -24,
      pad: { kind: 'choir', vol: 0.016 }, bass: 'long', arp: { voice: 'bell', dens: 0.16, oct: 12 },
      motif: { voice: 'bell', oct: 12, vol: 0.035, cycle: 16, at: { 0: 1, 1: 2 } } },
    // the Beacon lit: the motif whole, on strings with bells over it
    finale: { root: 62, mode: 'ionian', bpm: 70, prog: [1, 5, 6, 4], hold: 2, low: -24,
      pad: { kind: 'triangle', cut: 1800, vol: 0.024 }, bass: 'long', arp: { voice: 'pluck', dens: 0.36 },
      motif: { voice: 'strings', oct: 12, vol: 0.04, cycle: 8, at: { 0: 1, 1: 2 }, bells: true } },
    // dawn, for the epilogue: a new key and a soft piano. The motif's question sounds over a held chord first, then a
    // rocking broken chord answers it; each turn of the chords goes through a borrowed minor four, the bittersweet
    // close, and the chords run on into each other (legato) so the epilogue's scenes flow without a dip
    dawn: { root: 67, mode: 'ionian', bpm: 54, prog: [1, 3, 4, 4], borrow: { 3: 'aeolian' }, hold: 1, low: -24,
      pad: { kind: 'sine', cut: 1000, vol: 0.015 }, bass: 'long', legato: true, arp: { voice: 'piano', roll: [0, 1, 2, 1], oct: -12, vol: 0.026 },
      motif: { voice: 'piano', oct: 12, vol: 0.07, cycle: 8, at: { 0: 1, 1: 2, 4: 'frag' } }, intro: 1, introVol: 1.5, fadeIn: 0.25, flicker: 0.2 },
  };
  // the biome numbers the game used to ask for, and what they are now
  const LEGACY = { 0: 'title', 1: 'ch3', 2: 'ch4', 3: 'finale' };

  // a voice note: an oscillator through an envelope into the music bus, with optional filter, vibrato and sends
  function mnote(type, f, t, a, hold, rel, vol, opt) {
    opt = opt || {};
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (opt.detune) o.detune.value = opt.detune;
    if (opt.vib) {
      // vibrato that comes in after the note settles
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = opt.vib[0]; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(opt.vib[1], t + a + 0.25);
      lfo.connect(lg); lg.connect(o.detune); lfo.start(t); lfo.stop(t + a + hold + rel + 0.1);
    }
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);
    if (hold > 0) g.gain.setValueAtTime(vol, t + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
    let out = g;
    if (opt.lp) {
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(opt.lp, t);
      if (opt.lpTo) lp.frequency.exponentialRampToValueAtTime(opt.lpTo, t + a + hold + rel);
      g.connect(lp); out = lp;
    }
    o.connect(g); out.connect(musicBus);
    if (opt.verb) { const s = ctx.createGain(); s.gain.value = opt.verb; out.connect(s); s.connect(musicVerb); }
    if (opt.echo) { const s = ctx.createGain(); s.gain.value = opt.echo; out.connect(s); s.connect(musicEcho); }
    o.start(t); o.stop(t + a + hold + rel + 0.05);
  }
  const VOICES = {
    // a plucked string, echoing
    pluck(t, f, dur, vol) { mnote('triangle', f, t, 0.008, 0, 0.9, vol, { verb: 0.4, echo: 1 }); },
    // a music box tine: bright and brief, with a glassy partial above it
    musicbox(t, f, dur, vol) {
      mnote('sine', f, t, 0.004, 0, 1.5, vol, { verb: 0.5, echo: 0.6 });
      mnote('sine', f * 4, t, 0.002, 0, 0.35, vol * 0.22, { verb: 0.3 });
    },
    // a soft flute: a breath at the onset, then a gentle vibrato
    flute(t, f, dur, vol) {
      mnote('sine', f, t, 0.08, Math.max(0.05, dur - 0.2), 0.3, vol, { vib: [5, 7], verb: 0.5 });
      mnote('triangle', f, t, 0.1, Math.max(0.05, dur - 0.2), 0.25, vol * 0.25, { lp: 1800, verb: 0.3 });
      noise(t, 0.09, vol * 0.25, { type: 'bandpass', f: 2200, q: 0.8, bus: musicBus });
    },
    // a marimba bar: a warm fundamental and a woody knock over it
    marimba(t, f, dur, vol) {
      mnote('sine', f, t, 0.003, 0, 0.55, vol * 1.1, { verb: 0.5, echo: 0.7 });
      mnote('sine', f * 3.98, t, 0.002, 0, 0.09, vol * 0.4, { verb: 0.2 });
    },
    bell(t, f, dur, vol) { bell(t, f, vol, { bus: musicBus, verb: 0.9, dur: Math.max(1.6, dur) }); },
    // the storm's lead: a square wave under a closing filter
    lead(t, f, dur, vol) { mnote('square', f, t, 0.02, Math.max(0.04, dur - 0.1), 0.18, vol * 0.7, { lp: 1600, lpTo: 700, vib: [6, 6], verb: 0.3, echo: 0.3 }); },
    // strings: two saws a hair apart, slow to swell
    strings(t, f, dur, vol) {
      for (const d of [-7, 7]) mnote('sawtooth', f, t, 0.14, Math.max(0.05, dur - 0.1), 0.45, vol * 0.5, { detune: d, lp: 2200, vib: [5.5, 5], verb: 0.6 });
    },
    // a soft piano: bright as the hammer lands, mellowing as it rings, low notes ringing longest
    piano(t, f, dur, vol) {
      const ring = Math.min(6, 3 + 400 / f);
      mnote('triangle', f, t, 0.004, 0, ring, vol * 0.7, { detune: 3, lp: Math.min(6000, f * 7), lpTo: Math.max(300, f * 1.5), verb: 0.45 });
      mnote('sine', f, t, 0.006, 0, ring * 1.2, vol * 0.6, { detune: -3, verb: 0.4 });
      mnote('sine', f * 2, t, 0.003, 0, ring * 0.35, vol * 0.2, { verb: 0.2 });
    },
  };
  // a soft thump: footfalls on the ember road, the storm's drum
  function thump(t, vol, f) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f || 110, t); o.frequency.exponentialRampToValueAtTime((f || 110) / 2, t + 0.16);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.3);
  }
  // a pad chord held for `dur`; a legato pad holds right up to the next chord and fades out under it
  function padChord(P, notes, t, dur, legato) {
    if (P.kind === 'choir') {
      // three sines a few cents apart, an octave up, breathing slowly
      for (const n of notes) for (const d of [-9, 0, 9]) {
        mnote('sine', mtof(n + 12), t, 2.4, Math.max(0.1, dur - 3.4), 1.6, P.vol * (d === 0 ? 1 : 0.7), { detune: d, vib: [0.3 + Math.abs(d) * 0.02, 6], verb: 0.8 });
      }
      return;
    }
    const a = legato ? 1.2 : P.slow ? 2.4 : 1.6, hold = legato ? dur - a : Math.max(0.1, dur - (P.slow ? 3.4 : 2.6));
    for (const n of notes) for (const d of [-6, 6]) {
      mnote(P.kind, mtof(n), t, a, hold, legato ? 2.5 : 1.0, P.vol, { detune: d, lp: P.cut, verb: 0.6 });
    }
  }

  let mus = { theme: null, want: null, tok: 0, next: 0, step: 0, timer: null };
  function scheduleMusic() {
    if (!ctx || !mus.theme) return;
    // with the music off no voices are made at all; the clock just keeps pace so it resumes cleanly
    if (!musicOn) { mus.next = ctx.currentTime + 0.1; return; }
    const TH = THEMES[mus.theme], mode = MODES[TH.mode], spb = 60 / TH.bpm / 2; // eighth notes
    while (mus.next < ctx.currentTime + 0.15) {
      const t = mus.next, step = mus.step % 16, bar = Math.floor(mus.step / 16);
      const pi = Math.floor(bar / TH.hold) % TH.prog.length, cd = TH.prog[pi];
      // a seventh chord built in the mode, or in a borrowed one
      const cmode = TH.borrow && TH.borrow[pi] ? MODES[TH.borrow[pi]] : mode;
      const chord = [cd, cd + 2, cd + 4, cd + 6].map(d => deg(cmode, d));
      const chordStart = step === 0 && bar % TH.hold === 0, chordLen = spb * 16 * TH.hold;
      const r = Math.sin(mus.step * 12.9898 + bar * 78.233) * 43758.5453, rnd = r - Math.floor(r);
      // a theme with an intro holds its moving parts back for its first bars: the motif over held chords alone
      const solo = TH.intro && bar < TH.intro;
      if (chordStart) padChord(TH.pad, chord.map(n => TH.root - 12 + n), t, chordLen, TH.legato);
      // bass
      const low = TH.root + TH.low + chord[0];
      if (TH.bass === 'long') {
        if (chordStart) mnote('sine', mtof(low), t, 0.05, TH.legato ? chordLen - 0.05 : spb * 12, 0.8, 0.08, {});
        if (step === 8 && bar % 2 === 1) mnote('sine', mtof(low + 7), t, 0.05, spb * 5, 0.6, 0.05, {});
      } else if (TH.bass === 'walk') {
        if (step === 0 || step === 8) thump(t, step === 0 ? 0.07 : 0.05, 96);
        if (chordStart) mnote('sine', mtof(low), t, 0.2, spb * 20, 1.2, 0.05, {});
      } else if (TH.bass === 'drone') {
        // the root with an open fifth over it, swelling slowly
        if (chordStart) { mnote('sine', mtof(low), t, 1.2, chordLen - 2, 1.4, 0.06, {}); mnote('sine', mtof(low + 7), t, 1.6, chordLen - 2.4, 1.6, 0.035, {}); }
      } else if (TH.bass === 'ostinato') {
        const pat = [0, 0, 12, 0, 0, 12, 0, 7];
        mnote('triangle', mtof(low + pat[step % 8]), t, 0.004, 0, 0.2, step % 8 === 0 ? 0.07 : 0.045, { lp: 700 });
      }
      // the motif, when this bar of the cycle starts a phrase
      const M = TH.motif, ph = M && step === 0 ? M.at[bar % M.cycle] : undefined;
      if (ph !== undefined) {
        let off = 0;
        for (const [d, len] of MOTIF[ph]) {
          const f = mtof(TH.root + M.oct + deg(mode, d)), tt = t + off * spb;
          VOICES[M.voice](tt, f, len * spb, M.vol * (solo ? TH.introVol || 1 : 1));
          if (M.bells) VOICES.bell(tt, f * 2, len * spb, M.vol * 0.35);
          off += len;
        }
      }
      const phrase = M && (M.at[bar % M.cycle] !== undefined);
      if (solo) { /* only held chords under the opening phrase */ }
      else if (TH.arp.roll) {
        // a broken chord rocking steadily under everything: root, fifth, the third above, the fifth again
        const tones = [chord[0], chord[2], chord[1] + 12], n = TH.root + (TH.arp.oct || 0) + tones[TH.arp.roll[step % TH.arp.roll.length]];
        VOICES[TH.arp.voice](t + rnd * 0.012, mtof(n), spb * 2, TH.arp.vol * (step % 8 === 0 ? 1.25 : 1));
      } else {
        // a scatter of notes from the chord and scale, thinner while the motif sounds
        const dens = TH.arp.dens * (phrase ? 0.4 : 1);
        if ((step % 2 === 0 && rnd < dens + 0.2 * (dens > 0.2 ? 1 : 0.5)) || rnd < dens * 0.4) {
          const pool = chord.concat(mode.map(v => v + 12));
          const n = TH.root + (TH.arp.oct || 0) + pool[Math.floor(rnd * 997) % pool.length] + (rnd > 0.8 ? 12 : 0);
          VOICES[TH.arp.voice](t, mtof(n), spb * 2, TH.arp.voice === 'bell' ? 0.025 : TH.arp.voice === 'musicbox' ? 0.03 : 0.042);
        }
      }
      // each place's own sounds
      if (TH.flicker && !solo && step === 12 && rnd < TH.flicker) VOICES.musicbox(t, mtof(TH.root + 24 + chord[Math.floor(rnd * 3)]), spb, 0.018);
      if (TH.drips && step === 12 && rnd < TH.drips) bell(t, mtof(TH.root + 24 + deg(mode, 1 + Math.floor(rnd * 7))), 0.03, { bus: musicBus, verb: 0.9, dur: 2 });
      if (TH.hats && step % 4 === 2) noise(t, 0.05, 0.02, { type: 'highpass', f: 7000, bus: musicBus });
      if (TH.toms && (step === 6 || step === 14) && bar % 2 === 1) thump(t, 0.05, 80);
      if (TH.wind && step === 0 && bar % TH.wind === 0) noise(t, 3.2, 0.03, { type: 'bandpass', f: 320, to: 900, q: 0.7, a: 1.3, bus: musicBus, verb: 0.5 });
      mus.next += spb;
      mus.step++;
    }
  }
  // change to an area's theme (a THEMES key; the old biome numbers still work). Usually the old theme fades out and
  // then the new one begins; with `flow` the new one begins at once and the old one fades away beneath it, for the
  // scenes of the ending that should run on into each other.
  function setMusic(key, flow) {
    const theme = THEMES[key] ? key : (LEGACY[key] || 'title');
    if (!ctx) { mus.theme = mus.want = theme; return; }
    if (mus.want === theme && mus.timer) return;
    mus.want = theme;
    const tok = ++mus.tok, now = ctx.currentTime, fin = THEMES[theme].fadeIn;
    const start = wait => { mus.theme = theme; mus.step = 0; mus.next = ctx.currentTime + 0.1 + wait; };
    if (flow && mus.timer) {
      const old = group;
      for (const k in old) old[k].gain.setTargetAtTime(0.0001, now, 0.7);
      setTimeout(() => { for (const k in old) old[k].disconnect(); }, 6000);
      newGroup(); start(0);
      musicFade.gain.setTargetAtTime(0.9, now, 0.3);
    } else {
      musicFade.gain.setTargetAtTime(0.0001, now, 0.4);

      p.vx *= k; p.vy *= k;

      if (p.kind === 'mote' && p.tx !== undefined) { p.vx += (p.tx - p.x) * 18 * dt; p.vy += (p.ty - p.y) * 18 * dt; }
      if (p.kind === 'spore') { p.vx += Math.sin(G.t * 1.3 + p.seed) * 6 * dt; p.vy += Math.cos(G.t * 1.1 + p.seed) * 6 * dt; }
      if (p.kind === 'firefly') { p.vx += Math.sin(G.t * 1.7 + p.seed * 3) * 14 * dt; p.vy += Math.cos(G.t * 1.3 + p.seed) * 10 * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'rain') {
        const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T), r = G.room;
        if (tx >= 0 && ty >= 0 && tx < r.w && ty < r.h) {
          const c = r.tiles[ty * r.w + tx];
          if (c === TILE.SOLID || c === TILE.GRATE || c === TILE.ONEWAY || c === TILE.VENT || c === TILE.FAKE) {
            if (Math.random() < 0.5) burst(p.x, ty * T - 1, 2, { colors: ['#9fb4e8', '#dfe8ff'], speed: 30, angle: -Math.PI / 2, spread: 1.6, g: 300, life: 0.25, drag: 1, kind: 'splash' });
            continue;
          }
        }
      }
      ps[j++] = p;
    }
    ps.length = j;
    for (let i = G.ghosts.length - 1; i >= 0; i--) { G.ghosts[i].t += dt; if (G.ghosts[i].t > 0.35) G.ghosts.splice(i, 1); }
  }
  function drawParticles(cx, cy, front) {
    for (const p of G.particles) {
      if (!!p.front !== front) continue;
      const a = 1 - p.t / p.life;
      const x = Math.round(p.x - cx), y = Math.round(p.y - cy);
      if (x < -4 || y < -4 || x > VW + 4 || y > VH + 4) continue;
      V.globalAlpha = p.fade === false ? 1 : Math.min(1, a * 1.6);
      V.fillStyle = p.c;
      if (p.kind === 'rain') { V.fillRect(x, y, 1, 3); V.fillRect(x - Math.sign(G.sim.wind), y + 3, 1, 2); }
      else if (p.kind === 'wind') { V.globalAlpha *= 0.35; V.fillRect(x, y, Math.max(3, Math.min(9, Math.abs(p.vx) / 18)), 1); }
      else if (p.kind === 'leaf') { V.fillRect(x, y, 2, 1); if ((Math.floor(p.t * 8) & 1)) V.fillRect(x + 1, y + 1, 1, 1); }
      else if (p.kind === 'firefly') {
        const on = Math.sin(p.t * 3 + p.seed * 5) * 0.5 + 0.5;
        V.globalAlpha = on * Math.min(1, a * 3);
        V.fillRect(x, y, 1, 1);
        if (on > 0.7) { V.globalAlpha *= 0.35; V.fillRect(x - 1, y, 3, 1); V.fillRect(x, y - 1, 1, 3); }
      }
      else { const s = p.size > 1 && a > 0.5 ? p.size : 1; V.fillRect(x, y, s, s); }
    }
    V.globalAlpha = 1;
  }

  // ------------------------------------------------------------------ the sim's rain
  // Worked out from the sim's clock rather than kept as particles, so the screen shows exactly what the sim has. A drop
  // at depth y left the sky (the room's top) y / RAIN_VY ago; it's there if a shower was falling when it left and
  // nothing overhead has caught it since. A dry spell is a gap that sweeps down the room, and where the gap is, the
  // lantern stays lit. Each frame a drop or two leaves the sky per 64px, placed by a hash of its slot.
  const RAIN_CW = 64;
  function rainHash(a, b, c) {
    let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(c, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1103515245);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  // fn(x, y, sky, u) for each drop in view: sky is the depth where its column's cover (or the ground) catches it
  function eachDrop(cx, cy, fn) {
    const sim = G.sim, t = sim.t, vy = P.RAIN_VY, vx = sim.wind * 1.6 + 10, skies = new Map();
    const top = Math.max(0, cy - 6), bot = cy + VH + 6, drift = vx * bot / vy;
    const k0 = Math.floor((t - bot / vy) / DT) - 1, k1 = Math.floor((t - top / vy) / DT) + 1;
    const c0 = Math.floor((cx - 8 - Math.max(0, drift)) / RAIN_CW), c1 = Math.floor((cx + VW + 8 - Math.min(0, drift)) / RAIN_CW);
    for (let k = k0; k <= k1; k++) for (let c = c0; c <= c1; c++) {
      const n = rainHash(c, k, 0) < 0.18 ? 2 : 1;
      for (let m = 1; m <= n; m++) {
        const te = (k + rainHash(c, k, 3 * m)) * DT, age = t - te;
        if (age < 0 || !sim.showerAt(te)) continue;
        const y = age * vy;
        if (y < top || y > bot) continue;
        const x = (c + rainHash(c, k, 3 * m + 1)) * RAIN_CW + vx * age, tx = Math.floor(x / T);
        let sky = skies.get(tx);
        if (sky === undefined) { sky = sim.skyline(tx) * T; skies.set(tx, sky); }
        if (y < sky) fn(x, y, sky, rainHash(c, k, 3 * m + 2));
      }
    }
  }
  function drawRain(cx, cy) {
    if (!G.room.rain) return;
    const lean = Math.sign(G.sim.wind);
    eachDrop(cx, cy, (x, y, sky, u) => {
      const px = Math.round(x - cx), py = Math.round(y - cy), h = Math.min(5, Math.round(sky - y));
      V.fillStyle = u < 0.5 ? '#9fb4e8' : '#7a8cc8';
      V.fillRect(px, py, 1, Math.min(3, h));
      if (h > 3) V.fillRect(px - lean, py + 3, 1, h - 3);
    });
  }

  // ------------------------------------------------------------------ events from the simulation
  function handleEvents(sim = G.sim, ox = 0, oy = 0) {
    const p = sim.p, room = sim.room, pal = palOf(room), n0 = G.particles.length;
    for (const e of sim.events) {
      switch (e.type) {
        case 'jump':
          G.anim.sx = 0.72; G.anim.sy = 1.3;
          burst(p.x + 3, p.y + 9, 5, { colors: pal.dust, speed: 26, angle: -Math.PI / 2, spread: 2.4, life: 0.35, drag: 5 });
          AU.play('jump'); break;
        case 'land': {
          const v = e.c || 0;
          if (v > 70) { G.anim.sx = 1 + Math.min(0.4, v / 400); G.anim.sy = 1 - Math.min(0.35, v / 480); }
          burst(p.x + 3, p.y + 9, Math.min(10, 2 + Math.floor(v / 25)), { colors: pal.dust, speed: 20 + v * 0.15, angle: -Math.PI / 2, spread: 3, life: 0.35, drag: 5 });
          if (v > 40) AU.play('land', v);

        case 'throw': {

        }
        case 'blink': {
          const fx = e.a + 3, fy = e.b + 4, tx = e.c + 3, ty = e.d + 4, F = FL[e.e || 0];
          G.ghosts.push({ x: e.a, y: e.b, t: 0, facing: p.facing, frame: currentFrame() });
          const n = Math.min(26, 6 + Math.floor(Math.hypot(tx - fx, ty - fy) / 4));
          const cols = [F.spark[0], F.spark[1], '#ffb3d6', '#ffffff'];
          for (let i = 0; i < n; i++) {
            const k = i / n;
            part({ x: fx + (tx - fx) * k + (Math.random() - 0.5) * 4, y: fy + (ty - fy) * k + (Math.random() - 0.5) * 4, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20 - 10, life: 0.25 + k * 0.35, c: cols[i % 4], drag: 3 });

          }

        }
        case 'hang': {

          AU.play('hang'); break;
        }
        case 'rekindle': burst(p.x + 3 + p.facing * 5, p.y + 4, 5, { colors: ['#ffe08a', '#ff9a3a', '#fff6d6'], speed: 22, angle: -Math.PI / 2, spread: 1.2, life: 0.4, drag: 3 }); AU.play('rekindle'); break;
        case 'brazier': {

        case 'lbounce': {

          const col = room.biome === 1 ? ['#e8d4ff', '#b58cff', '#fff3a8'] : room.biome === 2 ? ['#dff0ff', '#9fc4ff', '#fff3a8'] : ['#ffe0f0', '#ff9fcf', '#fff3a8'];
          burst(b.x + b.tilt * 3, b.y - 2, e.type === 'bounce' ? 14 : 8, { colors: col, speed: 60, angle: -Math.PI / 2 + b.tilt * 0.52, spread: 2.6, life: 0.5, drag: 3 });

          burst(e.b, e.c - 3, 16, { colors: w.flame >= 0 ? FL[w.flame].hot.slice(0, 3) : ['#fff3b0', '#ffc24a', '#ffffff'], speed: 55, life: 0.6, drag: 3, g: -20 });

        }
        // a coloured wick refuses the wrong flame: a puff of its own colour
        case 'sputter': {

        }
        case 'gate':
          for (const gt of (room.gates[e.a || 0] || { tiles: room.gateTiles }).tiles) burst(gt.tx * T + 4, gt.ty * T + 4, 3, { colors: pal.dust, speed: 20, life: 0.8, drag: 2 });
          addShake(2); AU.play('gate'); break;
        case 'petal':
          burst(e.a, e.b, 22, { colors: ['#ffffff', '#d8fbff', '#9fe8ff', '#b0a0ff'], speed: 80, life: 0.7, drag: 3 });

        case 'die':
          burst(e.a + 3, e.b + 4, 26, { colors: ['#ffffff', '#fff6e6', '#fb9cc4', '#e06ea4', '#ffe29a'], speed: 110, life: 0.8, drag: 3, g: 60, size: 2 });
          burst(e.a + 3, e.b + 4, 10, { colors: ['#ffcf6e', '#ff9a3a'], speed: 50, life: 0.5, drag: 3 });

        case 'respawn':
          for (let i = 0; i < 18; i++) {
            const a = i / 18 * Math.PI * 2;
            part({ x: p.x + 3 + Math.cos(a) * 26, y: p.y + 4 + Math.sin(a) * 26, vx: -Math.cos(a) * 60, vy: -Math.sin(a) * 60, life: 0.4, c: i & 1 ? '#fff6d6' : '#ffc4dc', drag: 1 });
          }
          G.anim.sx = 0.6; G.anim.sy = 1.4; AU.play('respawn');
          if (sim === G.sim && G.backTo) G.goBack = true;
          break;
        case 'shake': { const c = room.crumbles[e.a]; burst(c.tx * T + 4, c.ty * T + 8, 3, { colors: pal.crumble, speed: 12, g: 200, life: 0.4 }); AU.play('shake'); break; }
        case 'crumble': { const c = room.crumbles[e.a]; burst(c.tx * T + 4, c.ty * T + 4, 12, { colors: pal.crumble.slice(0, 3), speed: 40, g: 300, life: 0.8, drag: 1, size: 2, jx: 6, jy: 6 }); AU.play('crumble'); break; }
        case 'reform': { const c = room.crumbles[e.a]; burst(c.tx * T + 4, c.ty * T + 4, 6, { colors: pal.dust, speed: 20, life: 0.4 }); AU.play('reform'); break; }
        case 'fizzle': burst(p.x + 3 + p.facing * 5, p.y + 3, 4, { colors: ['#8a8aa0', '#5a5a70'], speed: 12, angle: -Math.PI / 2, spread: 1, life: 0.5, g: -20 }); AU.play('fizzle'); break;
        case 'recall': AU.play('recall'); break;
        case 'catch': AU.play('catch'); break;
        case 'blinkfail': AU.play('fizzle'); break;
        case 'exit': break;
        case 'finale': break;
        // ---- the lab's
        case 'fling': burst(e.a + 3, e.b + 4, 10, { colors: ['#fff6d6', '#ffe08a', '#ffc4dc'], speed: 40, angle: Math.atan2(-e.d, -e.c), spread: 1.2, life: 0.35, drag: 4 }); AU.play('fling'); break;
        case 'ember': {
          const F = FL[room.embers[e.a].flame];
          burst(e.b, e.c - 2, 14, { colors: [F.spark[0], F.spark[1], F.spark[2], '#ffffff'], speed: 60, life: 0.45, drag: 3 });

        }
        case 'emberback': { const em = room.embers[e.a]; burst(em.x, em.y - 2, 5, { colors: FL[em.flame].spark.slice(0, 3), speed: 18, life: 0.35, drag: 3 }); soundOnce('emberback', 0.1); break; }
        case 'goldember': {

          burst(e.b, e.c - 2, 14, { colors: [F.spark[0], F.spark[1], F.spark[2], '#ffffff'], speed: 60, life: 0.45, drag: 3 });
          AU.play('ember', e.d); break;
        }
        case 'glass': {
          const q = room.react[e.a];
          if (e.b && Math.random() < 0.3) burst(q.tx * T + 4, q.ty * T + 2, 2, { colors: ['#fffcee', '#fff0bc'], speed: 14, life: 0.3, drag: 3 });
          if (!e.b && Math.random() < 0.3) burst(q.tx * T + 4, q.ty * T + 4, 2, { colors: ['#6a78a4', '#3e4868'], speed: 10, g: 60, life: 0.4, drag: 2 });
          soundOnce(e.b ? 'glasson' : 'glassoff', 0.07); break;
        }
        case 'melt': { const q = room.react[e.a]; burst(q.tx * T + 4, q.ty * T + 6, 6, { colors: ['#fffadc', '#fbe6b4', '#efc98a'], speed: 18, g: 240, life: 0.6, drag: 1 }); soundOnce('melt', 0.08); break; }
        case 'waxset': soundOnce('waxset', 0.12); break;
        case 'ignite': burst(e.b, e.c, 4, { colors: FL[FLAME.CRIMSON].hot.slice(0, 4), speed: 30, angle: -Math.PI / 2, spread: 1.6, life: 0.4, drag: 2, g: -60 }); soundOnce('ignite', 0.06); break;
        case 'ash': { const q = room.react[e.a]; burst(q.tx * T + 4, q.ty * T + 4, 4, { colors: ['#4a4452', '#6e6676', '#2a2630'], speed: 16, g: -20, life: 0.9, drag: 1 }); break; }
        case 'regrow': soundOnce('regrow', 0.15); break;
        case 'dripfall': break;
        case 'splash':
          burst(e.a, e.b, 4, { colors: ['#e8f6ff', '#9fd0ff'], speed: 26, angle: -Math.PI / 2, spread: 2.2, g: 300, life: 0.3, drag: 1 });
          if (Math.abs(e.a - G.cam.x - VW / 2) < VW / 2 && Math.abs(e.b - G.cam.y - VH / 2) < VH / 2) soundOnce('drip', 0.05);
          break;

        case 'hookon': burst(e.a, e.b, 6, { colors: ['#fff0b0', '#a898b0'], speed: 30, life: 0.3, drag: 5 }); AU.play('hookon'); break;
        case 'hanghook': AU.play('hang'); break;
        case 'hover': burst(e.a, e.b, 12, { colors: FL[FLAME.GOLD].spark, speed: 40, life: 0.45, drag: 4 }); AU.play('hover'); break;
        case 'gateclose': AU.play('gateclose'); break;
        case 'gateshut': addShake(1.5); AU.play('gateshut'); break;
        case 'candleout': burst(e.b, e.c - 8, 6, { colors: ['#8a8aa8', '#c0c0d8'], speed: 10, angle: -Math.PI / 2, spread: 1, g: -20, life: 1, drag: 1 }); AU.play('candleout'); break;
        case 'candledouse': burst(e.b + ox, e.c - 8 + oy, 8, { colors: ['#e8f6ff', '#9fb4c8', '#c0c0d8'], speed: 14, angle: -Math.PI / 2, spread: 1.2, g: -30, life: 0.8, drag: 1 }); AU.play('candledouse'); break;
        case 'goldcatch': {
          // Taper's gold catching in a candle
          const l = room.lamps[e.a], hy = l && l.hood ? 12 : 8;

        case 'fuse': {
          // the spark carrying it on from one candle to the next, arriving as that one catches
          const a = room.lamps[e.a], b = room.lamps[e.b], D = room.catchDelay || P.CATCH_DELAY;
          if (!a || !b) break;

          part({ x: ax, y: ay, vx, vy, life: D, c: '#fff3a8', size: 2, glow: 1 });

        case 'snuffkill': break;
        case 'drown': burst(e.a, e.b, 16, { colors: ['#e8f6ff', '#9fd0ff', '#5a92d4'], speed: 60, angle: -Math.PI / 2, spread: 1.6, g: 300, life: 0.6, drag: 1 }); AU.play('drown'); break;

      if (e.type === 'die' && G.lab && sim === G.sim) {

      } else if (e.type === 'die' && sim === G.sim && !G.room.def.sandbox) {
        if (G.jr) G.jr.deaths++;

      }
    }
    sim.events.length = 0;
    // what happened next door happens where that room sits
    if (ox || oy) for (let k = n0; k < G.particles.length; k++) { G.particles[k].x += ox; G.particles[k].y += oy; }
  }
  function addShake(v) { if (!reduceMotion) G.shake = Math.max(G.shake, v); }
  // a sound that many things can set off at once (a pane of glass lighting tile by tile) plays once in a while
  const soundLast = {};
  function soundOnce(name, gap) { if ((soundLast[name] || -1) > G.t - gap) return; soundLast[name] = G.t; AU.play(name); }

  // ------------------------------------------------------------------ camera
  function updateCamera(snap) {
    const p = G.sim.p, r = G.room, L = G.sim.L;
    let tx = p.x + 3 - VW / 2 + p.facing * 14, ty = p.y + 4 - VH / 2 - 8;
    if (L.state === LSTATE.FLY || L.state === LSTATE.STUCK) {
      // the view leans toward the lantern, but only so far: it may be left anywhere now
      tx += Math.max(-60, Math.min(60, (L.x + 2 - (p.x + 3)) * 0.25));
      ty += Math.max(-40, Math.min(40, (L.y + 2 - (p.y + 4)) * 0.25));
    }
    // with the lantern through a doorway, the view reaches into the room next door to show it
    let x0 = 0, y0 = 0, x1 = r.pw, y1 = r.ph;
    if (G.away) {
      const a = G.away, gr = a.sim.room, gl = a.sim.L;
      tx += Math.max(-150, Math.min(150, (gl.x + 2 + a.ox - (p.x + 3)) * 0.55));
      ty += Math.max(-80, Math.min(80, (gl.y + 2 + a.oy - (p.y + 4)) * 0.55));
      x0 = Math.min(0, a.ox); y0 = Math.min(0, a.oy); x1 = Math.max(r.pw, a.ox + gr.pw); y1 = Math.max(r.ph, a.oy + gr.ph);
    }
    if (G.talk && G.talk.npc && G.talk.npc.who !== 'sign') tx += (G.talk.npc.px - (p.x + 3)) * 0.5 - p.facing * 14;
    if (G.finale) { tx = r.great.x - VW / 2; ty = r.great.y - VH / 2 + 10; }
    const mx = x1 - x0 - VW, my = y1 - y0 - VH;
    tx = mx < 0 ? x0 + mx / 2 : Math.max(x0, Math.min(x0 + mx, tx));
    ty = my < 0 ? y0 + my / 2 : Math.max(y0, Math.min(y0 + my, ty));
    if (snap) { G.cam.x = tx; G.cam.y = ty; return; }
    G.cam.x += (tx - G.cam.x) * 0.1;
    G.cam.y += (ty - G.cam.y) * 0.1;
  }

  // ------------------------------------------------------------------ moth animation
  function currentFrame() {
    const p = G.sim.p, a = G.anim, set = p.facing > 0 ? S.moth : S.mothL;
    if (p.hang) return set.idle[Math.floor(a.idleT * 3.2) % 4];
    if (p.perch > 0) return set.perch[Math.floor(G.t * 4) % 2];
    if (!p.grounded) {
      if (p.gliding) return set.glide[Math.floor(a.glideT * 12) % 4];
      if (p.vy < -40) return set.rise[Math.floor(G.t * 10) % 2];
      return set.fall[Math.floor(G.t * 8) % 2];
    }
    if (a.sy < 0.85) return set.land;
    if (Math.abs(p.vx) > 8) return set.run[Math.floor(a.runDist / 5) % 6];
    if (a.blinkT < 0.12) return set.blink;
    return set.idle[Math.floor(a.idleT * 3.2) % 4];
  }
  function updateAnim(dt) {
    const p = G.sim.p, a = G.anim;
    a.sx += (1 - a.sx) * Math.min(1, dt * 12);
    a.sy += (1 - a.sy) * Math.min(1, dt * 12);
    if (p.grounded) a.runDist += Math.abs(p.vx) * dt;
    a.glideT = p.gliding ? a.glideT + dt : 0;
    a.idleT += dt;
    a.blinkT -= dt;
    if (a.blinkT < -2.5 - Math.random() * 3) a.blinkT = 0.12;
    // lantern pendulum reacts to acceleration
    const ax = (p.vx - a.lastVx) / dt;
    a.lastVx = p.vx;
    a.swingV += (-a.swing * 60 - a.swingV * 5 - ax * 0.02) * dt;
    a.swing += a.swingV * dt;
    a.swing = Math.max(-1.2, Math.min(1.2, a.swing));
    // ambient particles from the moth while gliding
    if (p.gliding && Math.random() < 0.25) part({ x: p.x + 3 - p.facing * 3, y: p.y + 3, vx: -p.facing * 10, vy: 10, life: 0.5, c: Math.random() < 0.5 ? '#ffe6f0' : '#fb9cc4', drag: 2 });
  }

  // ------------------------------------------------------------------ drawing: world
  // the sky behind a room, placed by where the view is in the world: across, it scrolls with the world, so it runs
  // on unbroken through a doorway; up and down it hangs from `anchor` (a room's bottom, in the world: the current
  // room's eases there from the last one's) and never lifts off the bottom of the view
  function drawSky(r, cx, cy, anchor) {
    const w = WORLD[r.index];
    drawBackdrop(w.x + cx, 0, r.biome, VH + Math.max(0, anchor - VH - (w.y + cy)), r.look);
  }
  function drawBackdrop(cx, cy, biome, roomH, look, alpha) {
    const layers = backdrop(biome, look), fade = alpha === undefined ? 1 : alpha;
    for (const L of layers) {
      const ly = Math.round(L.y + ((roomH - VH) - cy) * L.fy);
      if (L.alpha || fade < 1) V.globalAlpha = (L.alpha || 1) * fade;
      if (!L.wrap) V.drawImage(L.c, 0, ly);
      else {
        const w = L.c.width;
        let lx = -Math.round(cx * L.fx + (L.drift ? G.t * L.drift : 0)) % w;
        if (lx > 0) lx -= w;
        V.drawImage(L.c, lx, ly); V.drawImage(L.c, lx + w, ly);
      }
      V.globalAlpha = 1;
      if (biome === 2 && L.fx === 0.07 && G.lightning > 0.55) drawBolt(cx);
      if (biome === 0 && L.fx === 0.1) (look === 'night' ? drawLostMoths : drawBirds)(cx, cy, roomH);
    }
  }
  // at night the moor's sky holds lost moths, circling lights too far away to see
  function drawLostMoths(cx, cy, roomH) {
    for (let i = 0; i < 7; i++) {
      const ox = ((i * 131 - cx * 0.14) % 420 + 420) % 420 - 50, oy = 60 + (i * 37) % 70 + ((roomH - VH) - cy) * 0.15;
      const a = G.t * (1.3 + (i % 3) * 0.4) + i;
      const x = Math.round(ox + Math.cos(a) * (5 + i % 4)), y = Math.round(oy + Math.sin(a * 1.3) * 3);
      V.fillStyle = i % 2 ? '#d8d0f4' : '#a89cd8';
      V.fillRect(x, y, 1, 1);
      if (Math.floor(G.t * 12 + i) & 1) { V.fillRect(x - 1, y - 1, 1, 1); V.fillRect(x + 1, y - 1, 1, 1); }
    }
  }
  function drawBirds(cx, cy, roomH) {
    V.fillStyle = '#3a1a3e';
    for (let i = 0; i < 6; i++) {
      const sp = 9 + i * 2.3;
      const x = Math.round(((i * 97 + G.t * sp - cx * 0.14) % 420 + 420) % 420 - 50);
      const y = Math.round(40 + i * 11 + Math.sin(G.t * 0.7 + i) * 4 + ((roomH - VH) - cy) * 0.15);
      const up = Math.floor(G.t * 5 + i) & 1;
      V.fillRect(x, y, 1, 1); V.fillRect(x - 1, y - up, 1, 1); V.fillRect(x + 1, y - up, 1, 1);
      if (!up) { V.fillRect(x - 2, y - 1, 1, 1); V.fillRect(x + 2, y - 1, 1, 1); }
    }
  }
  let bolt = null;
  function drawBolt() {
    if (!bolt) return;
    V.fillStyle = '#eef2ff';
    for (const [x, y] of bolt) V.fillRect(x, y, 1, 2);
  }
  function makeBolt() {
    const pts = [];
    let x = 40 + Math.random() * 240, y = 0;
    while (y < 120) { pts.push([Math.round(x), y]); y += 2; x += (Math.random() - 0.5) * 5; if (Math.random() < 0.05) { let bx = x, by = y; for (let k = 0; k < 14; k++) { pts.push([Math.round(bx), by]); by += 2; bx += (Math.random() - 0.2) * 3; } } }
    return pts;
  }

  function drawDecor(cx, cy, pal, bake = G.bake) {
    const t = G.t;
    for (const d of bake.decor) {
      const x = d.x - cx, y = d.y - cy;
      if (x < -20 || x > VW + 20 || y < -40 || y > VH + 40) continue;
      const sway = Math.sin(t * 1.7 + d.x * 0.13) * (1 + Math.max(0, Math.abs(G.sim.wind) / 40));
      switch (d.kind) {
        case 'reed': {
          const h = 5 + Math.floor(d.v * 7);
          V.fillStyle = pal.grass[2];
          for (let k = 0; k < h; k++) V.fillRect(Math.round(x + sway * k / h * 1.5), y - 1 - k, 1, 1);
          V.fillStyle = pal.grass[0];
          V.fillRect(Math.round(x + sway * 1.5) - (d.v > 0.5 ? 1 : 0), y - h - 1, d.v > 0.5 ? 3 : 1, 2);
          if (d.v > 0.8) { V.fillStyle = pal.flowers[1]; V.fillRect(Math.round(x + sway * 1.5), y - h - 2, 1, 1); }
          break;
        }
        case 'vine': {
          V.fillStyle = pal.grass[3];
          for (let k = 0; k < d.len; k++) {
            const ox = Math.round(Math.sin(t * 1.2 + d.x * 0.2 + k * 0.25) * k / d.len * 2);
            V.fillRect(x + ox, y + k, 1, 1);
            if (k % 4 === 2) { V.fillStyle = pal.grass[1]; V.fillRect(x + ox + (k & 4 ? 1 : -1), y + k, 1, 1); V.fillStyle = pal.grass[3]; }
          }
          if (d.v > 0.7) { V.fillStyle = pal.flowers[d.v > 0.85 ? 0 : 1]; V.fillRect(x + Math.round(Math.sin(t * 1.2 + d.x * 0.2 + d.len * 0.25) * 2), y + d.len, 1, 1); }
          break;
        }
        case 'shroom': {
          const g = pal.glow[Math.floor(d.v * 4) % 5], h = 2 + Math.floor(d.v * 3), w = 2 + Math.floor(d.v * 2);
          V.fillStyle = '#c8d8e0'; V.fillRect(x, y - h, 1, h);
          V.fillStyle = A.mix(g, '#000000', 0.35); V.fillRect(x - w, y - h - 1, w * 2 + 1, 1);
          V.fillStyle = g; V.fillRect(x - w + 1, y - h - 2, w * 2 - 1, 1);
          V.fillStyle = '#ffffff'; V.fillRect(x - 1, y - h - 2, 1, 1);
          break;
        }
        case 'root': {
          V.fillStyle = pal.stone[5];
          const len = Math.min(d.len, 14);
          for (let k = 0; k < len; k++) V.fillRect(x + Math.round(Math.sin(t * 0.8 + d.x + k * 0.3) * k / len), y + k, 1, 1);
          V.fillStyle = pal.glow[d.v > 0.5 ? 0 : 3];
          V.fillRect(x + Math.round(Math.sin(t * 0.8 + d.x + len * 0.3)), y + len, 1, 1);
          break;
        }
        case 'crystal': {
          const g = d.v > 0.5 ? pal.glow[0] : pal.glow[4];
          V.fillStyle = A.mix(g, '#000000', 0.4);
          const s = d.s;
          V.fillRect(x, y, s, 1); V.fillRect(x, y + 1, s * 2, 1); V.fillRect(x, y + 2, s, 1);
          V.fillStyle = g; V.fillRect(x + (s > 0 ? 1 : -1), y + 1, s > 0 ? 2 : -2, 1);
          V.fillStyle = '#ffffff'; V.fillRect(x + s * 2, y + 1, 1, 1);
          break;
        }
        case 'ivy': {
          V.fillStyle = pal.grass[3];
          for (let k = 0; k < 8; k += 2) V.fillRect(x + (k & 2 ? d.s : 0), y + k + 1, 1, 2);
          V.fillStyle = pal.grass[1];
          V.fillRect(x + d.s, y + 2, 1, 1); V.fillRect(x, y + 5, 1, 1);
          break;
        }
        case 'chain': {
          V.fillStyle = '#3a3f58';
          const len = Math.min(d.len, 10);
          for (let k = 0; k < len; k++) V.fillRect(x + Math.round(sway * k / len), y + k, 1, 1);
          V.fillStyle = pal.brass[1]; V.fillRect(x + Math.round(sway) - 1, y + len, 3, 2);
          break;
        }
        case 'post': break;
        case 'bollard': {
          // an iron mooring post on a quay, a rope's worn ring round its neck
          V.fillStyle = pal.outline; V.fillRect(x - 2, y - 6, 5, 6);
          V.fillStyle = pal.stone[3]; V.fillRect(x - 1, y - 5, 3, 5);
          V.fillStyle = pal.stone[2]; V.fillRect(x - 2, y - 7, 5, 2);
          V.fillStyle = pal.rimTop2; V.fillRect(x - 1, y - 7, 2, 1); V.fillRect(x - 1, y - 5, 1, 3);
          if (d.v > 0.5) { V.fillStyle = pal.wood[3]; V.fillRect(x - 2, y - 4, 5, 1); }
          break;
        }
      }
    }
  }

  // false while drawing a second view of the world, or a frame the world hasn't moved on since the last one
  // (paused, or a screen refreshing faster than the game steps), so drawing spawns no particles
  let fxOn = true;
  // each gate carries a row of sockets, one for every lamp in the room, that light in the lamp's own colour as
  // it catches, so the gate shows how close it is to opening; they fade as the gate lifts
  // the rooms next door that show past this room's edges (while the view slides across a doorway, or reaches
  // after the lantern): the one the lantern is in, as it is now, and every room a doorway here leads to in this
  // area, as it was left (a secret room only once it has been found; another area is a scene of its own). A secret room and the room beside it can lie in the same
  // place past an edge; then only one shows: the lantern's, else the one just left, else the journey's.
  function neighbourViews(cx, cy) {
    const out = [], rank = [];
    const add = (i, ox, oy, st, k) => {
      const r = G.sim.rooms[i];
      if (out.some(v => v.index === i) || !(ox < cx + VW && ox + r.pw > cx && oy < cy + VH && oy + r.ph > cy)) return;
      out.push({ index: i, ox, oy, st, w: r.pw, h: r.ph }); rank.push(k);
    };
    if (G.away) add(G.away.sim.roomIndex, G.away.ox, G.away.oy, G.away.sim, 0);
    for (const d of G.room.doors) {
      const lk = d.link;
      if (!lk || lk.scene) continue;
      const def = G.sim.rooms[lk.to].def;
      if (def.secret && !G.visited.has(lk.to)) continue;
      add(lk.to, lk.ox * T, lk.oy * T, G.roomStates[lk.to] || G.viewStates[lk.to] || (G.viewStates[lk.to] = freshView(lk.to)), lk.to === G.lastRoom ? 1 : def.secret ? 3 : 2);
    }
    const order = out.map((v, k) => k).sort((a, b) => rank[a] - rank[b]), keep = [];
    const area = (a, b) => Math.max(0, Math.min(a.ox + a.w, b.ox + b.w) - Math.max(a.ox, b.ox)) * Math.max(0, Math.min(a.oy + a.h, b.oy + b.h) - Math.max(a.oy, b.oy));
    for (const k of order) {
      const v = out[k], over = keep.filter(u => area(u, v) > 0);
      // where a sliver of one is under another, it's hidden under the one in front; more than that, only that shows
      if (over.some(u => area(u, v) > 0.2 * Math.min(u.w * u.h, v.w * v.h))) continue;
      v.excl = over; keep.push(v);
    }
    return keep;
  }
  // the stone around the rooms in view, drawn where no room is (and only there), under them all
  function drawMargins(views, cx, cy) {
    const rooms = [{ r: G.room, ox: 0, oy: 0 }].concat(views.map(v => ({ r: G.sim.rooms[v.index], ox: v.ox, oy: v.oy })));
    if (rooms.some(q => q.ox <= cx && q.oy <= cy && q.ox + q.r.pw >= cx + VW && q.oy + q.r.ph >= cy + VH)) return;
    V.save(); V.beginPath(); V.rect(0, 0, VW, VH);
    for (const q of rooms) V.rect(q.ox - cx, q.oy - cy, q.r.pw, q.r.ph);
    V.clip('evenodd');
    for (const q of rooms) {
      const m = marginOf(q.r), d = m.M * T;
      V.drawImage(m.fg, q.ox - cx - d, q.oy - cy - d);
      V.drawImage(m.front, q.ox - cx - d, q.oy - cy - d);
    }
    V.restore();
  }
  function freshView(i) { VIEW_SIM.taken = G.sim.taken; VIEW_SIM.setRoom(i, null, false); return viewState(VIEW_SIM); }
  function drawNeighbour(v, cx, cy) {
    const r = G.sim.rooms[v.index], b = baked(r), pal = palOf(r), SB = spritesOf(r), st = v.st;
    prepRoom(r);
    const vx = cx - v.ox, vy = cy - v.oy, fx = fxOn;
    fxOn = false;
    // under a room in front of it, a sliver of it doesn't show
    const clipped = v.excl && v.excl.length;
    if (clipped) {
      V.save(); V.beginPath(); V.rect(-vx, -vy, r.pw, r.ph);
      for (const u of v.excl) V.rect(u.ox - cx, u.oy - cy, u.w, u.h);
      V.clip('evenodd');
    }
    V.drawImage(b.bg, -vx, -vy);
    drawDecor(vx, vy, pal, b);
    V.drawImage(b.fg, -vx, -vy);
    const fa = G.seen.has('found:' + r.name) ? 0.45 : 1;
    if (b.lining && fa < 1) { V.globalAlpha = 1 - fa; V.drawImage(b.lining, -vx, -vy); V.globalAlpha = 1; }
    drawProps(vx, vy, r);
    drawTiles(vx, vy, pal, SB, r, st);
    drawGatePips(vx, vy, r, st);
    drawObjects(vx, vy, pal, SB, r, st);
    if (b.fake) { V.globalAlpha = fa; V.drawImage(b.fake, -vx, -vy); V.globalAlpha = 1; }
    V.drawImage(b.front, -vx, -vy);
    if (clipped) V.restore();
    fxOn = fx;
  }

  // each gate carries a row of sockets, one for each of its keys (every lamp in the room, for a gate of the old
  // kind; its own wicks, candles and hooks otherwise), that light as the key is held: a lamp in its own colour, a
  // hook while the lantern hangs on it; a candle's flickers as it burns low. They fade as the gate lifts.
  function gatePips(r) {
    if (r.gatePips) return r.gatePips;
    const out = [];
    r.gates.forEach((gate, gi) => {
      if (!gate.keys.length || !gate.tiles.length) return;
      const seen = new Set(), key = (x, y) => y * r.w + x, isG = (x, y) => gate.tiles.some(g => g.tx === x && g.ty === y);
      const at = k => k.lamp >= 0 ? r.lamps[k.lamp] : r.hooks[k.hook];
      const keys = gate.keys.slice().sort((a, b) => at(a).tx - at(b).tx || at(a).ty - at(b).ty);
      for (const g of gate.tiles) {
        if (seen.has(key(g.tx, g.ty))) continue;
        // one piece of the gate: the gate tiles joined to this one
        let x0 = g.tx, x1 = g.tx, y0 = g.ty, y1 = g.ty;
        const stack = [[g.tx, g.ty]];
        seen.add(key(g.tx, g.ty));
        while (stack.length) {
          const [x, y] = stack.pop();
          x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = x + dx, ny = y + dy;
            if (!seen.has(key(nx, ny)) && isG(nx, ny)) { seen.add(key(nx, ny)); stack.push([nx, ny]); }
          }
        }
        const tall = y1 - y0 >= x1 - x0, n = keys.length;
        const len = ((tall ? y1 - y0 : x1 - x0) + 1) * T, step = Math.min(10, len / (n + 1));
        keys.forEach((k, j) => {
          const d = len / 2 + (j - (n - 1) / 2) * step;
          out.push({ gate: gi, lamp: k.lamp, hook: k.hook, flame: k.lamp >= 0 ? r.lamps[k.lamp].flame : -1, x: tall ? (x0 + x1 + 1) * T / 2 : x0 * T + d, y: tall ? y0 * T + d : (y0 + y1 + 1) * T / 2 });
        });
      }
    });
    return (r.gatePips = out);
  }
  // how a key's socket shows: 0 dark, 1 lit, 2 lit but guttering (a candle low on time)
  function pipState(g, r, sim) {
    if (g.lamp >= 0) {
      const v = sim.lit[g.lamp], l = r.lamps[g.lamp];
      if (!(v > 0)) return 0;
      return l.burn && v < l.burn * 0.3 ? 2 : 1;
    }
    return sim.L && sim.L.state === LSTATE.STUCK && sim.L.hook === g.hook ? 1 : 0;
  }
  function drawGatePips(cx, cy, r = G.room, sim = G.sim) {
    for (const g of gatePips(r)) {
      const gt = sim.gT ? sim.gT[g.gate] : sim.gateT, a = 1 - gt;
      if (a <= 0.02) continue;
      const x = Math.round(g.x - cx), y = Math.round(g.y - cy - gt * 8);
      if (x < -4 || x > VW + 4 || y < -4 || y > VH + 4) continue;
      V.globalAlpha = a;
      V.fillStyle = '#120c18'; V.fillRect(x - 2, y - 2, 5, 5);
      const st = pipState(g, r, sim);
      if (st && !(st === 2 && (Math.floor(G.t * 10) & 1))) {
        const c = g.hook >= 0 ? '#ffd27a' : g.flame >= 0 ? FL[g.flame].light : '#ffc070';
        V.fillStyle = c; V.fillRect(x - 1, y - 1, 3, 3);
        V.fillStyle = '#fff6e0'; V.fillRect(x, y, 1, 1);
      } else {
        V.fillStyle = '#3a3044'; V.fillRect(x - 1, y - 1, 3, 3);
        // a hook's socket is marked with the hook's shape
        if (g.hook >= 0) { V.fillStyle = '#6d5f72'; V.fillRect(x, y - 1, 1, 2); V.fillRect(x + 1, y + 1, 1, 1); }
      }
    }
    V.globalAlpha = 1;
  }

  function drawTiles(cx, cy, pal, SB, r = G.room, sim = G.sim) {
    const x0 = Math.max(0, Math.floor(cx / T)), x1 = Math.min(r.w - 1, Math.floor((cx + VW) / T));
    const y0 = Math.max(0, Math.floor(cy / T)), y1 = Math.min(r.h - 1, Math.floor((cy + VH) / T));
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const i = ty * r.w + tx, c = r.tiles[i];
      const x = tx * T - cx, y = ty * T - cy;
      switch (c) {
        case TILE.GRATE: V.drawImage(SB.grate[r.grateMask[i]], x, y); break;
        case TILE.ONEWAY: V.drawImage(SB.plank, x, y); break;
        case TILE.THORN: V.drawImage(SB.thorn[r.thornDir[i]][(tx * 7 + ty * 3) % 3], x, y); break;
        case TILE.CRUMBLE: {
          const k = r.crumbleIdx[i], st = sim.cs[k];
          if (st === 2) {
            if (sim.ct[k] < 0.25) { V.globalAlpha = 0.35; V.drawImage(SB.crumble[(tx + ty) % 3], x, y); V.globalAlpha = 1; }
            break;
          }
          const j = st === 1 ? Math.round((Math.random() - 0.5) * 2) : 0;
          V.drawImage(SB.crumble[(tx + ty) % 3], x + j, y);
          break;
        }
        case TILE.GATE: {
          const g = r.gateOf[i], gt = sim.gT && g >= 0 ? sim.gT[g] : sim.gateT;
          const off = Math.round(gt * 8);
          if (off >= 8) break;
          V.drawImage(SB.gate, 0, off, 8, 8 - off, x, y, 8, 8 - off);

  // ------------------------------------------------------------------ lighting

  const lights = [];

      else if (pr.k === 'flintlantern') addLight(pr.x * T + 4, (pr.y + 1) * T - 8, 30 + Math.sin(t * 3.1) * 5, '#ff5a3a', 0.32);

      else if (G.finale && G.finale.phase === 2 && G.finale.gift >= 0) addLight(r.great.x, r.greatFloor - 30, 60 + G.finale.gift * 18 + flick * 2, FL[G.finale.gift].light, 0.35);

  // ------------------------------------------------------------------ secrets
  // where a way to a secret room (a secret exit, and the fake wall in front of it) meets open air, petal motes
  // drift out of it: the only tell. A hidden stair that's only a way home or on up gives off none.
  function moteSpots(r) {
    const out = [];
    const at = (x, y) => x < 0 || y < 0 || x >= r.w || y >= r.h ? -1 : r.tiles[y * r.w + x];
    const toSecret = new Uint8Array(r.w * r.h), stack = [];
    for (let i = 0; i < r.w * r.h; i++) if (r.tiles[i] === TILE.SECRET) { toSecret[i] = 1; stack.push(i); }
    while (stack.length) {
      const i = stack.pop(), x = i % r.w, y = (i - x) / r.w;
      for (const [nx, ny] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const c = at(x + nx, y + ny), j = (y + ny) * r.w + x + nx;
        if ((c === TILE.FAKE || c === TILE.SECRET) && !toSecret[j]) { toSecret[j] = 1; stack.push(j); }
      }
    }
    for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
      const c = at(x, y);
      if ((c !== TILE.FAKE && c !== TILE.SECRET) || !toSecret[y * r.w + x]) continue;
      for (const [nx, ny] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        if (at(x + nx, y + ny) !== TILE.EMPTY) continue;
        out.push({ x: x * T + 4 + nx * 4, y: y * T + 4 + ny * 4, nx, ny });
      }
    }
    return out;
  }
  function secrets(dt) {
    const r = G.room, p = G.sim.p;
    if (r.fakes.length) {
      const inside = G.sim.overlapCode(p.x, p.y, P.W, P.H, TILE.FAKE) || G.sim.overlapCode(p.x, p.y, P.W, P.H, TILE.SECRET);
      const key = 'found:' + r.name;
      if (inside && !G.seen.has(key)) G.seen.add(key);
      const target = inside ? 0 : G.seen.has(key) ? 0.45 : 1;
      G.fakeA += (target - G.fakeA) * Math.min(1, dt * 6);
    }
    lampPosts();
    if (r.def.secret || !r.motes || !r.motes.length || !fxOn) return;
    G.moteT = (G.moteT || 0) + dt;
    if (G.moteT < 0.4) return;
    G.moteT = 0;
    const s = r.motes[Math.floor(Math.random() * r.motes.length)];
    if (Math.abs(s.x - (G.cam.x + VW / 2)) > VW || Math.abs(s.y - (G.cam.y + VH / 2)) > VH) return;
    const j = (Math.random() - 0.5) * 7;
    part({ x: s.x + (s.ny ? j : 0), y: s.y + (s.nx ? j : 0), vx: s.nx * (5 + Math.random() * 5) + (Math.random() - 0.5) * 3, vy: s.ny * (5 + Math.random() * 5) - 2 - Math.random() * 3, life: 1.8 + Math.random(), c: Math.random() < 0.5 ? '#d8fbff' : '#9fe8ff', drag: 0.4 });
  }

  const lampKey = (r, i) => 'lamp:' + r.name + ':' + i;
  const propLit = (r, pr, i) => !!pr.lit || ((pr.k === 'lamp' || pr.k === 'harbourlight') && G.seen.has(lampKey(r, i)));
  const lampHead = pr => [pr.x * T + 4, (pr.y + 1) * T - (pr.h || 30) + 4];
  function lampPosts() {
    const r = G.room, sim = G.sim, p = sim.p, L = sim.L, props = r.def.props || [];
    if (p.dead) return;
    let lx, ly;
    if (L.state === LSTATE.AWAY) return;
    if (L.state !== LSTATE.HELD) { lx = L.x + 2; ly = L.y + 2; }
    else if (p.spark) { const h = heldPos(); lx = h[0]; ly = h[1] + 4; }
    else return;
    props.forEach((pr, i) => {
      if ((pr.k !== 'lamp' && pr.k !== 'harbourlight') || propLit(r, pr, i)) return;
      // the harbour light's great lamp takes a flame anywhere near its glass
      const big = pr.k === 'harbourlight', [hx, hy] = big ? [pr.x * T + 4, (pr.y + 1) * T - 20] : lampHead(pr);
      if (Math.abs(lx - hx) > (big ? 16 : 7) || Math.abs(ly - hy) > (big ? 20 : 8)) return;
      G.seen.add(lampKey(r, i));
      burst(hx, hy - 2, big ? 48 : 16, { colors: ['#fff3b0', '#ffc24a', '#ffffff'], speed: big ? 90 : 55, life: big ? 1.2 : 0.6, drag: 3, g: -20 });
      AU.play('lamp');
    });
  }

  function weather(dt) {
    const r = G.room, cx = G.cam.x, cy = G.cam.y, pal = palOf(r);
    const wind = G.sim.wind;
    // a room with rain of its own (the sim's, which douses the lantern) draws its drops from the sim's clock
    // (drawRain); here, only a splash where one lands
    const rn = r.rain;
    if (rn) eachDrop(cx, cy, (x, y, sky) => { if (y + P.RAIN_VY * DT >= sky && Math.random() < 0.5) burst(x, sky - 1, 2, { colors: ['#9fb4e8', '#dfe8ff'], speed: 30, angle: -Math.PI / 2, spread: 1.6, g: 300, life: 0.25, drag: 1, kind: 'splash' }); });
    // (the lab's rooms are for learning the rules, and rain there always douses: no rain that doesn't)
    const storm = r.biome === 2 && r.look !== 'summit' && r.look !== 'dawn' && !(G.finale && G.finale.lit) && !r.def.lab;
    if (rn) { /* its own weather only */ }
    else if (r.biome === 0 && r.look === 'night') {
      // fireflies drifting over the grass, and a few pale motes
      if (Math.random() < 0.06) part({ x: cx + Math.random() * VW, y: cy + VH * (0.35 + Math.random() * 0.6), vx: 0, vy: 0, life: 3 + Math.random() * 3, c: Math.random() < 0.7 ? '#e8ff8a' : '#b8ff9a', kind: 'firefly', seed: Math.random() * 10, drag: 0.5 });
      if (Math.random() < 0.12) part({ x: cx + Math.random() * VW, y: cy + VH + 4, vx: 3 + Math.random() * 5, vy: -6 - Math.random() * 8, life: 6, c: pal.dust[Math.random() < 0.6 ? 0 : 3], drag: 0 });
    } else if (r.biome === 0) {
      if (Math.random() < 0.35) part({ x: cx + Math.random() * VW, y: cy + VH + 4, vx: 6 + Math.random() * 8, vy: -8 - Math.random() * 10, life: 5, c: Math.random() < 0.6 ? pal.dust[0] : pal.dust[1], drag: 0 });
      if (Math.random() < 0.04) part({ x: cx - 4, y: cy + Math.random() * VH * 0.7, vx: 20 + Math.random() * 20, vy: 6, life: 8, c: Math.random() < 0.5 ? '#c65a6a' : '#e8a04a', kind: 'leaf', drag: 0 });
    } else if (r.biome === 1) {
      if (Math.random() < 0.3) part({ x: cx + Math.random() * VW, y: cy + Math.random() * VH, vx: 0, vy: -3, life: 4, c: pal.glow[Math.floor(Math.random() * 5)], kind: 'spore', seed: Math.random() * 10, drag: 0.5 });
      if (Math.random() < 0.08) {
        const roots = G.bake.decor.filter(d => d.kind === 'root');
        if (roots.length) { const d = roots[Math.floor(Math.random() * roots.length)]; part({ x: d.x, y: d.y + Math.min(d.len, 14), vy: 0, g: 400, life: 1.2, c: '#8ffcf0', drag: 0 }); }
      }
    } else if (r.biome === 3) {
      // Lanternmere between showers: no rain but the sim's, only a haze of wet air drifting in off the harbour
      if (Math.random() < 0.08) part({ x: cx + Math.random() * VW, y: cy + VH * (0.3 + Math.random() * 0.7), vx: 4 + Math.random() * 6, vy: (Math.random() - 0.5) * 2, life: 7, c: pal.dust[Math.random() < 0.7 ? 1 : 0], drag: 0 });
    } else if (r.look === 'summit' || r.look === 'dawn') {
      // above the storm the air is still: frost motes drift up past the moon
      if (Math.random() < 0.18) part({ x: cx + Math.random() * VW, y: cy + VH + 4, vx: wind * 0.3 + (Math.random() - 0.5) * 4, vy: -6 - Math.random() * 6, life: 7, c: pal.dust[Math.floor(Math.random() * 4)], drag: 0 });
    } else if (storm) {
      for (let i = 0; i < 4; i++) part({ x: cx + Math.random() * (VW + 60) - 30 - wind * 0.4, y: cy - 6, vx: wind * 1.6 + 10, vy: 260 + Math.random() * 60, life: 1.2, c: Math.random() < 0.5 ? '#8fa2d8' : '#6a7ab8', kind: 'rain', drag: 0, fade: false, front: true });
    }
    if (Math.abs(wind) > 25 && Math.random() < Math.abs(wind) / 250) part({ x: wind > 0 ? cx - 10 : cx + VW + 10, y: cy + Math.random() * VH, vx: wind * 3, vy: 0, life: 1.6, c: '#dfe6ff', kind: 'wind', drag: 0, front: true });
    // lightning
    if (r.biome === 2 && r.look !== 'summit' && r.look !== 'dawn' && !(G.finale && G.finale.lit)) {
      G.nextLightning -= dt;
      if (G.nextLightning <= 0) {
        G.nextLightning = 7 + Math.random() * 9;
        G.lightning = reduceMotion ? 0.35 : 1;
        bolt = makeBolt();
        AU.play('thunder', 0.4 + Math.random() * 0.8);
      }
    }
    if (G.lightning > 0) G.lightning = Math.max(0, G.lightning - dt * 2.2);
    // continuous sounds
    if (audioStarted) {
      AU.setLoop('glide', G.sim.p.gliding ? 0.05 : 0, { type: 'bandpass', f: 900, q: 0.6, fmod: 700 + Math.sin(G.t * 50) * 300 });
      // the wind is a low rush rather than a hiss; it and the rain drop back while someone talks, so voices carry
      const hush = G.talk ? 0.3 : 1;
      AU.setLoop('wind', hush * (Math.min(0.08, Math.abs(wind) / 1400) + (r.biome === 2 ? 0.012 : 0)), { type: 'bandpass', f: 320, q: 0.6, fmod: 220 + Math.abs(wind) * 1.8 });
      // the sim's rain hisses as loud as how much of the view it's falling in, and louder where the moth is: it dips as
      // a dry spell comes down the screen and cuts out as it reaches the moth, the moment the lantern there is safe
      let rl = storm ? 0.035 : 0;
      if (rn) {
        let f = 0;
        for (let i = 0; i < 8; i++) if (G.sim.rainOn(cy + (i + 0.5) * VH / 8)) f++;
        rl = 0.03 * f / 8 + (G.sim.rainOn(G.sim.p.y + 4) ? 0.04 : 0);
      }
      AU.setLoop('rain', hush * rl, { type: 'highpass', f: 2500, q: 0.3, tc: rn ? 0.03 : 0.08 });
      // the tide, a low roar that grows as it comes up under the moth
      const td = r.tide ? Math.max(0, 1 - (G.sim.tideY - G.sim.p.y) / 160) : 0;
      AU.setLoop('tide', hush * td * 0.09, { type: 'lowpass', f: 260, q: 0.5, fmod: 180 + td * 200 });
      // falling water nearby
      let fw = 0;
      for (const f of r.falls) if (G.sim.fallOn(f)) { const d = Math.hypot((f.x0 + f.x1) / 2 - G.sim.p.x, (f.y0 + f.y1) / 2 - G.sim.p.y); fw = Math.max(fw, 1 - d / 200); }
      AU.setLoop('falls', hush * Math.max(0, fw) * 0.05, { type: 'bandpass', f: 1400, q: 0.4 });
    }
  }

  // ------------------------------------------------------------------ HUD
  function drawHUD(pal) {
    if (G.card) {
      const t = G.card.t;
      if (G.card.sec) {
        // a new section of the chapter reached: its name across the top, under the chapter's
        const a = t < 0.5 ? t / 0.5 : t > 2.8 ? Math.max(0, 1 - (t - 2.8) / 0.7) : 1;
        if (a > 0) {
          const w = Math.max(A.textWidth(G.card.sec, 2), A.textWidth(G.card.pre)) + 40;
          V.globalAlpha = a * 0.5; V.fillStyle = '#05030a'; V.fillRect(Math.round(VW / 2 - w / 2), 8, Math.round(w), 33); V.globalAlpha = a;
          A.drawText(V, G.card.pre, VW / 2, 12, pal.hint, { align: 'center', shadow: '#1a0d22' });
          V.fillStyle = pal.hint; V.fillRect(VW / 2 - 16, 21, 32, 1);
          A.drawText(V, G.card.sec, VW / 2, 25, '#ffffff', { align: 'center', scale: 2, shadow: '#1a0d22' });
          V.globalAlpha = 1;
        }
      } else if (G.card.big) {
        const a = t < 0.5 ? t / 0.5 : t > 2.6 ? Math.max(0, 1 - (t - 2.6) / 0.6) : 1;
        if (a > 0) {
          const pre = !!G.card.pre, y0 = pre ? 54 : 62;
          V.globalAlpha = a * 0.55; V.fillStyle = '#05030a'; V.fillRect(0, y0, VW, pre ? 56 : 44); V.globalAlpha = a;
          if (pre) A.drawText(V, G.card.pre, VW / 2, 61, pal.hint, { align: 'center', shadow: '#1a0d22' });
          A.drawText(V, G.card.big, VW / 2, pre ? 73 : 70, '#ffffff', { align: 'center', scale: 2, shadow: '#1a0d22' });
          V.fillStyle = pal.hint; V.fillRect(VW / 2 - 40, pre ? 92 : 89, 80, 1);
          A.drawText(V, G.card.small, VW / 2, pre ? 97 : 94, pal.hint, { align: 'center', shadow: '#1a0d22' });
          V.globalAlpha = 1;
        }
      } else {
        const a = t < 0.4 ? t / 0.4 : t > 2.2 ? Math.max(0, 1 - (t - 2.2) / 0.5) : 1;
        if (a > 0) { V.globalAlpha = a; A.drawText(V, G.card.small, 8, VH - 14, pal.hint, { shadow: '#1a0d22' }); V.globalAlpha = 1; }
      }
    }
    if (G.petalPop > 0) {
      const a = Math.min(1, G.petalPop);
      V.globalAlpha = a;
      V.drawImage(S.petal[0], 7, 6);
      A.drawText(V, G.sim.taken.size + '/' + TOTAL_PETALS, 19, 7, '#e6fbff', { shadow: '#101030' });
      V.globalAlpha = 1;
    }
  }

  // ------------------------------------------------------------------ transitions
  function drawIris(k, x, y) {
    // k: 0 = fully closed, 1 = fully open
    if (k >= 1) return;
    const R = Math.hypot(VW, VH) * k;
    D.globalCompositeOperation = 'source-over';
    D.clearRect(0, 0, VW, VH);
    D.fillStyle = '#07040c';
    D.fillRect(0, 0, VW, VH);
    D.globalCompositeOperation = 'destination-out';
    if (R > 1) {
      D.beginPath(); D.arc(Math.round(x), Math.round(y), R, 0, Math.PI * 2); D.fill();
    }
    D.globalCompositeOperation = 'source-over';
    V.drawImage(dark.c, 0, 0);
    if (R > 1 && R < 120) {
      V.strokeStyle = 'rgba(255,214,150,0.5)'; V.lineWidth = 1;
      V.beginPath(); V.arc(Math.round(x), Math.round(y), R, 0, Math.PI * 2); V.stroke();
    }
  }

  // ------------------------------------------------------------------ people, props and talk
  // Rooms place people (npcs: a first-meeting scene that plays by itself, then chat on S), things to read
  // (who 'sign': S reads them) and scenery props. Scenes and voices live in story.js.
  const STORY = window.WWStory || { CHARS: {}, SCENES: {} };
  const TALK_ROWS = 3, NEAR_X = 20, NEAR_Y = 16, MEET_X = 44;
  const IDLE_INPUT = { x: 0, y: 0, jump: false, jumpP: false, lantP: false, recallP: false };

  function setupPeople(r) {
    G.npcs = (r.def.npcs || []).map(n => Object.assign({}, n, { px: n.x * T + 4, py: (n.y + 1) * T, dir: n.face || -1, talks: 0, t: n.x * 1.7, ox: 0, oy: 0 }));
    G.talk = null; G.talkCool = 0;
  }

  // break a scene into pages that fit the box: [{ who, mood, label, rows, len }]
  function paginate(lines) {
    const pages = [];
    let acts = [];
    for (const [who, text, extra] of lines) {
      // a 'do' line is an action taken when the next page opens (or when the scene ends)
      if (who === 'do') { acts.push(text); continue; }
      const ch = STORY.CHARS[who] || {}, sign = who === 'sign' || !!ch.nobox;
      const maxw = sign ? 288 : 250, rows = [];
      let line = '';
      for (const w of text.split(' ')) {
        const t = line ? line + ' ' + w : w;
        if (line && A.textWidth(t, 1, true) > maxw) { rows.push(line); line = w; } else line = t;
      }
      if (line) rows.push(line);
      for (let i = 0; i < rows.length; i += TALK_ROWS) {
        const rs = rows.slice(i, i + TALK_ROWS);
        pages.push({ who, mood: sign ? '' : extra || '', label: who === 'sign' ? extra || '' : ch.name || '', rows: rs, len: rs.reduce((n, s) => n + s.length, 0), acts });
        acts = [];
      }
    }
    pages.endActs = acts;
    return pages;
  }
  function doActs(acts) {
    for (const a of acts || []) {
      const m = /^flame:(\d)$/.exec(a);
      if (m) {
        // a flame passes into the lantern
        const f = +m[1], [hx, hy] = heldPos(), hot = FL[f].hot;
        G.sim.relight(f);
        burst(hx, hy + 4, 18, { colors: [hot[0], hot[1], hot[2]], speed: 45, life: 0.6, drag: 3, g: -20 });
        G.flash = Math.max(G.flash, 0.1); AU.play('brazier', f);
      }
    }
  }

  function startTalk(id, npc) {
    const lines = STORY.SCENES[id];
    if (!lines || !lines.length) return false;
    // the box goes to whichever edge of the screen hides fewer of the speakers, the moth mattering most
    const my = G.sim.p.y + 4 - G.cam.y, ny = npc && npc.who !== 'sign' ? npc.py + npc.oy - 12 - G.cam.y : null;
    const hides = (y, top) => y !== null && (top ? y < 62 : y > VH - 62);
    const cost = top => (hides(my, top) ? 2 : 0) + (hides(ny, top) ? 1 : 0);
    const top = cost(true) === cost(false) ? my > VH * 0.5 : cost(true) < cost(false);
    G.talk = { id, pages: paginate(lines), i: 0, shown: 0, wait: 0.15, t: 0, blips: 0, npc: npc || null, top };
    doActs(G.talk.pages[0] && G.talk.pages[0].acts);
    if (G.card && G.card.t < 2.6) G.card.t = 2.6;
    G.seen.add(id);
    // the moth stops to listen, rather than running on the spot through the conversation
    const p = G.sim.p;
    p.vx = 0; p.gliding = false;
    if (npc && npc.who !== 'sign') p.facing = npc.px > p.x + 3 ? 1 : -1;
    AU.play(lines[0][0] === 'sign' ? 'paper' : 'talkopen');
    return true;
  }
  function endTalk() { const tk = G.talk; G.talk = null; G.talkCool = 0.3; if (tk) doActs(tk.pages.endActs); writeSave(); }

  function updateTalk(dt) {
    const tk = G.talk, pg = tk.pages[tk.i], ch = STORY.CHARS[pg.who] || {};
    const go = pressed.jump || pressed.lant || pressed.select || pressed.confirm || pressed.down;
    tk.t += dt;
    if (tk.shown < pg.len) {
      if (go) { tk.shown = pg.len; return; }
      tk.wait -= dt;
      const text = pg.rows.join('');
      while (tk.wait <= 0 && tk.shown < pg.len) {
        const c = text[tk.shown++];
        // letters type steadily, stops and pauses give the line room to breathe
        tk.wait += (c === '.' || c === '!' || c === '?' ? 0.22 : c === ',' || c === '—' ? 0.1 : 0.024) * (ch.pace || 1);
        if (ch.voice && /[A-Za-z]/.test(c) && tk.blips++ % 2 === 0) AU.play('voice', ch.voice);
      }
    } else if (go) {
      tk.i++; tk.shown = 0; tk.wait = 0.08;
      if (tk.i >= tk.pages.length) endTalk(); else { AU.play('talknext'); doActs(tk.pages[tk.i].acts); }
    }
  }

  function nearPerson() {
    const p = G.sim.p, mx = p.x + 3, my = p.y + P.H;
    let best = null, bd = 1e9;
    for (const n of G.npcs) {
      if (n.who === 'choir' && !n.lit) continue;
      const dx = Math.abs(n.px + n.ox - mx), dy = Math.abs(n.py - my);
      if (dx < (n.r || NEAR_X) && dy < (n.ny || NEAR_Y) && dx < bd) { best = n; bd = dx; }
    }
    return best;
  }

  // first meetings and room scenes play by themselves; S beside someone talks to them or reads the thing
  function checkTalk() {
    const p = G.sim.p;
    if (G.talkCool > 0 || p.dead || G.finale || G.trans || !p.grounded) return;
    const cardUp = G.card && G.card.big && G.card.t < 3.2;
    const mx = p.x + 3, my = p.y + P.H;
    for (const n of G.npcs) {
      if (n.who === 'choir' && !n.lit) continue;
      // a first meeting can wait on another scene (n.after), so nobody talks about something you haven't seen yet
      if (!cardUp && n.scene && !G.seen.has(n.scene) && (!n.after || G.seen.has(n.after)) && Math.abs(n.px - mx) < (n.meet || MEET_X) && Math.abs(n.py - my) < (n.ny || 24)) { startTalk(n.scene, n); return; }
    }
    for (const tr of G.room.def.talks || []) {
      if (!cardUp && !G.seen.has(tr.scene) && mx >= tr.x0 * T && mx < (tr.x1 + 1) * T && my > tr.y0 * T && my <= (tr.y1 + 1) * T) { startTalk(tr.scene); return; }
    }
    const n = nearPerson();
    if (n && pressed.down) {
      const chat = n.chat || [];
      const id = n.read || (chat.length ? chat[Math.min(n.talks, chat.length - 1)] : n.scene);
      if (id) { n.talks++; startTalk(id, n); }
    }
  }

  function updatePeople(dt) {
    const p = G.sim.p, L = G.sim.L;
    for (const n of G.npcs) {
      n.t += dt;
      // fireflies who forgot how to glow remember when a lit lantern comes close
      if (n.who === 'choir' && !n.lit && p.spark && !p.dead && Math.hypot(L.x + 2 - n.px, L.y + 2 - (n.py - 6)) < 30) {
        n.lit = true; n.litT = 0; AU.play('choir');
      }
      if (n.lit) n.litT += dt;
      // someone circling a light never stops circling it, except to hover and talk
      if (n.orbit) {
        if (n.os === undefined) { n.os = 1; n.oa = n.t; }
        n.os += ((G.talk ? 0 : 1) - n.os) * Math.min(1, dt * 4);
        n.oa += dt * n.os;
        const a = n.oa * (n.orbit.s || 2.2);
        const ox = Math.cos(a) * n.orbit.rx * T, oy = Math.sin(a * 2) * (n.orbit.ry || 0.6) * T;
        n.dir = -Math.sin(a) >= 0 ? 1 : -1;
        n.ox = ox; n.oy = oy;
      } else if (n.who !== 'sign') {
        const dx = p.x + 3 - n.px;
        n.dir = Math.abs(dx) < 70 ? (dx < 0 ? -1 : 1) : (n.face || -1);
      }
    }
    if (G.talkCool > 0) G.talkCool -= dt;

  function personImg(n) {

  function drawPeople(cx, cy) {
    for (const n of G.npcs) {

  // the firefly choir: dim specks on a root until a light reminds them, then a slow bright swarm
  function drawChoir(n, cx, cy) {
    for (let i = 0; i < 9; i++) {

      const lit = n.lit && n.litT > i * 0.12;

    }
  }

  // a little bubble over whoever S would talk to
  // how high the thing someone would talk to (or read) reaches above its footing, from what is actually drawn: the
  // prop standing where a sign is, a person's current sprite, the choir's swarm
  function personTop(n) {
    if (n.who === 'choir') return n.py - 24;
    if (n.who === 'sign') {
      // a small thing to read (a signpost, a lectern, chalk marks) is cleared whole; a note on something big, like
      // the lodge's door, sits at the sign's own height
      const pr = (G.room.def.props || []).find(q => q.k !== 'pennant' && q.x === n.x && q.y === n.y);
      const im = pr && propImg(pr, G.room.biome, !!pr.lit);
      if (im && -im.oy <= 28) return (pr.y + 1) * T + im.oy;
      return n.py - (n.h || 20);
    }
    const img = personImg(n);
    return n.py + n.oy - (img ? img.height : 24) + (n.hang ? Math.round(Math.sin(n.t * 1.1) * 2) : 0);
  }
  // the prompt to talk or read: a key cap and a word in a small dark pill, just clear of the top of the thing,
  // fading in rather than popping up
  function drawTalkPrompt(cx, cy, dt) {
    const n = !G.talk && !G.trans && G.sim.p.grounded ? nearPerson() : null;
    if (n) { if (G.prompt.n !== n) { G.prompt.n = n; G.prompt.a = 0; } G.prompt.a = Math.min(1, G.prompt.a + dt * 6); }
    else G.prompt.a = Math.max(0, G.prompt.a - dt * 8);
    const m = G.prompt.n;
    if (!m || G.prompt.a <= 0 || G.talk) return;
    const verb = m.who === 'sign' ? 'READ' : m.who === 'choir' ? 'LISTEN' : 'TALK';
    const key = lastDevice === 'touch' ? '' : keyName('DOWN');
    const kw = key ? A.textWidth(key) + 6 : 0, vw = A.textWidth(verb);
    const w = (key ? kw + 4 : 0) + vw + 8, h = 13;
    const ox = m.px + m.ox - cx, top = personTop(m) - cy;

  function propImg(pr, biome, lit) {
    const key = pr.k + ':' + biome + ':' + (G.room.look || '') + ':' + (lit ? 1 : 0) + ':' + (pr.h || 0) + ':' + (pr.v || 0);
    let s = S.props.get(key);
    if (!s) { s = A.paintProp(pr.k, A.palette(biome, G.room.look), { lit, h: pr.h, v: pr.v }); S.props.set(key, s); }
    return s;
  }
  function lampPostHeight(r, l) {
    if (l.postH) return l.postH;
    let ty = l.ty + 1;
    while (ty < r.h && r.tiles[ty * r.w + l.tx] !== TILE.SOLID) ty++;
    l.postH = ty * T - l.y + 4;

  }
  // a pennant on a pole, streaming downwind: limp in a lull, snapping flat in a gust
  function drawPennant(pr, cx, cy) {
    const h = pr.h || 28, bx = Math.round(pr.x * T + 4 - cx), by = Math.round((pr.y + 1) * T - cy);
    if (bx < -30 || bx > VW + 30 || by < -h - 10 || by - h > VH) return;
    V.fillStyle = '#2a2c3c'; V.fillRect(bx, by - h, 1, h); V.fillStyle = '#5a5e7a'; V.fillRect(bx - 1, by - h, 3, 1);
    const w = G.sim.wind, k = Math.min(1, Math.abs(w) / 110), dir = w < 0 ? -1 : 1;
    const ang = (1 - k) * 1.35 + k * 0.08;           // radians below the horizontal: hanging when calm, flat in a gale
    const len = 12, t = G.t * (4 + k * 10) + pr.x;
    for (let i = 1; i <= len; i++) {
      const f = i / len, flap = Math.sin(t - i * 0.7) * (0.6 + k * 1.4) * f;
      const x = bx + dir * Math.cos(ang) * i, y = by - h + 1 + Math.sin(ang) * i + flap;
      const half = Math.max(0, Math.round((1 - f) * 2.5));
      V.fillStyle = i % 3 === 0 ? '#8a3a30' : '#d46a4a';

  }
  function drawProps(cx, cy, r = G.room) {
    (r.def.props || []).forEach((pr, i) => {

      const s = propImg(pr, r.biome, propLit(r, pr, i));
      if (!s) return;
      const x = Math.round(pr.x * T + 4 + s.ox - cx), y = Math.round((pr.y + 1) * T + s.oy - cy);
      if (x > VW + 8 || y > VH + 8 || x + s.c.width < -8 || y + s.c.height < -8) return;

    });
  }

  function portraitImg(who, mood, frame, flip) {

  function drawTalk() {
    const tk = G.talk;
    if (!tk) return;
    const pg = tk.pages[tk.i], ch = STORY.CHARS[pg.who] || {}, sign = pg.who === 'sign', face = !sign && !ch.nobox, right = ch.side === 1;
    const bw = VW - 12, bh = 50, bx = 6, by = tk.top ? 5 : VH - bh - 5;

    V.fillRect(bx + 1, by + 1, 1, 1); V.fillRect(bx + bw - 2, by + 1, 1, 1); V.fillRect(bx + 1, by + bh - 2, 1, 1); V.fillRect(bx + bw - 2, by + bh - 2, 1, 1);

  // ------------------------------------------------------------------ play loop
  function readInput() {
    if (G.finale) return { x: 0, y: 0, jump: false, jumpP: false, lantP: false };
    const inp = {
      x: (cur.right ? 1 : 0) - (cur.left ? 1 : 0), y: cur.down ? 1 : 0,
      jump: !!cur.jump, jumpP: !!pressed.jump, lantP: !!pressed.lant, recallP: !!pressed.recall,
    };
    // the throw goes where the mouse points (or the right stick, or the touch pad); without one, straight ahead
    const aim = lastDevice === 'pad' ? padAim : lastDevice === 'touch' ? touchAim : mouseAt ? mouseAim() : null;
    if (aim) { inp.ax = aim[0]; inp.ay = aim[1]; }
    return inp;
  }
  function mouseAim() {
    const p = G.sim.p;
    const dx = mouseAt[0] + G.cam.x - (p.x + 3), dy = mouseAt[1] + G.cam.y - (p.y + 4), d = Math.hypot(dx, dy);

  function updatePlay(dt, forced) {
    const sim = G.sim;

      if (G.trans.phase === 'out' && G.trans.t >= G.trans.dur) {
        if (G.trans.next === 'ending') { G.mode = 'ending'; G.endKind = G.finished ? 'end' : 'cont'; G.endT = 0; G.trans = null; if (audioStarted) AU.setMusic(G.finished ? 'dawn' : 'title', G.finished); return; }
        if (G.trans.door) sceneCross(G.trans.door);

        G.trans = { phase: 'in', t: 0, dur: 0.5 };

    }
    if ((pressed.pause || (pressed.confirm && !G.talk)) && !G.finale) { openPause(); return; }
    if (pressed.mute) { AU.setMusicOn(!AU.musicOn); writeSave(); }
    const freeze = G.trans && G.trans.phase === 'out';
    if (!freeze) {
      if (G.talk) {
        // while someone speaks the moth and everything that could reach it hold still, so no gust or crumbling ledge
        // can take it mid-sentence; the weather and the water go on round them
        updateTalk(dt);
        sim.stepEnv();
      } else {

        sim.step(forced || readInput());

      }
      handleEvents();
      if (!G.finale) G.time += dt;
      if (G.lab && !G.talk && !sim.labDone) G.lab.t += dt;
      if (G.lab && sim.labDone && !G.trans) { finishLab(); return; }
      if (G.jr && !G.lab && !G.talk && !G.finale) G.jr.t += dt;
      // out by the way on of the last room built so far: the journey stops there, to be continued
      if (sim.journeyEnd && !G.trans) { journeyCleared(G.roomIndex); G.trans = { phase: 'out', t: 0, dur: 1.2, next: 'ending' }; }
    }

      if (sim.awayPress) { const k = sim.awayPress; sim.awayPress = null; if (G.away) { if (k === 'blink') blinkAway(); else recallAway(); } }
      if (sim.L.state === LSTATE.AWAY && !G.away && sim.lanternDoor) lanternAway();
      if (sim.L.state === LSTATE.AWAY && !G.away) sim.L.state = LSTATE.HELD;
      if (G.away) stepAway();

        sim.crossing = null;

  }

  function renderPlay(noHud) {

  // ------------------------------------------------------------------ finale
  function startFinale() {
    G.finale = { t: 0, phase: 0, lit: false, lx: 0, ly: 0 };
    const p = G.sim.p;
    G.finale.lx = p.x + 3; G.finale.ly = p.y + 2;
  }
  function updateFinale(dt) {
    const f = G.finale, r = G.room;
    f.t += dt;
    const gx = r.great.x, gy = r.greatFloor - 30;
    if (f.phase === 0 && f.t > 0.4) { f.phase = 1; f.t = 0; AU.play('throw'); }
    if (f.phase === 1) {
      const k = Math.min(1, f.t / 1.1);
      const e = k * k * (3 - 2 * k);
      f.x = f.lx + (gx - f.lx) * e; f.y = f.ly + (gy - f.ly) * e - Math.sin(k * Math.PI) * 30;
      if (Math.random() < 0.9) part({ x: f.x, y: f.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 0.5, c: Math.random() < 0.5 ? '#ffd27a' : '#fff6d6', drag: 2 });

      }
      if (Math.random() < 0.6 && f.gift >= 0) part({ x: gx + (Math.random() - 0.5) * 8, y: gy + (Math.random() - 0.5) * 8, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 20, life: 0.8, c: FL[f.gift].hot[1], drag: 2 });
      if (f.t >= 3.6) {

        burst(gx, gy, 70, { colors: ['#ffffff', '#fff8e8', '#ffe8f4', '#e8f4ff'], speed: 170, life: 1.5, drag: 1.5, size: 2 });
      }
    }
    if (f.phase === 3) {
      if (Math.random() < 0.3) part({ x: gx + (Math.random() - 0.5) * 60, y: gy + (Math.random() - 0.5) * 40, vx: 0, vy: -15, life: 2, c: '#fff0c0', drag: 0 });
      if (f.t > 4.5 && !G.trans) {
        G.finished = true;
