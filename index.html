    r.motes = r.motes || moteSpots(r);
  }

  // the drawings the rooms next door will need, made ahead a few at a time while nothing much is happening, so
  // going through a doorway doesn't stutter
  let warmQ = [], warming = false;
  function warmUp(r) {
    warmQ = [() => marginOf(r)];
    for (const d of r.doors) if (d.link) { const t = G.sim.rooms[d.link.to]; warmQ.push(() => baked(t), () => marginOf(t)); }
    if (warming) return;
    warming = true;
    const step = () => { const f = warmQ.shift(); if (!f) { warming = false; return; } f(); setTimeout(step, 80); };
    setTimeout(step, 300);
  }
  // the moth is in room i now: its people, its name (the first time this journey), its music, the save
  function roomArrived(i, card) {
    const r = G.sim.rooms[i];
    setupPeople(r);
    // a new chapter opens with its title; within a chapter each room just names itself, the first time
    const ch = r.def.chapter, CH = window.WWChapters || [];
    const first = !G.visited.has(i);
    G.visited.add(i);
    if (!card || !first) G.card = null;
    else if (ch && ch !== G.lastChapter && CH[ch - 1]) G.card = { t: 0, pre: 'CHAPTER ' + ch, big: CH[ch - 1].name, small: CH[ch - 1].area };
    else if (!ch && r.biome !== G.lastBiome) G.card = { t: 0, big: palOf(r).name, small: ROOM_CODE[i] + '  ' + r.name };
    else G.card = { t: 0, small: ROOM_CODE[i] + '  ' + r.name };
    G.lastChapter = ch || 0;
    G.lastBiome = r.biome;
    G.fakeA = 1;
    warmUp(r);
    // each chapter has its own theme; crossfade when the journey crosses into the next
    const th = themeOf(r);
    if (th !== G.lastTheme) { G.lastTheme = th; if (audioStarted) AU.setMusic(th); }
    writeSave();
  }

  // a room as it stands, for drawing next door: its state plus which petals are taken
  function viewState(sim) { const st = sim.roomState(); st.petalGot = sim.petalGot.slice(); return st; }

  // the moth goes through a doorway: the room next door takes over where it lines up, and the view slides across
  function cross(door) {
    const sim = G.sim, from = G.roomIndex, lk = door.link, to = lk.to, L = sim.L, was = sim.checkpoint;
    const leaving = viewState(sim);
    G.roomStates[from] = leaving;
    let st = G.roomStates[to] || null, live = false, bring = null;
    if (L.state === LSTATE.AWAY) {
      // into the room the lantern is in: it's there, where it lies; any further away, it comes home
      if (G.away && G.away.sim.roomIndex === to) { st = G.away.sim.roomState(); live = true; bring = Object.assign({}, G.away.sim.L); }
      else L.state = LSTATE.HELD;
      G.away = null;
    } else if (L.state !== LSTATE.HELD) {
      // the lantern stays in the room behind, flying on or lying where it stuck
      AWAY_SIM.taken = sim.taken;
      AWAY_SIM.setRoom(from, leaving, true);
      AWAY_SIM.t = sim.t; AWAY_SIM.events.length = 0;
      Object.assign(AWAY_SIM.L, L);
      if (AWAY_SIM.L.state === LSTATE.RET) AWAY_SIM.L.state = LSTATE.FLY;
      // (it sits at this room's corner until switchRoom moves everything over to the new room's)
      G.away = { sim: AWAY_SIM, ox: 0, oy: 0 };
      L.state = LSTATE.AWAY;
    }
    sim.enterDoor(door, st, live);
    if (bring) Object.assign(sim.L, bring);
    const fromDef = sim.rooms[from].def;
    const dropped = fromDef.secret && fromDef.back_check && door.code === TILE.EXIT;
    if (dropped) sim.checkpoint = fromDef.back_check;
    // come through in mid air, a death before the moth lands anywhere takes it back to where it was before (a drop
    // out of a secret room with somewhere set to come back to keeps that instead)
    G.backTo = sim.landCheck && !dropped ? { index: from, check: was } : null;
    switchRoom(to, lk.ox * T, lk.oy * T);
  }
  // shift everything drawn in room coordinates by the new room's offset, and settle into it
  function switchRoom(i, dx, dy) {
    G.lastRoom = G.roomIndex;
    G.roomIndex = i;
    G.room = G.sim.room;
    G.bake = baked(G.room);
    prepRoom(G.room);
    G.cam.x -= dx; G.cam.y -= dy;
    for (const q of G.particles) { q.x -= dx; q.y -= dy; }
    for (const q of G.ghosts) { q.x -= dx; q.y -= dy; }
    if (G.away) { G.away.ox -= dx; G.away.oy -= dy; }
    roomArrived(i, true);
  }
  // the lantern flies out through a doorway: it carries on in the room next door
  function lanternAway() {
    const sim = G.sim, d = sim.lanternDoor, lk = d.link;
    sim.lanternDoor = null;
    AWAY_SIM.taken = sim.taken;
    AWAY_SIM.setRoom(lk.to, G.roomStates[lk.to] || null, false);
    AWAY_SIM.t = sim.t; AWAY_SIM.events.length = 0;
    Object.assign(AWAY_SIM.L, sim.L);
    const gL = AWAY_SIM.L;
    gL.state = LSTATE.FLY; gL.x -= lk.ox * T; gL.y -= lk.oy * T; gL.skip = -1;
    G.away = { sim: AWAY_SIM, ox: lk.ox * T, oy: lk.oy * T };
  }
  function stepAway() {
    const a = G.away, gs = a.sim;
    gs.stepAway();
    handleEvents(gs, a.ox, a.oy);
    if (!gs.lanternDoor) return;
    // out through another doorway: back into the moth's room it flies on here; any further, it stops there
    const d = gs.lanternDoor, lk = d.link;
    gs.lanternDoor = null;
    if (lk.to === G.roomIndex) {
      const L = G.sim.L;
      Object.assign(L, gs.L);
      L.state = LSTATE.FLY; L.x -= lk.ox * T; L.y -= lk.oy * T; L.skip = -1;
      G.roomStates[gs.roomIndex] = viewState(gs);
      G.away = null;
    } else { gs.L.state = LSTATE.STUCK; gs.L.vx = 0; gs.L.vy = 0; gs.L.anchor = -1; gs.L.nx = 0; gs.L.ny = 0; }
  }
  // blink to the lantern next door: the moth goes over into that room and lands on it there
  function blinkAway() {
    const sim = G.sim, a = G.away, gs = a.sim, gL = gs.L;
    if (!(gL.state === LSTATE.FLY && gL.t >= 0.05) && gL.state !== LSTATE.STUCK) return;
    if (!sim.p.spark) { sim.emit('fizzle', sim.p.x, sim.p.y); return; }
    const from = G.roomIndex, to = gs.roomIndex, was = sim.checkpoint;
    const leaving = viewState(sim);
    G.roomStates[from] = leaving;
    sim.p.x -= a.ox; sim.p.y -= a.oy;
    sim.setRoom(to, gs.roomState(), true);
    Object.assign(sim.L, gL);
    G.away = null;
    sim.blink();
    sim.checkpoint = sim.nearestCheck(); sim.landCheck = true;
    G.backTo = { index: from, check: was };
    switchRoom(to, a.ox, a.oy);
  }
  // call the lantern back from next door: it flies home across the doorway
  function recallAway() {
    const sim = G.sim, a = G.away, gs = a.sim, L = sim.L;
    Object.assign(L, gs.L);
    L.x += a.ox; L.y += a.oy; L.state = LSTATE.RET;
    G.roomStates[gs.roomIndex] = viewState(gs);
    G.away = null;
    sim.emit('recall', L.x + 2, L.y + 2);
  }

  function startGame(fromSave) {
    const sv = fromSave ? loadSave() : null;
    // petals are kept only if they still exist (they used to float in the journey rooms)
    G.sim.taken = new Set((sv && sv.petals ? sv.petals : []).filter(id => PETAL_IDS.has(id)));
    G.seen = new Set(sv && sv.seen ? sv.seen : []);
    G.roomStates = {}; G.visited = new Set(); G.away = null; G.viewStates = {}; G.backTo = null; G.goBack = false;
    G.deaths = sv ? sv.deaths || 0 : 0;
    G.time = sv ? sv.time || 0 : 0;
    G.finished = false;
    G.finale = null;
    G.lastBiome = -1; G.lastChapter = 0; G.lastTheme = null;
    G.mode = 'play';
    G.trans = { phase: 'in', t: 0, dur: 0.6 };
    enterRoom(sv && sv.room >= 0 && sv.room < JOURNEY ? sv.room : 0, true);
  }

  // ------------------------------------------------------------------ particles
  function part(o) {
    if (G.particles.length > 700) G.particles.shift();
    o.life = o.life || 0.6; o.t = 0; o.vx = o.vx || 0; o.vy = o.vy || 0; o.g = o.g || 0; o.drag = o.drag || 0;
    G.particles.push(o);
    return o;
  }
  function burst(x, y, n, opt) {
    for (let i = 0; i < n; i++) {
      const a = (opt.angle !== undefined ? opt.angle : 0) + (Math.random() - 0.5) * (opt.spread !== undefined ? opt.spread : Math.PI * 2);
      const sp = (opt.speed || 40) * (0.4 + Math.random() * 0.8);
      part({ x: x + (Math.random() - 0.5) * (opt.jx || 0), y: y + (Math.random() - 0.5) * (opt.jy || 0), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: (opt.life || 0.6) * (0.6 + Math.random() * 0.7), c: opt.colors[Math.floor(Math.random() * opt.colors.length)], g: opt.g || 0, drag: opt.drag || 2, size: opt.size || 1, glow: opt.glow, kind: opt.kind });
    }
  }
  function updateParticles(dt) {
    const ps = G.particles;
    let j = 0;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      p.t += dt;
      if (p.t >= p.life) continue;
      p.vy += p.g * dt;
      const k = Math.max(0, 1 - p.drag * dt);
      p.vx *= k; p.vy *= k;
      if (p.kind === 'wind') p.vx = G.sim.wind * 3.2;
      if (p.kind === 'mote' && p.tx !== undefined) { p.vx += (p.tx - p.x) * 18 * dt; p.vy += (p.ty - p.y) * 18 * dt; }
      if (p.kind === 'spore') { p.vx += Math.sin(G.t * 1.3 + p.seed) * 6 * dt; p.vy += Math.cos(G.t * 1.1 + p.seed) * 6 * dt; }
      if (p.kind === 'firefly') { p.vx += Math.sin(G.t * 1.7 + p.seed * 3) * 14 * dt; p.vy += Math.cos(G.t * 1.3 + p.seed) * 10 * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'rain') {
        const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T), r = G.room;
        if (tx >= 0 && ty >= 0 && tx < r.w && ty < r.h) {
          const c = r.tiles[ty * r.w + tx];
          if (c === TILE.SOLID || c === TILE.GRATE || c === TILE.ONEWAY || c === TILE.VENT || c === TILE.FAKE) {
            if (Math.random() < 0.5) burst(p.x, ty * T - 1, 2, { colors: ['#9fb4e8', '#dfe8ff'], speed: 30, angle: -Math.PI / 2, spread: 1.6, g: 300, life: 0.25, drag: 1 });
            continue;
          }
        }
      }
      ps[j++] = p;
    }
    ps.length = j;
    for (let i = G.ghosts.length - 1; i >= 0; i--) { G.ghosts[i].t += dt; if (G.ghosts[i].t > 0.35) G.ghosts.splice(i, 1); }
  }
  function drawParticles(cx, cy, front) {
    for (const p of G.particles) {
      if (!!p.front !== front) continue;
      const a = 1 - p.t / p.life;
      const x = Math.round(p.x - cx), y = Math.round(p.y - cy);
      if (x < -4 || y < -4 || x > VW + 4 || y > VH + 4) continue;
      V.globalAlpha = p.fade === false ? 1 : Math.min(1, a * 1.6);
      V.fillStyle = p.c;
      if (p.kind === 'rain') { V.fillRect(x, y, 1, 3); V.fillRect(x - Math.sign(G.sim.wind), y + 3, 1, 2); }
      else if (p.kind === 'wind') { V.globalAlpha *= 0.35; V.fillRect(x, y, Math.max(3, Math.min(9, Math.abs(p.vx) / 18)), 1); }
      else if (p.kind === 'leaf') { V.fillRect(x, y, 2, 1); if ((Math.floor(p.t * 8) & 1)) V.fillRect(x + 1, y + 1, 1, 1); }
      else if (p.kind === 'firefly') {
        const on = Math.sin(p.t * 3 + p.seed * 5) * 0.5 + 0.5;
        V.globalAlpha = on * Math.min(1, a * 3);
        V.fillRect(x, y, 1, 1);
        if (on > 0.7) { V.globalAlpha *= 0.35; V.fillRect(x - 1, y, 3, 1); V.fillRect(x, y - 1, 1, 3); }
      }
      else { const s = p.size > 1 && a > 0.5 ? p.size : 1; V.fillRect(x, y, s, s); }
    }
    V.globalAlpha = 1;
  }

  // ------------------------------------------------------------------ events from the simulation
  function handleEvents(sim = G.sim, ox = 0, oy = 0) {
    const p = sim.p, room = sim.room, pal = palOf(room), n0 = G.particles.length;
    for (const e of sim.events) {
      switch (e.type) {
        case 'jump':
          G.anim.sx = 0.72; G.anim.sy = 1.3;
          burst(p.x + 3, p.y + 9, 5, { colors: pal.dust, speed: 26, angle: -Math.PI / 2, spread: 2.4, life: 0.35, drag: 5 });
          AU.play('jump'); break;
        case 'land': {
          const v = e.c || 0;
          if (v > 70) { G.anim.sx = 1 + Math.min(0.4, v / 400); G.anim.sy = 1 - Math.min(0.35, v / 480); }
          burst(p.x + 3, p.y + 9, Math.min(10, 2 + Math.floor(v / 25)), { colors: pal.dust, speed: 20 + v * 0.15, angle: -Math.PI / 2, spread: 3, life: 0.35, drag: 5 });
          if (v > 40) AU.play('land', v);
          break;
        }
        case 'throw': {
          const F = FL[e.e || 0];
          burst(e.a, e.b, 8, { colors: [F.spark[1], F.spark[2], F.spark[0]], speed: 50, life: 0.35, drag: 4 });
          G.anim.swingV += (e.c || 0) * 6;
          AU.play('throw', e.e || 0); break;
        }
        case 'blink': {
          const fx = e.a + 3, fy = e.b + 4, tx = e.c + 3, ty = e.d + 4, F = FL[e.e || 0];
          G.ghosts.push({ x: e.a, y: e.b, t: 0, facing: p.facing, frame: currentFrame() });
          const n = Math.min(26, 6 + Math.floor(Math.hypot(tx - fx, ty - fy) / 4));
          const cols = [F.spark[0], F.spark[1], '#ffb3d6', '#ffffff'];
          for (let i = 0; i < n; i++) {
            const k = i / n;
            part({ x: fx + (tx - fx) * k + (Math.random() - 0.5) * 4, y: fy + (ty - fy) * k + (Math.random() - 0.5) * 4, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20 - 10, life: 0.25 + k * 0.35, c: cols[i % 4], drag: 3 });
          }
          burst(tx, ty, 12, { colors: ['#ffffff', F.spark[1], '#ffc4dc'], speed: 70, life: 0.3, drag: 6 });
          G.anim.sx = 0.6; G.anim.sy = 1.45;
          G.flash = Math.max(G.flash, 0.12);
          addShake(1.5);
          AU.play('blink'); break;
        }
        case 'twin': {
          // the verdant lantern's second ember steps in: a green puff settling into amber
          const [hx, hy] = heldPos();
          burst(hx, hy + 4, 10, { colors: [FL[FLAME.VERDANT].spark[1], FL[FLAME.VERDANT].spark[2], FL[FLAME.AMBER].spark[1]], speed: 30, life: 0.45, drag: 3, g: -30 });
          AU.play('twin'); break;
        }
        case 'ricochet': {
          const F = FL[FLAME.ROSE];
          burst(e.a, e.b, 7, { colors: [F.spark[0], F.spark[1], F.spark[2]], speed: 55, angle: Math.atan2(e.d, e.c), spread: 2.4, life: 0.3, drag: 5 });
          AU.play('ricochet', e.e); break;
        }
        case 'stick': burst(e.a, e.b, 6, { colors: ['#fff0b0', '#ffd27a', '#a88a5a'], speed: 45, angle: Math.atan2(-e.d, -e.c) + Math.PI, spread: 2.2, life: 0.3, drag: 5 }); AU.play('stick'); break;
        case 'anchor': {
          const F = FL[sim.L.flame];
          burst(e.a, e.b, 8, { colors: [F.spark[0], F.spark[2]], speed: 40, life: 0.4 });
          if (!sim.L.charge) AU.play('anchor', sim.L.flame);
          break;
        }
        case 'kindle': {
          // the brazier's fire pours into the lantern that landed in it
          const hot = FL[e.d || 0].hot, b = room.braziers[e.a];
          for (let i = 0; i < 16; i++) {
            const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 6;
            part({ x: b.x + Math.cos(a) * r, y: b.y - 4 + Math.sin(a) * r * 0.7, vx: -Math.cos(a) * 34, vy: -Math.sin(a) * 26 - 10, life: 0.35, c: hot[i % 3 + 1], drag: 4 });
          }
          burst(b.x, b.y - 6, 10, { colors: [hot[0], hot[1], hot[2]], speed: 50, angle: -Math.PI / 2, spread: 2, life: 0.5, drag: 3, g: -30 });
          G.flash = Math.max(G.flash, 0.06); AU.play('brazier', e.d || 0); break;
        }
        case 'hang': {
          const b = room.braziers[e.a];
          burst(b.x, b.y + 2, 8, { colors: ['#fff0b0', '#ffd27a', '#ffc4dc'], speed: 30, angle: Math.PI / 2, spread: 2.4, life: 0.35, drag: 4 });
          AU.play('hang'); break;
        }
        case 'rekindle': burst(p.x + 3 + p.facing * 5, p.y + 4, 5, { colors: ['#ffe08a', '#ff9a3a', '#fff6d6'], speed: 22, angle: -Math.PI / 2, spread: 1.2, life: 0.4, drag: 3 }); AU.play('rekindle'); break;
        case 'brazier': {
          const hot = FL[e.d || 0].hot;
          burst(e.b, e.c - 2, 18, { colors: [hot[1], hot[2], hot[3]], speed: 70, angle: -Math.PI / 2, spread: 2.4, life: 0.6, drag: 3, g: -40 });
          G.flash = Math.max(G.flash, 0.08); AU.play('brazier', e.d || 0); break;
        }
        case 'relight': break;
        case 'bounce':
        case 'lbounce': {
          const b = room.bells[e.a];
          const col = room.biome === 1 ? ['#e8d4ff', '#b58cff', '#fff3a8'] : room.biome === 2 ? ['#dff0ff', '#9fc4ff', '#fff3a8'] : ['#ffe0f0', '#ff9fcf', '#fff3a8'];
          burst(b.x + b.tilt * 3, b.y - 2, e.type === 'bounce' ? 14 : 8, { colors: col, speed: 60, angle: -Math.PI / 2 + b.tilt * 0.52, spread: 2.6, life: 0.5, drag: 3 });
          if (e.type === 'bounce') { G.anim.sx = 0.7; G.anim.sy = 1.4; }
          AU.play(e.type, room.biome); break;
        }
        case 'lamp': {
          const w = room.lamps[e.a];
          burst(e.b, e.c - 3, 16, { colors: w.flame >= 0 ? FL[w.flame].hot.slice(0, 3) : ['#fff3b0', '#ffc24a', '#ffffff'], speed: 55, life: 0.6, drag: 3, g: -20 });
          AU.play('lamp'); break;
        }
        // a coloured wick refuses the wrong flame: a puff of its own colour
        case 'sputter': {
          const w = room.lamps[e.a];
          burst(e.b, e.c - 4, 7, { colors: FL[w.flame].coal.slice(0, 2).concat(['#5a5060']), speed: 28, life: 0.45, drag: 3, g: -30 });
          AU.play('fizzle'); break;
        }
        case 'gate':
          for (const gt of room.gateTiles) burst(gt.tx * T + 4, gt.ty * T + 4, 3, { colors: pal.dust, speed: 20, life: 0.8, drag: 2 });
          addShake(2); AU.play('gate'); break;
        case 'petal':
          burst(e.a, e.b, 22, { colors: ['#ffffff', '#d8fbff', '#9fe8ff', '#b0a0ff'], speed: 80, life: 0.7, drag: 3 });
          G.petalPop = 3; AU.play('petal'); break;
        case 'die':
          burst(e.a + 3, e.b + 4, 26, { colors: ['#ffffff', '#fff6e6', '#fb9cc4', '#e06ea4', '#ffe29a'], speed: 110, life: 0.8, drag: 3, g: 60, size: 2 });
          burst(e.a + 3, e.b + 4, 10, { colors: ['#ffcf6e', '#ff9a3a'], speed: 50, life: 0.5, drag: 3 });
          addShake(4); G.deaths++; G.flash = Math.max(G.flash, 0.1);
          AU.play('die'); break;
        case 'respawn':
          for (let i = 0; i < 18; i++) {
            const a = i / 18 * Math.PI * 2;
            part({ x: p.x + 3 + Math.cos(a) * 26, y: p.y + 4 + Math.sin(a) * 26, vx: -Math.cos(a) * 60, vy: -Math.sin(a) * 60, life: 0.4, c: i & 1 ? '#fff6d6' : '#ffc4dc', drag: 1 });
          }
          G.anim.sx = 0.6; G.anim.sy = 1.4; AU.play('respawn');
          if (sim === G.sim && G.backTo) G.goBack = true;
          break;
        case 'shake': { const c = room.crumbles[e.a]; burst(c.tx * T + 4, c.ty * T + 8, 3, { colors: pal.crumble, speed: 12, g: 200, life: 0.4 }); AU.play('shake'); break; }
        case 'crumble': { const c = room.crumbles[e.a]; burst(c.tx * T + 4, c.ty * T + 4, 12, { colors: pal.crumble.slice(0, 3), speed: 40, g: 300, life: 0.8, drag: 1, size: 2, jx: 6, jy: 6 }); AU.play('crumble'); break; }
        case 'reform': { const c = room.crumbles[e.a]; burst(c.tx * T + 4, c.ty * T + 4, 6, { colors: pal.dust, speed: 20, life: 0.4 }); AU.play('reform'); break; }
        case 'fizzle': burst(p.x + 3 + p.facing * 5, p.y + 3, 4, { colors: ['#8a8aa0', '#5a5a70'], speed: 12, angle: -Math.PI / 2, spread: 1, life: 0.5, g: -20 }); AU.play('fizzle'); break;
        case 'recall': AU.play('recall'); break;
        case 'catch': AU.play('catch'); break;
        case 'blinkfail': AU.play('fizzle'); break;
        case 'exit': break;
        case 'finale': break;

    sim.events.length = 0;
    // what happened next door happens where that room sits
    if (ox || oy) for (let k = n0; k < G.particles.length; k++) { G.particles[k].x += ox; G.particles[k].y += oy; }
  }
  function addShake(v) { if (!reduceMotion) G.shake = Math.max(G.shake, v); }

  // ------------------------------------------------------------------ camera
  function updateCamera(snap) {
    const p = G.sim.p, r = G.room, L = G.sim.L;
    let tx = p.x + 3 - VW / 2 + p.facing * 14, ty = p.y + 4 - VH / 2 - 8;
    if (L.state === LSTATE.FLY || L.state === LSTATE.STUCK) {
      // the view leans toward the lantern, but only so far: it may be left anywhere now
      tx += Math.max(-60, Math.min(60, (L.x + 2 - (p.x + 3)) * 0.25));
      ty += Math.max(-40, Math.min(40, (L.y + 2 - (p.y + 4)) * 0.25));
    }
    // with the lantern through a doorway, the view reaches into the room next door to show it
    let x0 = 0, y0 = 0, x1 = r.pw, y1 = r.ph;
    if (G.away) {
      const a = G.away, gr = a.sim.room, gl = a.sim.L;
      tx += Math.max(-150, Math.min(150, (gl.x + 2 + a.ox - (p.x + 3)) * 0.55));
      ty += Math.max(-80, Math.min(80, (gl.y + 2 + a.oy - (p.y + 4)) * 0.55));
      x0 = Math.min(0, a.ox); y0 = Math.min(0, a.oy); x1 = Math.max(r.pw, a.ox + gr.pw); y1 = Math.max(r.ph, a.oy + gr.ph);
    }
    if (G.talk && G.talk.npc && G.talk.npc.who !== 'sign') tx += (G.talk.npc.px - (p.x + 3)) * 0.5 - p.facing * 14;
    if (G.finale) { tx = r.great.x - VW / 2; ty = r.great.y - VH / 2 + 10; }
    const mx = x1 - x0 - VW, my = y1 - y0 - VH;
    tx = mx < 0 ? x0 + mx / 2 : Math.max(x0, Math.min(x0 + mx, tx));
    ty = my < 0 ? y0 + my / 2 : Math.max(y0, Math.min(y0 + my, ty));
    if (snap) { G.cam.x = tx; G.cam.y = ty; return; }
    G.cam.x += (tx - G.cam.x) * 0.1;
    G.cam.y += (ty - G.cam.y) * 0.1;
  }

  // ------------------------------------------------------------------ moth animation
  function currentFrame() {
    const p = G.sim.p, a = G.anim, set = p.facing > 0 ? S.moth : S.mothL;
    if (p.hang) return set.idle[Math.floor(a.idleT * 3.2) % 4];
    if (p.perch > 0) return set.perch[Math.floor(G.t * 4) % 2];
    if (!p.grounded) {
      if (p.gliding) return set.glide[Math.floor(a.glideT * 12) % 4];
      if (p.vy < -40) return set.rise[Math.floor(G.t * 10) % 2];
      return set.fall[Math.floor(G.t * 8) % 2];
    }
    if (a.sy < 0.85) return set.land;
    if (Math.abs(p.vx) > 8) return set.run[Math.floor(a.runDist / 5) % 6];
    if (a.blinkT < 0.12) return set.blink;

  }
  function updateAnim(dt) {
    const p = G.sim.p, a = G.anim;
    a.sx += (1 - a.sx) * Math.min(1, dt * 12);
    a.sy += (1 - a.sy) * Math.min(1, dt * 12);
    if (p.grounded) a.runDist += Math.abs(p.vx) * dt;
    a.glideT = p.gliding ? a.glideT + dt : 0;
    a.idleT += dt;
    a.blinkT -= dt;
    if (a.blinkT < -2.5 - Math.random() * 3) a.blinkT = 0.12;
    // lantern pendulum reacts to acceleration
    const ax = (p.vx - a.lastVx) / dt;
    a.lastVx = p.vx;
    a.swingV += (-a.swing * 60 - a.swingV * 5 - ax * 0.02) * dt;
    a.swing += a.swingV * dt;
    a.swing = Math.max(-1.2, Math.min(1.2, a.swing));

    if (p.gliding && Math.random() < 0.25) part({ x: p.x + 3 - p.facing * 3, y: p.y + 3, vx: -p.facing * 10, vy: 10, life: 0.5, c: Math.random() < 0.5 ? '#ffe6f0' : '#fb9cc4', drag: 2 });
  }

  // ------------------------------------------------------------------ drawing: world
  // the sky behind a room, placed by where the view is in the world: across, it scrolls with the world, so it runs
  // on unbroken through a doorway; up and down it hangs from `anchor` (a room's bottom, in the world: the current
  // room's eases there from the last one's) and never lifts off the bottom of the view
  function drawSky(r, cx, cy, anchor) {
    const w = WORLD[r.index];
    drawBackdrop(w.x + cx, 0, r.biome, VH + Math.max(0, anchor - VH - (w.y + cy)), r.look);
  }
  function drawBackdrop(cx, cy, biome, roomH, look, alpha) {
    const layers = backdrop(biome, look), fade = alpha === undefined ? 1 : alpha;
    for (const L of layers) {
      const ly = Math.round(L.y + ((roomH - VH) - cy) * L.fy);
      if (L.alpha || fade < 1) V.globalAlpha = (L.alpha || 1) * fade;
      if (!L.wrap) V.drawImage(L.c, 0, ly);
      else {
        const w = L.c.width;
        let lx = -Math.round(cx * L.fx + (L.drift ? G.t * L.drift : 0)) % w;
        if (lx > 0) lx -= w;
        V.drawImage(L.c, lx, ly); V.drawImage(L.c, lx + w, ly);
      }
      V.globalAlpha = 1;
      if (biome === 2 && L.fx === 0.07 && G.lightning > 0.55) drawBolt(cx);
      if (biome === 0 && L.fx === 0.1) (look === 'night' ? drawLostMoths : drawBirds)(cx, cy, roomH);
    }
  }
  // at night the moor's sky holds lost moths, circling lights too far away to see
  function drawLostMoths(cx, cy, roomH) {
    for (let i = 0; i < 7; i++) {
      const ox = ((i * 131 - cx * 0.14) % 420 + 420) % 420 - 50, oy = 60 + (i * 37) % 70 + ((roomH - VH) - cy) * 0.15;
      const a = G.t * (1.3 + (i % 3) * 0.4) + i;
      const x = Math.round(ox + Math.cos(a) * (5 + i % 4)), y = Math.round(oy + Math.sin(a * 1.3) * 3);
      V.fillStyle = i % 2 ? '#d8d0f4' : '#a89cd8';
      V.fillRect(x, y, 1, 1);
      if (Math.floor(G.t * 12 + i) & 1) { V.fillRect(x - 1, y - 1, 1, 1); V.fillRect(x + 1, y - 1, 1, 1); }
    }
  }
  function drawBirds(cx, cy, roomH) {
    V.fillStyle = '#3a1a3e';
    for (let i = 0; i < 6; i++) {
      const sp = 9 + i * 2.3;
      const x = Math.round(((i * 97 + G.t * sp - cx * 0.14) % 420 + 420) % 420 - 50);
      const y = Math.round(40 + i * 11 + Math.sin(G.t * 0.7 + i) * 4 + ((roomH - VH) - cy) * 0.15);
      const up = Math.floor(G.t * 5 + i) & 1;
      V.fillRect(x, y, 1, 1); V.fillRect(x - 1, y - up, 1, 1); V.fillRect(x + 1, y - up, 1, 1);
      if (!up) { V.fillRect(x - 2, y - 1, 1, 1); V.fillRect(x + 2, y - 1, 1, 1); }
    }
  }
  let bolt = null;
  function drawBolt() {
    if (!bolt) return;
    V.fillStyle = '#eef2ff';
    for (const [x, y] of bolt) V.fillRect(x, y, 1, 2);
  }
  function makeBolt() {
    const pts = [];
    let x = 40 + Math.random() * 240, y = 0;
    while (y < 120) { pts.push([Math.round(x), y]); y += 2; x += (Math.random() - 0.5) * 5; if (Math.random() < 0.05) { let bx = x, by = y; for (let k = 0; k < 14; k++) { pts.push([Math.round(bx), by]); by += 2; bx += (Math.random() - 0.2) * 3; } } }
    return pts;
  }

  function drawDecor(cx, cy, pal, bake = G.bake) {
    const t = G.t;
    for (const d of bake.decor) {
      const x = d.x - cx, y = d.y - cy;
      if (x < -20 || x > VW + 20 || y < -40 || y > VH + 40) continue;
      const sway = Math.sin(t * 1.7 + d.x * 0.13) * (1 + Math.max(0, Math.abs(G.sim.wind) / 40));
      switch (d.kind) {
        case 'reed': {
          const h = 5 + Math.floor(d.v * 7);
          V.fillStyle = pal.grass[2];
          for (let k = 0; k < h; k++) V.fillRect(Math.round(x + sway * k / h * 1.5), y - 1 - k, 1, 1);
          V.fillStyle = pal.grass[0];
          V.fillRect(Math.round(x + sway * 1.5) - (d.v > 0.5 ? 1 : 0), y - h - 1, d.v > 0.5 ? 3 : 1, 2);
          if (d.v > 0.8) { V.fillStyle = pal.flowers[1]; V.fillRect(Math.round(x + sway * 1.5), y - h - 2, 1, 1); }
          break;
        }
        case 'vine': {
          V.fillStyle = pal.grass[3];
          for (let k = 0; k < d.len; k++) {
            const ox = Math.round(Math.sin(t * 1.2 + d.x * 0.2 + k * 0.25) * k / d.len * 2);
            V.fillRect(x + ox, y + k, 1, 1);
            if (k % 4 === 2) { V.fillStyle = pal.grass[1]; V.fillRect(x + ox + (k & 4 ? 1 : -1), y + k, 1, 1); V.fillStyle = pal.grass[3]; }
          }
          if (d.v > 0.7) { V.fillStyle = pal.flowers[d.v > 0.85 ? 0 : 1]; V.fillRect(x + Math.round(Math.sin(t * 1.2 + d.x * 0.2 + d.len * 0.25) * 2), y + d.len, 1, 1); }
          break;
        }
        case 'shroom': {
          const g = pal.glow[Math.floor(d.v * 4) % 5], h = 2 + Math.floor(d.v * 3), w = 2 + Math.floor(d.v * 2);
          V.fillStyle = '#c8d8e0'; V.fillRect(x, y - h, 1, h);
          V.fillStyle = A.mix(g, '#000000', 0.35); V.fillRect(x - w, y - h - 1, w * 2 + 1, 1);
          V.fillStyle = g; V.fillRect(x - w + 1, y - h - 2, w * 2 - 1, 1);
          V.fillStyle = '#ffffff'; V.fillRect(x - 1, y - h - 2, 1, 1);
          break;
        }
        case 'root': {
          V.fillStyle = pal.stone[5];
          const len = Math.min(d.len, 14);
          for (let k = 0; k < len; k++) V.fillRect(x + Math.round(Math.sin(t * 0.8 + d.x + k * 0.3) * k / len), y + k, 1, 1);
          V.fillStyle = pal.glow[d.v > 0.5 ? 0 : 3];
          V.fillRect(x + Math.round(Math.sin(t * 0.8 + d.x + len * 0.3)), y + len, 1, 1);
          break;
        }
        case 'crystal': {
          const g = d.v > 0.5 ? pal.glow[0] : pal.glow[4];
          V.fillStyle = A.mix(g, '#000000', 0.4);
          const s = d.s;
          V.fillRect(x, y, s, 1); V.fillRect(x, y + 1, s * 2, 1); V.fillRect(x, y + 2, s, 1);
          V.fillStyle = g; V.fillRect(x + (s > 0 ? 1 : -1), y + 1, s > 0 ? 2 : -2, 1);
          V.fillStyle = '#ffffff'; V.fillRect(x + s * 2, y + 1, 1, 1);
          break;
        }
        case 'ivy': {
          V.fillStyle = pal.grass[3];
          for (let k = 0; k < 8; k += 2) V.fillRect(x + (k & 2 ? d.s : 0), y + k + 1, 1, 2);
          V.fillStyle = pal.grass[1];
          V.fillRect(x + d.s, y + 2, 1, 1); V.fillRect(x, y + 5, 1, 1);
          break;
        }
        case 'chain': {
          V.fillStyle = '#3a3f58';
          const len = Math.min(d.len, 10);
          for (let k = 0; k < len; k++) V.fillRect(x + Math.round(sway * k / len), y + k, 1, 1);
          V.fillStyle = pal.brass[1]; V.fillRect(x + Math.round(sway) - 1, y + len, 3, 2);
          break;
        }
        case 'post': break;
      }
    }
  }

  // false while drawing a second view of the world, or a frame the world hasn't moved on since the last one
  // (paused, or a screen refreshing faster than the game steps), so drawing spawns no particles
  let fxOn = true;
  // each gate carries a row of sockets, one for every lamp in the room, that light in the lamp's own colour as
  // it catches, so the gate shows how close it is to opening; they fade as the gate lifts
  // the rooms next door that show past this room's edges (while the view slides across a doorway, or reaches
  // after the lantern): the one the lantern is in, as it is now, and every room a doorway here leads to, as it
  // was left (a secret room only once it has been found). A secret room and the room beside it can lie in the same
  // place past an edge; then only one shows: the lantern's, else the one just left, else the journey's.
  function neighbourViews(cx, cy) {
    const out = [], rank = [];
    const add = (i, ox, oy, st, k) => {
      const r = G.sim.rooms[i];
      if (out.some(v => v.index === i) || !(ox < cx + VW && ox + r.pw > cx && oy < cy + VH && oy + r.ph > cy)) return;
      out.push({ index: i, ox, oy, st, w: r.pw, h: r.ph }); rank.push(k);
    };
    if (G.away) add(G.away.sim.roomIndex, G.away.ox, G.away.oy, G.away.sim, 0);
    for (const d of G.room.doors) {
      const lk = d.link;
      if (!lk) continue;
      const def = G.sim.rooms[lk.to].def;
      if (def.secret && !G.visited.has(lk.to)) continue;
      add(lk.to, lk.ox * T, lk.oy * T, G.roomStates[lk.to] || G.viewStates[lk.to] || (G.viewStates[lk.to] = freshView(lk.to)), lk.to === G.lastRoom ? 1 : def.secret ? 3 : 2);
    }
    const order = out.map((v, k) => k).sort((a, b) => rank[a] - rank[b]), keep = [];
    const area = (a, b) => Math.max(0, Math.min(a.ox + a.w, b.ox + b.w) - Math.max(a.ox, b.ox)) * Math.max(0, Math.min(a.oy + a.h, b.oy + b.h) - Math.max(a.oy, b.oy));
    for (const k of order) {
      const v = out[k], over = keep.filter(u => area(u, v) > 0);
      // where a sliver of one is under another, it's hidden under the one in front; more than that, only that shows
      if (over.some(u => area(u, v) > 0.2 * Math.min(u.w * u.h, v.w * v.h))) continue;
      v.excl = over; keep.push(v);
    }
    return keep;
  }
  // the stone around the rooms in view, drawn where no room is (and only there), under them all
  function drawMargins(views, cx, cy) {
    const rooms = [{ r: G.room, ox: 0, oy: 0 }].concat(views.map(v => ({ r: G.sim.rooms[v.index], ox: v.ox, oy: v.oy })));
    if (rooms.some(q => q.ox <= cx && q.oy <= cy && q.ox + q.r.pw >= cx + VW && q.oy + q.r.ph >= cy + VH)) return;
    V.save(); V.beginPath(); V.rect(0, 0, VW, VH);
    for (const q of rooms) V.rect(q.ox - cx, q.oy - cy, q.r.pw, q.r.ph);
    V.clip('evenodd');
    for (const q of rooms) {
      const m = marginOf(q.r), d = m.M * T;
      V.drawImage(m.fg, q.ox - cx - d, q.oy - cy - d);
      V.drawImage(m.front, q.ox - cx - d, q.oy - cy - d);
    }
    V.restore();
  }
  function freshView(i) { VIEW_SIM.taken = G.sim.taken; VIEW_SIM.setRoom(i, null, false); return viewState(VIEW_SIM); }
  function drawNeighbour(v, cx, cy) {
    const r = G.sim.rooms[v.index], b = baked(r), pal = palOf(r), SB = spritesOf(r), st = v.st;
    prepRoom(r);
    const vx = cx - v.ox, vy = cy - v.oy, fx = fxOn;
    fxOn = false;
    // under a room in front of it, a sliver of it doesn't show
    const clipped = v.excl && v.excl.length;
    if (clipped) {
      V.save(); V.beginPath(); V.rect(-vx, -vy, r.pw, r.ph);
      for (const u of v.excl) V.rect(u.ox - cx, u.oy - cy, u.w, u.h);
      V.clip('evenodd');
    }
    if (r.biome !== G.room.biome || r.look !== G.room.look) {
      // a room of another kind (the Spire's stair under the open summit) has its own sky behind it
      V.save(); V.beginPath(); V.rect(-vx, -vy, r.pw, r.ph); V.clip();
      V.fillStyle = pal.sky[0]; V.fillRect(-vx, -vy, r.pw, r.ph);
      drawSky(r, vx, vy, skyAnchor(r));
      V.restore();
    }
    V.drawImage(b.bg, -vx, -vy);
    drawDecor(vx, vy, pal, b);
    V.drawImage(b.fg, -vx, -vy);
    const fa = G.seen.has('found:' + r.name) ? 0.45 : 1;
    if (b.lining && fa < 1) { V.globalAlpha = 1 - fa; V.drawImage(b.lining, -vx, -vy); V.globalAlpha = 1; }
    drawProps(vx, vy, r);
    drawTiles(vx, vy, pal, SB, r, st);
    drawGatePips(vx, vy, r, st);
    drawObjects(vx, vy, pal, SB, r, st);
    if (b.fake) { V.globalAlpha = fa; V.drawImage(b.fake, -vx, -vy); V.globalAlpha = 1; }
    V.drawImage(b.front, -vx, -vy);
    if (clipped) V.restore();
    fxOn = fx;
  }

  function gatePips(r) {
    if (r.gatePips) return r.gatePips;
    const out = [];
    if (r.lamps.length && r.gateTiles.length) {
      const seen = new Set(), key = (x, y) => y * r.w + x, isG = (x, y) => r.gateTiles.some(g => g.tx === x && g.ty === y);
      const lamps = r.lamps.map((l, i) => ({ i, l })).sort((a, b) => a.l.tx - b.l.tx || a.l.ty - b.l.ty);
      for (const g of r.gateTiles) {
        if (seen.has(key(g.tx, g.ty))) continue;
        // one gate: the gate tiles joined to this one
        let x0 = g.tx, x1 = g.tx, y0 = g.ty, y1 = g.ty;
        const stack = [[g.tx, g.ty]];
        seen.add(key(g.tx, g.ty));
        while (stack.length) {
          const [x, y] = stack.pop();
          x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = x + dx, ny = y + dy;
            if (!seen.has(key(nx, ny)) && isG(nx, ny)) { seen.add(key(nx, ny)); stack.push([nx, ny]); }
          }
        }
        const tall = y1 - y0 >= x1 - x0, n = lamps.length;
        const len = ((tall ? y1 - y0 : x1 - x0) + 1) * T, step = Math.min(10, len / (n + 1));
        lamps.forEach(({ i, l }, k) => {
          const d = len / 2 + (k - (n - 1) / 2) * step;
          out.push({ lamp: i, flame: l.flame, x: tall ? (x0 + x1 + 1) * T / 2 : x0 * T + d, y: tall ? y0 * T + d : (y0 + y1 + 1) * T / 2 });
        });
      }
    }
    return (r.gatePips = out);
  }
  function drawGatePips(cx, cy, r = G.room, sim = G.sim) {
    const a = 1 - sim.gateT;
    if (a <= 0.02) return;
    V.globalAlpha = a;
    for (const g of gatePips(r)) {
      const x = Math.round(g.x - cx), y = Math.round(g.y - cy - sim.gateT * 8);
      if (x < -4 || x > VW + 4 || y < -4 || y > VH + 4) continue;
      V.fillStyle = '#120c18'; V.fillRect(x - 2, y - 2, 5, 5);
      if (sim.lit[g.lamp]) {
        const c = g.flame >= 0 ? FL[g.flame].light : '#ffc070';
        V.fillStyle = c; V.fillRect(x - 1, y - 1, 3, 3);
        V.fillStyle = '#fff6e0'; V.fillRect(x, y, 1, 1);
      } else { V.fillStyle = '#3a3044'; V.fillRect(x - 1, y - 1, 3, 3); }
    }
    V.globalAlpha = 1;
  }

  function drawTiles(cx, cy, pal, SB, r = G.room, sim = G.sim) {
    const x0 = Math.max(0, Math.floor(cx / T)), x1 = Math.min(r.w - 1, Math.floor((cx + VW) / T));
    const y0 = Math.max(0, Math.floor(cy / T)), y1 = Math.min(r.h - 1, Math.floor((cy + VH) / T));
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const i = ty * r.w + tx, c = r.tiles[i];
      const x = tx * T - cx, y = ty * T - cy;
      switch (c) {
        case TILE.GRATE: V.drawImage(SB.grate[r.grateMask[i]], x, y); break;
        case TILE.ONEWAY: V.drawImage(SB.plank, x, y); break;
        case TILE.THORN: V.drawImage(SB.thorn[r.thornDir[i]][(tx * 7 + ty * 3) % 3], x, y); break;
        case TILE.CRUMBLE: {
          const k = r.crumbleIdx[i], st = sim.cs[k];
          if (st === 2) {
            if (sim.ct[k] < 0.25) { V.globalAlpha = 0.35; V.drawImage(SB.crumble[(tx + ty) % 3], x, y); V.globalAlpha = 1; }
            break;
          }
          const j = st === 1 ? Math.round((Math.random() - 0.5) * 2) : 0;
          V.drawImage(SB.crumble[(tx + ty) % 3], x + j, y);
          break;
        }
        case TILE.GATE: {
          const off = Math.round(sim.gateT * 8);
          if (off >= 8) break;
          V.drawImage(SB.gate, 0, off, 8, 8 - off, x, y, 8, 8 - off);
          break;
        }
        case TILE.VENT: {
          V.drawImage(SB.vent, x, y);
          if (fxOn && Math.random() < 0.3) part({ x: tx * T + 1 + Math.random() * 6, y: ty * T, vx: (Math.random() - 0.5) * 6, vy: -60 - Math.random() * 50, life: 0.9 + Math.random() * 0.8, c: Math.random() < 0.5 ? pal.dust[0] : pal.dust[1], drag: 0.2 });
          break;
        }
      }
    }
  }

  function drawObjects(cx, cy, pal, SB, r = G.room, sim = G.sim) {
    const t = G.t;
    // braziers with chains
    r.braziers.forEach((b, i) => {
      const x = b.x - cx, y = b.y - cy;
      if (x < -20 || x > VW + 20 || y < -120 || y > VH + 20) return;
      const len = r.chains[i];
      V.fillStyle = '#2a2330';
      for (let k = 0; k < len * T; k += 2) V.fillRect(Math.round(x - 4 + Math.sin(t + i) * 0), Math.round(y - 5 - k), 1, 1), V.fillRect(Math.round(x + 3), Math.round(y - 5 - k), 1, 1);
      V.fillStyle = '#4c4050';
      for (let k = 1; k < len * T; k += 2) V.fillRect(Math.round(x - 4), Math.round(y - 5 - k), 1, 1), V.fillRect(Math.round(x + 3), Math.round(y - 5 - k), 1, 1);
      const lit = sim.bcd[i] <= 0, hot = FL[b.flame].hot;

  const lampHead = pr => [pr.x * T + 4, (pr.y + 1) * T - (pr.h || 30) + 4];
  function lampPosts() {
    const r = G.room, sim = G.sim, p = sim.p, L = sim.L, props = r.def.props || [];
    if (p.dead) return;
    let lx, ly;
    if (L.state === LSTATE.AWAY) return;
    if (L.state !== LSTATE.HELD) { lx = L.x + 2; ly = L.y + 2; }
    else if (p.spark) { const h = heldPos(); lx = h[0]; ly = h[1] + 4; }
    else return;
    props.forEach((pr, i) => {
      if (pr.k !== 'lamp' || propLit(r, pr, i)) return;
      const [hx, hy] = lampHead(pr);
      if (Math.abs(lx - hx) > 7 || Math.abs(ly - hy) > 8) return;
      G.seen.add(lampKey(r, i));
      burst(hx, hy - 2, 16, { colors: ['#fff3b0', '#ffc24a', '#ffffff'], speed: 55, life: 0.6, drag: 3, g: -20 });
      AU.play('lamp');
    });
  }

  function weather(dt) {
    const r = G.room, cx = G.cam.x, cy = G.cam.y, pal = palOf(r);
    const wind = G.sim.wind;
    if (r.biome === 0 && r.look === 'night') {
      // fireflies drifting over the grass, and a few pale motes
      if (Math.random() < 0.06) part({ x: cx + Math.random() * VW, y: cy + VH * (0.35 + Math.random() * 0.6), vx: 0, vy: 0, life: 3 + Math.random() * 3, c: Math.random() < 0.7 ? '#e8ff8a' : '#b8ff9a', kind: 'firefly', seed: Math.random() * 10, drag: 0.5 });
      if (Math.random() < 0.12) part({ x: cx + Math.random() * VW, y: cy + VH + 4, vx: 3 + Math.random() * 5, vy: -6 - Math.random() * 8, life: 6, c: pal.dust[Math.random() < 0.6 ? 0 : 3], drag: 0 });
    } else if (r.biome === 0) {
      if (Math.random() < 0.35) part({ x: cx + Math.random() * VW, y: cy + VH + 4, vx: 6 + Math.random() * 8, vy: -8 - Math.random() * 10, life: 5, c: Math.random() < 0.6 ? pal.dust[0] : pal.dust[1], drag: 0 });
      if (Math.random() < 0.04) part({ x: cx - 4, y: cy + Math.random() * VH * 0.7, vx: 20 + Math.random() * 20, vy: 6, life: 8, c: Math.random() < 0.5 ? '#c65a6a' : '#e8a04a', kind: 'leaf', drag: 0 });
    } else if (r.biome === 1) {
      if (Math.random() < 0.3) part({ x: cx + Math.random() * VW, y: cy + Math.random() * VH, vx: 0, vy: -3, life: 4, c: pal.glow[Math.floor(Math.random() * 5)], kind: 'spore', seed: Math.random() * 10, drag: 0.5 });
      if (Math.random() < 0.08) {
        const roots = G.bake.decor.filter(d => d.kind === 'root');
        if (roots.length) { const d = roots[Math.floor(Math.random() * roots.length)]; part({ x: d.x, y: d.y + Math.min(d.len, 14), vy: 0, g: 400, life: 1.2, c: '#8ffcf0', drag: 0 }); }
      }
    } else if (r.look === 'summit' || r.look === 'dawn') {
      // above the storm the air is still: frost motes drift up past the moon
      if (Math.random() < 0.18) part({ x: cx + Math.random() * VW, y: cy + VH + 4, vx: wind * 0.3 + (Math.random() - 0.5) * 4, vy: -6 - Math.random() * 6, life: 7, c: pal.dust[Math.floor(Math.random() * 4)], drag: 0 });
    } else {
      const n = G.finale && G.finale.lit ? 0 : 4;
      for (let i = 0; i < n; i++) part({ x: cx + Math.random() * (VW + 60) - 30 - wind * 0.4, y: cy - 6, vx: wind * 1.6 + 10, vy: 260 + Math.random() * 60, life: 1.2, c: Math.random() < 0.5 ? '#8fa2d8' : '#6a7ab8', kind: 'rain', drag: 0, fade: false, front: true });
    }
    if (Math.abs(wind) > 25 && Math.random() < Math.abs(wind) / 250) part({ x: wind > 0 ? cx - 10 : cx + VW + 10, y: cy + Math.random() * VH, vx: wind * 3, vy: 0, life: 1.6, c: '#dfe6ff', kind: 'wind', drag: 0, front: true });
    // lightning
    if (r.biome === 2 && r.look !== 'summit' && r.look !== 'dawn' && !(G.finale && G.finale.lit)) {
      G.nextLightning -= dt;
      if (G.nextLightning <= 0) {
        G.nextLightning = 7 + Math.random() * 9;
        G.lightning = reduceMotion ? 0.35 : 1;
        bolt = makeBolt();
        AU.play('thunder', 0.4 + Math.random() * 0.8);
      }
    }
    if (G.lightning > 0) G.lightning = Math.max(0, G.lightning - dt * 2.2);
    // continuous sounds
    if (audioStarted) {
      AU.setLoop('glide', G.sim.p.gliding ? 0.05 : 0, { type: 'bandpass', f: 900, q: 0.6, fmod: 700 + Math.sin(G.t * 50) * 300 });
      // the wind is a low rush rather than a hiss; it and the rain drop back while someone talks, so voices carry
      const hush = G.talk ? 0.3 : 1;
      AU.setLoop('wind', hush * (Math.min(0.08, Math.abs(wind) / 1400) + (r.biome === 2 ? 0.012 : 0)), { type: 'bandpass', f: 320, q: 0.6, fmod: 220 + Math.abs(wind) * 1.8 });
      AU.setLoop('rain', hush * (r.biome === 2 && r.look !== 'summit' && r.look !== 'dawn' && !(G.finale && G.finale.lit) ? 0.035 : 0), { type: 'highpass', f: 2500, q: 0.3 });
    }
  }

  // ------------------------------------------------------------------ HUD
  function drawHUD(pal) {
    if (G.card) {
      const t = G.card.t;
      if (G.card.big) {
        const a = t < 0.5 ? t / 0.5 : t > 2.6 ? Math.max(0, 1 - (t - 2.6) / 0.6) : 1;
        if (a > 0) {
          const pre = !!G.card.pre, y0 = pre ? 54 : 62;
          V.globalAlpha = a * 0.55; V.fillStyle = '#05030a'; V.fillRect(0, y0, VW, pre ? 56 : 44); V.globalAlpha = a;
          if (pre) A.drawText(V, G.card.pre, VW / 2, 61, pal.hint, { align: 'center', shadow: '#1a0d22' });
          A.drawText(V, G.card.big, VW / 2, pre ? 73 : 70, '#ffffff', { align: 'center', scale: 2, shadow: '#1a0d22' });
          V.fillStyle = pal.hint; V.fillRect(VW / 2 - 40, pre ? 92 : 89, 80, 1);
          A.drawText(V, G.card.small, VW / 2, pre ? 97 : 94, pal.hint, { align: 'center', shadow: '#1a0d22' });
          V.globalAlpha = 1;
        }
      } else {
        const a = t < 0.4 ? t / 0.4 : t > 2.2 ? Math.max(0, 1 - (t - 2.2) / 0.5) : 1;
        if (a > 0) { V.globalAlpha = a; A.drawText(V, G.card.small, 8, VH - 14, pal.hint, { shadow: '#1a0d22' }); V.globalAlpha = 1; }
      }
    }
    if (G.petalPop > 0) {
      const a = Math.min(1, G.petalPop);
      V.globalAlpha = a;
      V.drawImage(S.petal[0], 7, 6);
      A.drawText(V, G.sim.taken.size + '/' + TOTAL_PETALS, 19, 7, '#e6fbff', { shadow: '#101030' });
      V.globalAlpha = 1;
    }
  }

  // ------------------------------------------------------------------ transitions
  function drawIris(k, x, y) {
    // k: 0 = fully closed, 1 = fully open
    if (k >= 1) return;
    const R = Math.hypot(VW, VH) * k;
    D.globalCompositeOperation = 'source-over';
    D.clearRect(0, 0, VW, VH);
    D.fillStyle = '#07040c';
    D.fillRect(0, 0, VW, VH);
    D.globalCompositeOperation = 'destination-out';
    if (R > 1) {
      D.beginPath(); D.arc(Math.round(x), Math.round(y), R, 0, Math.PI * 2); D.fill();
    }
    D.globalCompositeOperation = 'source-over';
    V.drawImage(dark.c, 0, 0);
    if (R > 1 && R < 120) {
      V.strokeStyle = 'rgba(255,214,150,0.5)'; V.lineWidth = 1;
      V.beginPath(); V.arc(Math.round(x), Math.round(y), R, 0, Math.PI * 2); V.stroke();
    }
  }

  // ------------------------------------------------------------------ people, props and talk
  // Rooms place people (npcs: a first-meeting scene that plays by itself, then chat on S), things to read
  // (who 'sign': S reads them) and scenery props. Scenes and voices live in story.js.
  const STORY = window.WWStory || { CHARS: {}, SCENES: {} };
  const TALK_ROWS = 3, NEAR_X = 20, NEAR_Y = 16, MEET_X = 44;
  const IDLE_INPUT = { x: 0, y: 0, jump: false, jumpP: false, lantP: false, recallP: false };

  function setupPeople(r) {
    G.npcs = (r.def.npcs || []).map(n => Object.assign({}, n, { px: n.x * T + 4, py: (n.y + 1) * T, dir: n.face || -1, talks: 0, t: n.x * 1.7, ox: 0, oy: 0 }));
    G.talk = null; G.talkCool = 0;
  }

  // break a scene into pages that fit the box: [{ who, mood, label, rows, len }]
  function paginate(lines) {
    const pages = [];
    let acts = [];
    for (const [who, text, extra] of lines) {
      // a 'do' line is an action taken when the next page opens (or when the scene ends)
      if (who === 'do') { acts.push(text); continue; }
      const ch = STORY.CHARS[who] || {}, sign = who === 'sign' || !!ch.nobox;
      const maxw = sign ? 288 : 250, rows = [];
      let line = '';
      for (const w of text.split(' ')) {
        const t = line ? line + ' ' + w : w;
        if (line && A.textWidth(t, 1, true) > maxw) { rows.push(line); line = w; } else line = t;
      }
      if (line) rows.push(line);
      for (let i = 0; i < rows.length; i += TALK_ROWS) {
        const rs = rows.slice(i, i + TALK_ROWS);
        pages.push({ who, mood: sign ? '' : extra || '', label: who === 'sign' ? extra || '' : ch.name || '', rows: rs, len: rs.reduce((n, s) => n + s.length, 0), acts });
        acts = [];
      }
    }
    pages.endActs = acts;
    return pages;
  }
  function doActs(acts) {
    for (const a of acts || []) {
      const m = /^flame:(\d)$/.exec(a);
      if (m) {
        // a flame passes into the lantern
        const f = +m[1], [hx, hy] = heldPos(), hot = FL[f].hot;
        G.sim.relight(f);
        burst(hx, hy + 4, 18, { colors: [hot[0], hot[1], hot[2]], speed: 45, life: 0.6, drag: 3, g: -20 });
        G.flash = Math.max(G.flash, 0.1); AU.play('brazier', f);
      }
    }
  }

  function startTalk(id, npc) {
    const lines = STORY.SCENES[id];
    if (!lines || !lines.length) return false;
    // the box goes to whichever edge of the screen hides fewer of the speakers, the moth mattering most
    const my = G.sim.p.y + 4 - G.cam.y, ny = npc && npc.who !== 'sign' ? npc.py + npc.oy - 12 - G.cam.y : null;
    const hides = (y, top) => y !== null && (top ? y < 62 : y > VH - 62);
    const cost = top => (hides(my, top) ? 2 : 0) + (hides(ny, top) ? 1 : 0);
    const top = cost(true) === cost(false) ? my > VH * 0.5 : cost(true) < cost(false);
    G.talk = { id, pages: paginate(lines), i: 0, shown: 0, wait: 0.15, t: 0, blips: 0, npc: npc || null, top };
    doActs(G.talk.pages[0] && G.talk.pages[0].acts);
    if (G.card && G.card.t < 2.6) G.card.t = 2.6;
    G.seen.add(id);
    // the moth stops to listen, rather than running on the spot through the conversation
    const p = G.sim.p;
    p.vx = 0; p.gliding = false;
    if (npc && npc.who !== 'sign') p.facing = npc.px > p.x + 3 ? 1 : -1;
    AU.play(lines[0][0] === 'sign' ? 'paper' : 'talkopen');
    return true;
  }
  function endTalk() { const tk = G.talk; G.talk = null; G.talkCool = 0.3; if (tk) doActs(tk.pages.endActs); writeSave(); }

  function updateTalk(dt) {
    const tk = G.talk, pg = tk.pages[tk.i], ch = STORY.CHARS[pg.who] || {};
    const go = pressed.jump || pressed.lant || pressed.select || pressed.confirm || pressed.down;
    tk.t += dt;
    if (tk.shown < pg.len) {
      if (go) { tk.shown = pg.len; return; }
      tk.wait -= dt;
      const text = pg.rows.join('');
      while (tk.wait <= 0 && tk.shown < pg.len) {
        const c = text[tk.shown++];
        // letters type steadily, stops and pauses give the line room to breathe
        tk.wait += (c === '.' || c === '!' || c === '?' ? 0.22 : c === ',' || c === '—' ? 0.1 : 0.024) * (ch.pace || 1);
        if (ch.voice && /[A-Za-z]/.test(c) && tk.blips++ % 2 === 0) AU.play('voice', ch.voice);
      }
    } else if (go) {
      tk.i++; tk.shown = 0; tk.wait = 0.08;
      if (tk.i >= tk.pages.length) endTalk(); else { AU.play('talknext'); doActs(tk.pages[tk.i].acts); }
    }
  }

  function nearPerson() {
    const p = G.sim.p, mx = p.x + 3, my = p.y + P.H;
    let best = null, bd = 1e9;
    for (const n of G.npcs) {
      if (n.who === 'choir' && !n.lit) continue;
      const dx = Math.abs(n.px + n.ox - mx), dy = Math.abs(n.py - my);
      if (dx < (n.r || NEAR_X) && dy < (n.ny || NEAR_Y) && dx < bd) { best = n; bd = dx; }
    }
    return best;
  }

  // first meetings and room scenes play by themselves; S beside someone talks to them or reads the thing
  function checkTalk() {
    const p = G.sim.p;
    if (G.talkCool > 0 || p.dead || G.finale || G.trans || !p.grounded) return;
    const cardUp = G.card && G.card.big && G.card.t < 3.2;
    const mx = p.x + 3, my = p.y + P.H;
    for (const n of G.npcs) {
      if (n.who === 'choir' && !n.lit) continue;
      // a first meeting can wait on another scene (n.after), so nobody talks about something you haven't seen yet
      if (!cardUp && n.scene && !G.seen.has(n.scene) && (!n.after || G.seen.has(n.after)) && Math.abs(n.px - mx) < (n.meet || MEET_X) && Math.abs(n.py - my) < (n.ny || 24)) { startTalk(n.scene, n); return; }
    }
    for (const tr of G.room.def.talks || []) {
      if (!cardUp && !G.seen.has(tr.scene) && mx >= tr.x0 * T && mx < (tr.x1 + 1) * T && my > tr.y0 * T && my <= (tr.y1 + 1) * T) { startTalk(tr.scene); return; }
    }
    const n = nearPerson();
    if (n && pressed.down) {
      const chat = n.chat || [];
      const id = n.read || (chat.length ? chat[Math.min(n.talks, chat.length - 1)] : n.scene);
      if (id) { n.talks++; startTalk(id, n); }
    }
  }

  function updatePeople(dt) {
    const p = G.sim.p, L = G.sim.L;
    for (const n of G.npcs) {
      n.t += dt;
      // fireflies who forgot how to glow remember when a lit lantern comes close
      if (n.who === 'choir' && !n.lit && p.spark && !p.dead && Math.hypot(L.x + 2 - n.px, L.y + 2 - (n.py - 6)) < 30) {
        n.lit = true; n.litT = 0; AU.play('choir');
      }
      if (n.lit) n.litT += dt;
      // someone circling a light never stops circling it, except to hover and talk
      if (n.orbit) {
        if (n.os === undefined) { n.os = 1; n.oa = n.t; }
        n.os += ((G.talk ? 0 : 1) - n.os) * Math.min(1, dt * 4);
        n.oa += dt * n.os;
        const a = n.oa * (n.orbit.s || 2.2);
        const ox = Math.cos(a) * n.orbit.rx * T, oy = Math.sin(a * 2) * (n.orbit.ry || 0.6) * T;
        n.dir = -Math.sin(a) >= 0 ? 1 : -1;
        n.ox = ox; n.oy = oy;
      } else if (n.who !== 'sign') {
        const dx = p.x + 3 - n.px;
        n.dir = Math.abs(dx) < 70 ? (dx < 0 ? -1 : 1) : (n.face || -1);
      }
    }
    if (G.talkCool > 0) G.talkCool -= dt;
    const tt = document.getElementById('ttalk');
    if (tt) {
      const show = !touchUI.hidden && !G.talk && !!nearPerson();
      if (tt.hidden === show) tt.hidden = !show;
    }
  }

  function personImg(n) {
    const set = S.people[n.who];
    if (!set) return null;
    const side = n.dir > 0 ? set.r : set.l;
    if (n.who === 'pell') return side[Math.floor(n.t * 1.5) % 2];
    if (n.who === 'loom') return side[Math.floor(n.t * 1.2) % 2];
    if (n.who === 'warden') return side[Math.sin(n.t * 0.8) > 0.6 ? 1 : 0];
    if (n.orbit) return side.glide[Math.floor(n.t * 12) % 4];
    const talking = G.talk && G.talk.npc === n && G.talk.shown < G.talk.pages[G.talk.i].len && G.talk.pages[G.talk.i].who === n.who;
    return talking ? side.idle[Math.floor(n.t * 8) % 4] : Math.sin(n.t * 0.9) > 0.97 ? side.blink : side.idle[Math.floor(n.t * 3.2) % 4];
  }

  function drawPeople(cx, cy) {
    for (const n of G.npcs) {
      if (n.who === 'sign') continue;
      if (n.who === 'choir') { drawChoir(n, cx, cy); continue; }
      const img = personImg(n);
      if (!img) continue;
      // someone hanging on a thread bobs gently under the ceiling it hangs from
      const bob = n.hang ? Math.round(Math.sin(n.t * 1.1) * 2) : 0;
      const x = Math.round(n.px + n.ox - img.width / 2 - cx), y = Math.round(n.py + n.oy - img.height - cy) + bob;
      if (x < -30 || x > VW + 30 || y < -60 || y > VH + 30) continue;
      if (n.hang) {
        if (n.top === undefined) { let ty = n.y; const r = G.room; while (ty > 0 && r.tiles[(ty - 1) * r.w + n.x] !== TILE.SOLID) ty--; n.top = ty * T; }
        V.fillStyle = '#c8dce4'; V.globalAlpha = 0.6;
        V.fillRect(Math.round(n.px - cx), Math.round(n.top - cy), 1, y + 4 - Math.round(n.top - cy));
        V.globalAlpha = 1;
      }
      V.drawImage(img, x, y);
    }
  }
  // the firefly choir: dim specks on a root until a light reminds them, then a slow bright swarm
  function drawChoir(n, cx, cy) {
    for (let i = 0; i < 9; i++) {
      const a = n.t * (0.6 + (i % 3) * 0.25) + i * 2.1;
      const lit = n.lit && n.litT > i * 0.12;
      const r = lit ? 9 + (i % 4) * 2 : 5 + (i % 3);
      const x = Math.round(n.px + Math.cos(a) * r - cx), y = Math.round(n.py - 8 + Math.sin(a * 1.3) * r * 0.5 - cy);
      V.fillStyle = lit ? (i % 2 ? '#f4ff9a' : '#c8ff8a') : '#3a4048';
      V.fillRect(x, y, 1, 1);
      if (lit && Math.sin(n.t * 4 + i) > 0.3) { V.globalAlpha = 0.4; V.fillRect(x - 1, y, 3, 1); V.fillRect(x, y - 1, 1, 3); V.globalAlpha = 1; }
    }
  }

  // a little bubble over whoever S would talk to
  // how high the thing someone would talk to (or read) reaches above its footing, from what is actually drawn: the
  // prop standing where a sign is, a person's current sprite, the choir's swarm
  function personTop(n) {
    if (n.who === 'choir') return n.py - 24;
    if (n.who === 'sign') {
      // a small thing to read (a signpost, a lectern, chalk marks) is cleared whole; a note on something big, like
      // the lodge's door, sits at the sign's own height
      const pr = (G.room.def.props || []).find(q => q.k !== 'pennant' && q.x === n.x && q.y === n.y);
      const im = pr && propImg(pr, G.room.biome, !!pr.lit);
      if (im && -im.oy <= 28) return (pr.y + 1) * T + im.oy;
      return n.py - (n.h || 20);
    }
    const img = personImg(n);
    return n.py + n.oy - (img ? img.height : 24) + (n.hang ? Math.round(Math.sin(n.t * 1.1) * 2) : 0);
  }
  // the prompt to talk or read: a key cap and a word in a small dark pill, just clear of the top of the thing,
  // fading in rather than popping up
  function drawTalkPrompt(cx, cy, dt) {
    const n = !G.talk && !G.trans && G.sim.p.grounded ? nearPerson() : null;
    if (n) { if (G.prompt.n !== n) { G.prompt.n = n; G.prompt.a = 0; } G.prompt.a = Math.min(1, G.prompt.a + dt * 6); }
    else G.prompt.a = Math.max(0, G.prompt.a - dt * 8);
    const m = G.prompt.n;
    if (!m || G.prompt.a <= 0 || G.talk) return;
    const verb = m.who === 'sign' ? 'READ' : m.who === 'choir' ? 'LISTEN' : 'TALK';
    const key = lastDevice === 'touch' ? '' : keyName('DOWN');
    const kw = key ? A.textWidth(key) + 6 : 0, vw = A.textWidth(verb);
    const w = (key ? kw + 4 : 0) + vw + 8, h = 13;
    const ox = m.px + m.ox - cx, top = personTop(m) - cy;
    let x = Math.round(ox - w / 2), y = Math.round(top - h - 3 + (1 - G.prompt.a) * 3);
    // no room above (it would leave the screen): stand it beside the thing instead
    if (y < 2) { x = Math.round(ox + 10); y = Math.round(top + 2); }
    x = Math.max(2, Math.min(VW - w - 2, x));
    V.globalAlpha = G.prompt.a;
    V.fillStyle = 'rgba(16, 9, 26, 0.78)';
    V.fillRect(x + 1, y, w - 2, h); V.fillRect(x, y + 1, w, h - 2);
    let tx = x + 4;
    if (key) {
      // the key: a pale cap with a darker lip
      V.fillStyle = '#b9a8c9'; V.fillRect(tx, y + 2, kw, 9);
      V.fillStyle = '#f2eaf8'; V.fillRect(tx, y + 2, kw, 8);
      A.drawText(V, key, tx + kw / 2, y + 3, '#2a1233', { align: 'center' });
      tx += kw + 4;
    }
    A.drawText(V, verb, tx, y + 3, '#f2eaf8');
    V.globalAlpha = 1;
  }

  function propImg(pr, biome, lit) {
    const key = pr.k + ':' + biome + ':' + (G.room.look || '') + ':' + (lit ? 1 : 0) + ':' + (pr.h || 0);
    let s = S.props.get(key);
    if (!s) { s = A.paintProp(pr.k, A.palette(biome, G.room.look), { lit, h: pr.h }); S.props.set(key, s); }
    return s;
  }
  function lampPostHeight(r, l) {
    if (l.postH) return l.postH;
    let ty = l.ty + 1;
    while (ty < r.h && r.tiles[ty * r.w + l.tx] !== TILE.SOLID) ty++;
    l.postH = ty * T - l.y + 4;
    return l.postH;
  }
  // a pennant on a pole, streaming downwind: limp in a lull, snapping flat in a gust
  function drawPennant(pr, cx, cy) {
    const h = pr.h || 28, bx = Math.round(pr.x * T + 4 - cx), by = Math.round((pr.y + 1) * T - cy);
    if (bx < -30 || bx > VW + 30 || by < -h - 10 || by - h > VH) return;
    V.fillStyle = '#2a2c3c'; V.fillRect(bx, by - h, 1, h); V.fillStyle = '#5a5e7a'; V.fillRect(bx - 1, by - h, 3, 1);
    const w = G.sim.wind, k = Math.min(1, Math.abs(w) / 110), dir = w < 0 ? -1 : 1;

  function drawProps(cx, cy, r = G.room) {
    (r.def.props || []).forEach((pr, i) => {

      const s = propImg(pr, r.biome, propLit(r, pr, i));
      if (!s) return;
      const x = Math.round(pr.x * T + 4 + s.ox - cx), y = Math.round((pr.y + 1) * T + s.oy - cy);

  }

  function portraitImg(who, mood, frame, flip) {
    const key = who + ':' + mood + ':' + frame + ':' + (flip ? 1 : 0);

  function drawTalk() {
    const tk = G.talk;

  // ------------------------------------------------------------------ play loop
  function readInput() {

    const aim = lastDevice === 'pad' ? padAim : lastDevice === 'touch' ? touchAim : mouseAt ? mouseAim() : null;
    if (aim) { inp.ax = aim[0]; inp.ay = aim[1]; }
    return inp;
  }
  function mouseAim() {
    const p = G.sim.p;
    const dx = mouseAt[0] + G.cam.x - (p.x + 3), dy = mouseAt[1] + G.cam.y - (p.y + 4), d = Math.hypot(dx, dy);
    return d > 1 ? [dx / d, dy / d] : null;

  function updatePlay(dt, forced) {

        if (G.trans.next === 'ending') { G.mode = 'ending'; G.endKind = G.finished ? 'end' : 'cont'; G.endT = 0; G.trans = null; if (audioStarted) AU.setMusic(G.finished ? 'dawn' : 'finale', true); return; }

        G.trans = { phase: 'in', t: 0, dur: 0.5 };

    }
    if ((pressed.pause || (pressed.confirm && !G.talk)) && !G.finale) { openPause(); return; }
    if (pressed.mute) { AU.setMusicOn(!AU.musicOn); writeSave(); }
    const freeze = G.trans && G.trans.phase === 'out';
    if (!freeze) {

        updateTalk(dt);

      if (G.away) stepAway();

  // ------------------------------------------------------------------ finale
  function startFinale() {

    G.finale.lx = p.x + 3; G.finale.ly = p.y + 2;
  }
  function updateFinale(dt) {

    if (f.phase === 1) {
      const k = Math.min(1, f.t / 1.1);
      const e = k * k * (3 - 2 * k);
      f.x = f.lx + (gx - f.lx) * e; f.y = f.ly + (gy - f.ly) * e - Math.sin(k * Math.PI) * 30;
      if (Math.random() < 0.9) part({ x: f.x, y: f.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 0.5, c: Math.random() < 0.5 ? '#ffd27a' : '#fff6d6', drag: 2 });
      if (k >= 1) { f.phase = 2; f.t = 0; f.gift = -1; }
    }

    if (f.phase === 2) {

        AU.play('brazier', k); G.flash = Math.max(G.flash, 0.18); addShake(1.5);

      }
      if (Math.random() < 0.6 && f.gift >= 0) part({ x: gx + (Math.random() - 0.5) * 8, y: gy + (Math.random() - 0.5) * 8, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 20, life: 0.8, c: FL[f.gift].hot[1], drag: 2 });

      }
    }
    if (f.phase === 3) {
      if (Math.random() < 0.3) part({ x: gx + (Math.random() - 0.5) * 60, y: gy + (Math.random() - 0.5) * 40, vx: 0, vy: -15, life: 2, c: '#fff0c0', drag: 0 });
      if (f.t > 4.5 && !G.trans) {
        G.finished = true;
        if (G.best === null || G.time < G.best) G.best = G.time;

  }
  function drawFinaleFX(cx, cy) {
    const f = G.finale, r = G.room;
    const gx = r.great.x - cx, gy = r.greatFloor - 30 - cy;
    if (f.phase === 1) V.drawImage(S.lantern.lit[0][Math.floor(G.t * 9) % 3], Math.round(f.x - 3 - cx), Math.round(f.y - 4 - cy));
    if (f.phase === 2 && f.gift >= 0) {
      // the lantern hangs in the Beacon's glass, burning each colour as it gives it
      const k = f.gift, pulse = 1 - (f.t % 0.85) / 0.85;
      V.globalCompositeOperation = 'lighter';
      V.globalAlpha = 0.35 + pulse * 0.45; V.drawImage(A.lightSprite(26, FL[k].light, 4), gx - 27, gy - 27);
      V.globalAlpha = 1; V.globalCompositeOperation = 'source-over';
      V.drawImage(S.lantern.lit[k][Math.floor(G.t * 9) % 3], gx - 3, gy - 4);
    }
    if (f.lit) {
      // sweeping beams

      }
      V.globalAlpha = 1;
      V.globalCompositeOperation = 'source-over';
    }
  }

  // ------------------------------------------------------------------ pause
  let pauseItems = [];
  function openPause() {

  }
  function buildPauseItems() {
    return [
      { label: 'RESUME', act: () => { G.mode = 'play'; } },
      { label: 'RESTART ROOM', act: () => { G.mode = 'play'; if (!G.sim.p.dead) G.sim.kill(); } },
      { label: 'CONTROLS', act: () => openControls('pause') },
      { label: 'GAME SPEED  ' + Math.round(G.speed * 100) + '%', act: () => { G.speed = G.speed >= 1 ? 0.8 : G.speed >= 0.8 ? 0.6 : 1; writeSave(); } },
      { label: 'TARGET ASSIST  ' + (G.assist ? 'ON' : 'OFF'), act: () => { G.assist = !G.assist; applySettings(); writeSave(); } },
      { label: 'MUSIC  ' + (AU.musicOn ? 'ON' : 'OFF'), act: () => { unlockAudio(); AU.setMusicOn(!AU.musicOn); writeSave(); } },
      { label: 'SOUND  ' + (AU.sfxOn ? 'ON' : 'OFF'), act: () => { unlockAudio(); AU.setSfxOn(!AU.sfxOn); writeSave(); } },
      { label: document.fullscreenElement ? 'EXIT FULLSCREEN' : 'FULLSCREEN', act: () => toggleFullscreen() },
      { label: 'QUIT TO TITLE', act: () => { writeSave(); G.mode = 'title'; G.menu = 0; G.titleT = 0; G.lastTheme = null; if (audioStarted) AU.setMusic('title'); } },

  }
  function updatePause() {

    if (pressed.mup) { G.menu = (G.menu + pauseItems.length - 1) % pauseItems.length; AU.play('ui'); }
    if (pressed.mdown) { G.menu = (G.menu + 1) % pauseItems.length; AU.play('ui'); }
    if (pressed.select || clicked) { AU.play('select'); pauseItems[G.menu].act(); }
    else if (pressed.pause) { G.mode = 'play'; }
  }
  // menus follow the mouse: the item under the pointer is highlighted and a click on it selects it
  function menuMouse(items, y0, dy) {
    if (lastDevice !== 'mouse' || !mouseAt) return false;
    for (let i = 0; i < items.length; i++) {
      const y = y0 + i * dy;
      if (mouseAt[1] >= y - 2 && mouseAt[1] < y + dy - 2 && Math.abs(mouseAt[0] - VW / 2) <= A.textWidth(items[i].label) / 2 + 14) {
        if (G.menu !== i) { G.menu = i; AU.play('ui'); }
        return pressed.click;
      }
    }
    return false;
  }
  function renderPause() {
    renderPlay(true);

    V.globalAlpha = 0.72; V.fillStyle = '#07040c'; V.fillRect(0, 0, VW, VH); V.globalAlpha = 1;
    A.drawText(V, 'PAUSED', VW / 2, 22, '#ffffff', { align: 'center', scale: 2, shadow: '#2a1233' });
    pauseItems.forEach((it, i) => {
      const sel = i === G.menu;
      const y = 38 + i * 10;
      if (sel) { V.drawImage(S.lantern.lit[0][Math.floor(G.t * 9) % 3], VW / 2 - A.textWidth(it.label) / 2 - 12, y - 1); }
      A.drawText(V, it.label, VW / 2, y, sel ? '#ffd36b' : '#b9a8c9', { align: 'center', shadow: '#1a0d22' });
    });
    const tm = fmtTime(G.time);
    A.drawText(V, `${ROOM_CODE[G.roomIndex]} ${G.room.name}  ·  ${tm}  ·  DEATHS ${G.deaths}  ·  PETALS ${G.sim.taken.size}/${TOTAL_PETALS}`, VW / 2, 140, pal.hint, { align: 'center' });
  }

  // ------------------------------------------------------------------ controls
  // a row for each action and its keys, in up to three slots: pick a slot, select it, and press the key (or click
  // the mouse button) to put there. A key does one thing, so it leaves whatever it did before.
  const ctl = { row: 0, col: 0, capture: false, from: 'pause', msg: '', msgT: 0, warn: false };
  const CTL_Y = 30, CTL_DY = 10, CTL_X = [150, 206, 262], CTL_W = 54;
  function openControls(from) {
    ctl.from = from; ctl.row = 0; ctl.col = 0; ctl.capture = false; ctl.msgT = 0;
    G.mode = 'controls';
  }
  function closeControls() {
    ctl.capture = false;
    if (ctl.from === 'pause') { G.mode = 'pause'; G.menu = 2; } else { G.mode = 'title'; G.menu = Math.max(0, titleItems().findIndex(it => it.label === 'CONTROLS')); }
  }
  function ctlSay(msg, warn) { ctl.msg = msg; ctl.msgT = 2.5; ctl.warn = !!warn; }
  function captureKey(tok) {
    ctl.capture = false;
    // whatever was held when the key was pressed is let go: its binding may have just changed
    for (const a of ACTIONS) { keyHeld[a] = false; mouseHeld[a] = false; keyQueued[a] = false; }
    if (tok === 'Escape') { AU.play('ui'); return; }
    if (RESERVED.has(tok)) { ctlSay(tokName(tok, true) + ' IS KEPT FOR THE MENUS', true); AU.play('fizzle'); return; }
    const [act] = BINDABLE[ctl.row];
    let was = null;
    for (const [a, label] of BINDABLE) binds[a] = binds[a].map((t, i) => { if (t !== tok || (a === act && i === ctl.col)) return t; if (a !== act) was = label; return null; });
    binds[act][ctl.col] = tok;
    saveBinds();
    ctlSay(was ? tokName(tok, true) + ' NO LONGER ' + was : '', false);
    AU.play('select');
  }
  // the row and slot under the mouse, if it's over one
  function ctlMouse() {
    if (lastDevice !== 'mouse' || !mouseAt) return false;
    const [mx, my] = mouseAt, n = BINDABLE.length;
    const i = Math.floor((my - CTL_Y + 2) / CTL_DY);
    if (i < 0 || i > n + 2 || i === n) return false;
    let row = i < n ? i : i - 1, col = ctl.col;
    if (row < n) {
      col = CTL_X.findIndex(x => Math.abs(mx - x) <= CTL_W / 2);
      if (col < 0) { if (mx < CTL_X[0] - CTL_W / 2 && mx > 16) col = ctl.col; else return false; }
    } else if (Math.abs(mx - VW / 2) > 60) return false;
    if (row !== ctl.row || col !== ctl.col) { ctl.row = row; ctl.col = col; AU.play('ui'); }
    return pressed.click;
  }
  function updateControls() {
    if (ctl.msgT > 0) ctl.msgT -= DT;
    if (ctl.capture) return;

    else if (G.mode === 'title') updateTitle(DT);
    else if (G.mode === 'ending') updateEnding(DT);
    else if (G.mode === 'intro') updateIntro(DT);
  }
  function render(steps) {
    fxOn = steps > 0 && G.mode !== 'pause' && G.mode !== 'controls';
    if (G.mode === 'play') renderPlay();
    else if (G.mode === 'pause') renderPause();
    else if (G.mode === 'controls') renderControls();
    else if (G.mode === 'title') renderTitle();
    else if (G.mode === 'ending') renderEnding();
    else if (G.mode === 'intro') renderIntro();
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(view.c, 0, 0, screen.width, screen.height);
  }

  function boot(data) {
    resize();
    S = buildSprites();
    const sv = loadSave();
    if (sv) { G.best = sv.best === undefined ? null : sv.best; G.speed = sv.speed || 1; G.assist = sv.assist !== false; }
    applySettings();
    for (const b of [0, 1, 2]) backdrop(b, '');
    G.mode = 'title'; G.menu = 0; G.titleT = 0;
    const qi = roomFromQuery();
    if (qi >= 0) {
      G.mode = 'play'; G.lastBiome = -1; G.lastChapter = 0; G.lastTheme = null; G.trans = { phase: 'in', t: 0, dur: 0.6 };
      enterRoom(qi, true);
    } else if (data && typeof data.room === 'number' && data.mode === 'play') {
      G.sim.taken = new Set((data.petals || []).filter(id => PETAL_IDS.has(id)));
      G.deaths = data.deaths || 0; G.time = data.time || 0;
      G.mode = 'play'; G.lastBiome = -1; G.lastChapter = 0; G.lastTheme = null;
      enterRoom(Math.min(data.room, G.sim.rooms.length - 1), true);
    }
    document.getElementById('loading').hidden = true;
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) {
    try { hot.snapshot(() => ({ mode: G.mode === 'pause' || (G.mode === 'controls' && ctl.from === 'pause') ? 'play' : G.mode === 'controls' ? 'title' : G.mode, room: G.roomIndex, petals: [...G.sim.taken], deaths: G.deaths, time: G.time })); } catch (e) { /* optional */ }
  }
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});

  // test hooks (used for automated checks; harmless in play)
  window.__wickwing = {
    G, get S() { return S; }, enterRoom, startGame, press: (a, v) => { keyHeld[a] = v; if (v) keyQueued[a] = true; },
    // frames are sim inputs; a frame's press lists actions pressed on it (such as 'down' to talk)
    run(frames) { for (const f of frames) { G.t += DT; for (const a of ACTIONS) pressed[a] = !!(f.press && f.press.includes(a)); updatePlay(DT, f); } renderPlay(); sctx.drawImage(view.c, 0, 0, screen.width, screen.height); },
    freeze(on) { G.mode = on ? 'frozen' : 'play'; },
    // whole frames of the main loop, input and all (a tab in the background gets no animation frames)
    tick(n = 1) { for (let i = 0; i < n; i++) update(); render(n); },
  };
})();

</script>
